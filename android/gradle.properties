org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Flutter stable 3.44.x keeps AGP 9 built-in Kotlin disabled. Flutter 3.47+
# can opt in after the application and every Android plugin have migrated.
android.builtInKotlin=false
# Flutter keeps the AGP new DSL compatibility bridge disabled until its migration completes.
android.newDsl=false
