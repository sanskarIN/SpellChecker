org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Keep Flutter's AGP 9 Kotlin Gradle Plugin compatibility path until the
# project intentionally opts into built-in Kotlin on Flutter 3.47+ after
# verifying that every Android plugin has migrated.
android.builtInKotlin=false
# Flutter keeps the AGP new DSL compatibility bridge disabled until its migration completes.
android.newDsl=false
