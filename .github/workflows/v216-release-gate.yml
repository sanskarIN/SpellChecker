name: V2.16 independent final release gate

on:
  push:
    branches:
      - v2.16-final-stabilization-2026-08-15
    paths:
      - .github/workflows/v216-release-gate.yml

permissions:
  contents: write

jobs:
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact V2.16 candidate
        uses: actions/checkout@v4
        with:
          ref: v2.16-final-stabilization-2026-08-15
          fetch-depth: 0
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Resolve dependencies
        run: flutter pub get
      - name: Check canonical formatting
        run: dart format --output=none --set-exit-if-changed lib test tool
      - name: Analyze
        run: flutter analyze
      - name: Run complete Flutter suite
        run: flutter test --reporter expanded
      - name: Run deterministic benchmark smoke
        run: |
          dart run tool/benchmark_large_document.dart \
            --repeats=4 \
            --warmup=0 \
            --iterations=1 \
            --spelling-limit=2 \
            --writing-limit=5 \
            --suggestions=0 \
            --language=en-US \
            --json
      - name: Build release web application
        run: flutter build web --release
      - name: Check repository whitespace
        run: git diff --check
      - name: Verify exact V2.16 release and audit contracts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re

          def require(condition, message):
              if not condition:
                  raise SystemExit(message)

          pubspec = Path('pubspec.yaml').read_text()
          require(re.search(r'^version: 2\.16\.0\+21$', pubspec, re.M), 'package version is not exactly 2.16.0+21')

          page = Path('lib/features/editor/spell_checker_page.dart').read_text()
          require("applicationVersion: '2.16.0'" in page, 'About version is not exactly 2.16.0')

          analyzer = Path('lib/writing/writing_analyzer.dart').read_text()
          constructors = re.findall(r'\b[A-Z][A-Za-z0-9]+Rule\(\)', analyzer)
          require(len(constructors) == 10, f'expected exactly 10 built-in writing-rule constructors, found {len(constructors)}: {constructors}')

          edit = Path('lib/core/edit_distance.dart').read_text()
          require('lastSourceRowByRune' in edit, 'unrestricted Damerau-Levenshtein last-seen recurrence is missing')
          edit_tests = Path('test/edit_distance_test.dart').read_text()
          require("damerauLevenshteinDistance('CA', 'ABC'), 2" in edit_tests, 'canonical unrestricted CA -> ABC regression missing')
          require('𐐀' in edit_tests, 'astral Unicode edit-distance regression missing')

          language_tests = Path('test/language_pack_test.dart').read_text()
          require('decomposed combining-mark words' in language_tests, 'decomposed Unicode tokenization regression missing')
          require("Cafe\\u0301" in language_tests, 'decomposed Latin composition regression missing')

          dictionary_tests = Path('test/personal_dictionary_codec_test.dart').read_text()
          require('present non-integer object version' in dictionary_tests, 'strict personal-dictionary version regression missing')

          settings_tests = Path('test/settings_transfer_codec_test.dart').read_text()
          require('duplicate rule IDs' in settings_tests, 'duplicate Portable Settings rule-ID regression missing')

          preference_tests = Path('test/dictionary_preferences_test.dart').read_text()
          require('propagates failed language persistence writes' in preference_tests, 'failed preference-write regression missing')
          require('does not report legacy migration as successful after a failed write' in preference_tests, 'failed migration-write regression missing')

          startup_tests = Path('test/v216_startup_preference_sync_widget_test.dart').read_text()
          require('refreshes an early spelling check after saved language loads' in startup_tests, 'startup spelling refresh regression missing')
          require('Writing insights waits for saved preferences to finish loading' in startup_tests, 'startup Writing insights regression missing')
          require('Ignore once cannot mutate the temporary startup engine' in startup_tests, 'startup Ignore-once regression missing')
          require('ensureVisible(ignoreOnce)' in startup_tests and 'await tester.pump();' in startup_tests, 'deterministic startup Ignore hit-test regression missing')

          correction_tests = Path('test/text_correction_test.dart').read_text()
          require('astral Unicode title capitalization' in correction_tests, 'Unicode-safe correction casing regression missing')
          require('uncased scripts' in correction_tests, 'uncased-script correction regression missing')

          ledger = Path('what_changed.md').read_text()
          require('## V2.16 — Final Stabilization and Bug Audit' in ledger, 'V2.16 what_changed ledger missing')
          require('### Release synchronization, formatting, and repository hygiene' in ledger, 'V2.16 release evidence ledger missing')

          changelog = Path('CHANGELOG.md').read_text()
          require('## [2.16.0] - 2026-08-15' in changelog, 'V2.16 changelog entry missing')
          readme = Path('README.md').read_text()
          require('`2.16.0+21`' in readme and 'Final Stabilization and Bug Audit' in readme, 'README V2.16 current-release identity missing')
          require(Path('docs/V2_16_BUG_AUDIT.md').is_file(), 'V2.16 bug audit doc missing')
          require(Path('docs/V2_16_FINAL_VALIDATION.md').is_file(), 'V2.16 final validation doc missing')

          manifest = json.loads(Path('web/manifest.json').read_text())
          description = manifest.get('description', '')
          require('V2.16' in description and 'final stabilization' in description.lower(), 'web manifest V2.16 final-stabilization description missing')

          dependency_lines = []
          in_dependencies = False
          for line in pubspec.splitlines():
              if line == 'dependencies:':
                  in_dependencies = True
                  continue
              if in_dependencies and line and not line.startswith(' '):
                  break
              if in_dependencies and re.match(r'^  [a-zA-Z0-9_]+:', line):
                  dependency_lines.append(line.strip().split(':', 1)[0])
          require(dependency_lines == ['flutter', 'shared_preferences'], f'unexpected direct runtime dependencies: {dependency_lines}')

          require(Path('build/web/index.html').is_file(), 'release web index.html missing')
          require(Path('build/web/main.dart.js').is_file(), 'release web main.dart.js missing')
          require(not Path('docs/V2_16_FINAL_STABILIZATION_SCOPE.md').exists(), 'superseded V2.16 working scope still tracked')

          unexpected = []
          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts or 'build' in path.parts or '.dart_tool' in path.parts:
                  continue
              name = path.as_posix().lower()
              if 'v216' not in name:
                  continue
              if name == '.github/workflows/v216-release-gate.yml':
                  continue
              if name in {'docs/v2_16_bug_audit.md', 'docs/v2_16_final_validation.md'}:
                  continue
              if any(token in name for token in ('diagnostic', 'patch', 'sync', 'format', 'gate', 'working_scope')):
                  unexpected.append(name)
          require(not unexpected, f'unexpected V2.16 helper residue: {unexpected}')

          print('V2.16 exact release/audit contracts verified.')
          PY
      - name: Remove one-time release gate
        run: |
          git rm .github/workflows/v216-release-gate.yml
          git commit -m "ci(v216): remove independent final release gate"
      - name: Push release-gate cleanup
        run: git push origin HEAD:v2.16-final-stabilization-2026-08-15
