name: V2.10 engineering ledger sync

on:
  push:
    branches:
      - v2.10-deterministic-benchmarks

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out V2.10 branch
        uses: actions/checkout@v7
        with:
          ref: v2.10-deterministic-benchmarks
          fetch-depth: 0

      - name: Append guarded V2.10 engineering ledger
        shell: bash
        run: |
          python3 <<'PY'
          import base64
          from pathlib import Path

          path = Path('what_changed.md')
          text = path.read_text()
          heading = '## V2.10 — Deterministic Large-Document Benchmarking'
          if heading not in text:
              payload = base64.b64decode('').decode()
              path.write_text(text.rstrip() + '\n' + payload.lstrip())
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- what_changed.md; then
            git add what_changed.md
            git commit -m "docs: record complete V2.10 engineering changes"
            git push origin HEAD:v2.10-deterministic-benchmarks
          fi
