name: Validate V1.3 complete release

on:
  push:
    branches:
      - v1.3-language-architecture
    paths:
      - .github/workflows/v13-final-validate.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out latest V1.3 branch
        uses: actions/checkout@v4
        with:
          ref: v1.3-language-architecture
          fetch-depth: 0

      - name: Verify integration completion markers
        run: |
          test ! -e tools/v13_apply.py
          test ! -e tools/v13_ensure_integration.py
          test ! -e tools/v13_docs_apply.py
          test ! -e tools/v13_variant_guard.py
          test ! -e .github/workflows/v13-apply.yml
          test ! -e .github/workflows/v13-ensure-integration.yml
          test ! -e .github/workflows/v13-docs-apply.yml
          test ! -e .github/workflows/v13-variant-guard.yml
          grep -F 'version: 1.3.0+4' pubspec.yaml
          grep -F "ValueKey<String>('language-selector')" lib/features/editor/spell_checker_page.dart
          grep -F 'encodeForLanguage' lib/features/editor/dictionary_manager_dialog.dart
          grep -F "export 'core/spell_language_pack.dart';" lib/spell_checker.dart
          grep -F 'words.removeAll(EnglishGbDictionary.words)' lib/core/spell_language_pack.dart
          grep -F '`1.3.0+4`' README.md
          grep -F '## [1.3.0]' CHANGELOG.md
          grep -F '## 1.3 — Language architecture' docs/ROADMAP.md
          grep -F 'Status: implemented.' docs/ROADMAP.md
          grep -F '# Language Packs' docs/LANGUAGE_PACKS.md

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show tool versions
        run: |
          flutter --version
          dart --version

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --reporter expanded

      - name: Build release web app
        run: flutter build web --release

      - name: Record validation
        run: |
          cat > V1.3_VALIDATED.md <<'EOF'
          # SpellChecker V1.3 validation

          This marker is generated only after the dedicated V1.3 validation workflow successfully completes:

          - integration-helper cleanup checks
          - release/version/documentation marker checks
          - `flutter pub get`
          - Dart formatting verification for `lib` and `test`
          - `flutter analyze`
          - `flutter test --reporter expanded`
          - `flutter build web --release`

          The normal pull-request CI workflow still validates the final PR head after this marker commit.
          EOF
          rm .github/workflows/v13-final-validate.yml

      - name: Commit validation record
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: record complete v1.3 release validation"
          git pull --rebase origin v1.3-language-architecture
          git push origin HEAD:v1.3-language-architecture
