name: V2.2 Release Gate

on:
  pull_request:
    branches: [v2.2-release-gate-base]

permissions:
  contents: write

jobs:
  reconcile-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out recovery branch
        uses: actions/checkout@v7
        with:
          ref: v2.2-release-recovery
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply V2.2 page integration
        run: python tools/v22_apply.py

      - name: Apply V2.2 documentation integration
        run: python tools/v22_docs_apply.py

      - name: Apply V2.2 widget viewport repair
        run: python tools/v22_test_viewport.py

      - name: Remove one-time helpers
        run: rm -f tools/v22_apply.py tools/v22_docs_apply.py tools/v22_test_viewport.py

      - name: Format
        run: dart format lib test

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --reporter expanded

      - name: Build release web app
        run: flutter build web --release

      - name: Assert permanent V2.2 tree
        shell: bash
        run: |
          grep -q '^version: 2.2.0+7$' pubspec.yaml
          grep -q "applicationVersion: '2.2.0'" lib/features/editor/spell_checker_page.dart
          grep -q 'Review filters — V2.2' README.md
          grep -q '## \[2.2.0\]' CHANGELOG.md
          test ! -e tools/v22_apply.py
          test ! -e tools/v22_docs_apply.py
          test ! -e tools/v22_test_viewport.py
          if find .github/workflows -maxdepth 1 -type f -name 'v22-*' | grep -q .; then
            echo 'Unexpected V2.2 temporary workflow in candidate tree.' >&2
            exit 1
          fi

      - name: Commit exact validated tree
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No reconciliation changes to commit.'
          else
            git commit -m 'Finalize V2.2 release integration'
            git push origin HEAD:v2.2-release-recovery
          fi
