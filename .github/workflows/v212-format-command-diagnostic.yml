name: V2.12 permanent format-command diagnostic

on:
  push:
    branches:
      - v2.12-missing-punctuation-space-2026-08-15

permissions:
  contents: write

concurrency:
  group: v212-format-command-diagnostic
  cancel-in-progress: true

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out current branch head
        uses: actions/checkout@v7
        with:
          ref: v2.12-missing-punctuation-space-2026-08-15
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Reproduce permanent CI format check
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          set +e
          dart format --output=none --set-exit-if-changed lib test tool >v212_format_check.log 2>&1
          status=$?
          set -e

          if [ "$status" -eq 0 ]; then
            echo "Permanent format-check command succeeds on this head."
            rm -f v212_format_check.log
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git rm .github/workflows/v212-format-command-diagnostic.yml
            git commit -m "ci: remove successful format-command diagnostic"
            git push origin HEAD:v2.12-missing-punctuation-space-2026-08-15
            exit 0
          fi

          {
            echo "exit_code=$status"
            flutter --version
            dart --version
            echo
            echo "command: dart format --output=none --set-exit-if-changed lib test tool"
            echo
            cat v212_format_check.log
            echo
            echo "post-command git diff:"
            git diff --name-status -- lib test tool
          } > v212_format_check_error.txt
          rm -f v212_format_check.log

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v212_format_check_error.txt
          git commit -m "ci: capture permanent format-check failure"
          git push origin HEAD:v2.12-missing-punctuation-space-2026-08-15
          exit "$status"
