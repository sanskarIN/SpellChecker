name: V2.15 second test diagnostic

on:
  push:
    branches: [v2.15-unmatched-curly-brace-2026-08-15]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out V2.15 branch
        uses: actions/checkout@v7
        with:
          ref: v2.15-unmatched-curly-brace-2026-08-15

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Run focused Writing insights suite
        shell: bash
        run: |
          set +e
          flutter test test/writing_widget_test.dart --reporter expanded > /tmp/focused.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            payload=$(python3 - <<'PY'
          from pathlib import Path
          lines = Path('/tmp/focused.log').read_text(errors='replace').splitlines()
          first = next((i for i, line in enumerate(lines) if ' -1:' in line), None)
          start = max(0, (first or len(lines)) - 18)
          end = min(len(lines), (first or len(lines)) + 40)
          text = '\n'.join(lines[start:end])
          print(text.replace('%','%25').replace('\r','%0D').replace('\n','%0A'))
          PY
            )
            echo "::error title=V2.15 focused writing-widget failure::$payload"
            exit "$status"
          fi

      - name: Run complete suite and expose first failure
        shell: bash
        run: |
          set +e
          flutter test --reporter expanded > /tmp/full.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            payload=$(python3 - <<'PY'
          from pathlib import Path
          lines = Path('/tmp/full.log').read_text(errors='replace').splitlines()
          first = next((i for i, line in enumerate(lines) if ' -1:' in line), None)
          start = max(0, (first or len(lines)) - 18)
          end = min(len(lines), (first or len(lines)) + 40)
          text = '\n'.join(lines[start:end])
          print(text.replace('%','%25').replace('\r','%0D').replace('\n','%0A'))
          PY
            )
            echo "::error title=V2.15 full-suite failure::$payload"
            exit "$status"
          fi
