name: V2.14 post-merge ledger synchronization

on:
  push:
    branches:
      - v2.14-post-merge-validation-2026-08-15

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out post-merge evidence branch
        uses: actions/checkout@v7
        with:
          ref: v2.14-post-merge-validation-2026-08-15
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Record final V2.14 evidence in what_changed.md
        run: python3 tool/v214_post_merge_ledger.py

      - name: Remove post-merge ledger helper
        run: |
          rm tool/v214_post_merge_ledger.py
          git add tool/v214_post_merge_ledger.py
          git commit -m "chore(v214): remove post-merge ledger helper"

      - name: Remove post-merge synchronization workflow
        run: |
          rm .github/workflows/v214-post-merge-ledger.yml
          git add .github/workflows/v214-post-merge-ledger.yml
          git commit -m "ci(v214): remove post-merge ledger workflow"

      - name: Push post-merge evidence commits
        run: git push origin HEAD:v2.14-post-merge-validation-2026-08-15
