name: V2.10 documentation sync

on:
  push:
    branches:
      - v2.10-deterministic-benchmarks

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out V2.10 branch
        uses: actions/checkout@v7
        with:
          ref: v2.10-deterministic-benchmarks
          fetch-depth: 0

      - name: Apply guarded V2.10 documentation updates
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if new in text:
                  return
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected exact replacement once, found {text.count(old)}')
              p.write_text(text.replace(old, new, 1))

          def insert_before(path, marker, heading, section):
              p = Path(path)
              text = p.read_text()
              if heading in text:
                  return
              if text.count(marker) != 1:
                  raise SystemExit(f'{path}: insertion marker count is {text.count(marker)}')
              p.write_text(text.replace(marker, section + marker, 1))

          def append_section(path, heading, section):
              p = Path(path)
              text = p.read_text()
              if heading in text:
                  return
              if not text.endswith('\n'):
                  text += '\n'
              p.write_text(text + '\n' + section)

          replace_once(
              'lib/features/editor/spell_checker_page.dart',
              "applicationVersion: '2.9.0',",
              "applicationVersion: '2.10.0',",
          )

          replace_once(
              'test/widget_test.dart',
              "testWidgets('About dialog reports the current V2.9 release',",
              "testWidgets('About dialog reports the current V2.10 release',",
          )
          replace_once(
              'test/widget_test.dart',
              "expect(find.textContaining('2.9.0'), findsOneWidget);",
              "expect(find.textContaining('2.10.0'), findsOneWidget);",
          )

          replace_once(
              'README.md',
              '- Deterministic privacy-safe V2.9 writing-analysis diagnostic summaries containing counts and rule metadata only.\n',
              '- Deterministic privacy-safe V2.9 writing-analysis diagnostic summaries containing counts and rule metadata only.\n- Developer-run V2.10 deterministic large-document benchmark tooling with synthetic corpus generation, versioned JSON/human reports, and CI smoke coverage.\n',
          )
          replace_once('README.md', '`2.9.0+14`', '`2.10.0+15`')
          replace_once(
              'README.md',
              'Version 2.9 is the **Shareable Writing-Analysis Diagnostics** release. It adds a deterministic `WritingAnalysisDiagnosticSummary` layer over V2.8 exact finding counts so bug reports, performance investigations, and support discussions can share language, capture-state, count, and rule metadata without serializing editor text, finding excerpts/messages, replacements, or source offsets. The V2.9 hardening pass also closes release-only invariant gaps, preserves active IME composing spans, aligns Unicode word statistics with spelling tokenization, normalizes custom frequency metadata, and removes obsolete reconciliation workflows.',
              'Version 2.10 is the **Deterministic Large-Document Benchmarking** release. It adds a developer-run synthetic benchmark harness for bounded spelling and writing analysis, immutable timing/outcome summaries, stable versioned JSON and human-readable reports, strict CLI validation, and permanent CI/release smoke coverage. The benchmark never reads editor documents, adds no telemetry or persistence, and does not turn machine-dependent timing values into correctness thresholds.',
          )
          insert_before(
              'README.md',
              '## Shareable writing-analysis diagnostics — V2.9\n',
              '## Deterministic large-document benchmark — V2.10',
              '''## Deterministic large-document benchmark — V2.10\n\nV2.10 adds a developer-run benchmark target built from generated synthetic text and a fixed benchmark dictionary/frequency table, so corpus shape and spelling eligibility remain stable when bundled dictionaries evolve. Each measured iteration creates fresh spelling/analyzer state and records bounded spelling scan metadata plus exact writing-analysis totals.\n\n```bash\ndart run tool/benchmark_large_document.dart \\\n  --repeats=2000 \\\n  --warmup=1 \\\n  --iterations=5 \\\n  --spelling-limit=200 \\\n  --writing-limit=200 \\\n  --suggestions=5 \\\n  --language=en-US \\\n  --json\n```\n\nOmit `--json` for the human-readable report. Reports include only scenario shape, language, analysis outcome counts/states, and elapsed microseconds; they never serialize the generated corpus text. Timings are machine/toolchain dependent and are intended for controlled comparisons, not pass/fail correctness thresholds. Both `en-US` and `en-GB` are supported.\n\nThe benchmark lives under `tool/` and is not an application telemetry feature or a new public runtime API. CI runs only a tiny synthetic smoke scenario to verify the command remains executable; it does not enforce timing targets. See [Performance and large-document behavior](docs/PERFORMANCE.md).\n\n''',
          )

          insert_before(
              'CHANGELOG.md',
              '## [2.9.0] - 2026-08-14\n',
              '## [2.10.0] - 2026-08-14',
              '''## [2.10.0] - 2026-08-14\n\n### Added\n\n- Deterministic generated large-document benchmark scenario with validated spelling/writing capture bounds and suggestion limits.\n- Fixed synthetic benchmark dictionary/frequency metadata so benchmark spelling eligibility does not drift with bundled vocabulary updates.\n- Fresh-state spelling and writing benchmark runner with configurable warmup and measured iterations.\n- Immutable per-iteration samples plus summary-level min/median/max microsecond aggregates and deterministic analysis-outcome consistency validation.\n- Version-1 JSON benchmark report and a human-readable terminal report; both exclude corpus text.\n- Strict CLI options for repetitions, warmups, iterations, spelling/writing limits, suggestions, built-in language selection, JSON output, and help.\n- Focused tests for scenario generation, result invariants/aggregation, runner behavior, option parsing, report privacy, and command execution.\n- Permanent CI and tagged-release benchmark smoke commands using a tiny synthetic workload.\n\n### Changed\n\n- Package version advances to `2.10.0+15`; About version advances to `2.10.0`.\n- Formatter validation now includes tracked Dart under `tool/` in addition to `lib/` and `test/`.\n- V2.10 release, roadmap, performance, testing, development, privacy, security, support, contribution, architecture, troubleshooting, and bug-report guidance document the benchmark contract.\n\n### Compatibility, performance, security, and privacy\n\n- V2.10 changes no spelling/writing public runtime API, language ID, writing-rule ID, persisted preference key, transfer format, correction behavior, or application UI workflow beyond release-version metadata.\n- Benchmark timing values are explicitly machine/toolchain dependent and are not correctness thresholds.\n- The benchmark corpus is generated from a source-controlled synthetic chunk and the JSON/human reports serialize scenario shape and counts/timings, not corpus text.\n- V2.10 adds no runtime dependency, analytics, telemetry, account behavior, cloud writing service, document persistence, background upload, or application network request.\n\n''',
          )

          insert_before(
              'docs/ROADMAP.md',
              '## Future 2.x direction\n',
              '## 2.10 — Deterministic large-document benchmarking',
              '''## 2.10 — Deterministic large-document benchmarking\n\nStatus: implemented.\n\n- [x] Source-controlled deterministic synthetic large-document corpus generator.\n- [x] Positive configurable spelling and writing capture bounds plus non-negative suggestion limit.\n- [x] Fixed benchmark dictionary/frequency metadata independent from bundled dictionary growth.\n- [x] Configurable warmup and measured iteration counts.\n- [x] Fresh spelling engine and writing analyzer state for every benchmark sample.\n- [x] Immutable per-iteration timing/outcome samples.\n- [x] Summary-level min/median/max timing aggregates.\n- [x] Deterministic analysis-outcome consistency validation across measured samples.\n- [x] Versioned JSON benchmark report with no corpus-text serialization.\n- [x] Human-readable report with the same privacy boundary.\n- [x] Strict command-line parsing and usage diagnostics.\n- [x] Built-in `en-US` and `en-GB` benchmark selection.\n- [x] Focused benchmark scenario/result/runner/options/reporter/command regression coverage.\n- [x] CI/release formatting coverage for `tool/` and a threshold-free synthetic benchmark smoke run.\n- [x] No public runtime API, persistence-format, telemetry, application-network, or runtime-dependency expansion.\n\n''',
          )
          replace_once(
              'docs/ROADMAP.md',
              '- A future V2.10 milestone should be selected from demonstrated user/contributor workflows rather than adding network behavior by default.',
              '- Future 2.x milestones should continue to be selected from demonstrated user/contributor workflows rather than adding network behavior by default.',
          )

          append_section(
              'docs/PERFORMANCE.md',
              '## V2.10 deterministic benchmark harness',
              '''## V2.10 deterministic benchmark harness\n\nV2.10 implements the external benchmark harness anticipated by the V2.8 profiling guidance. Run it from a dependency-resolved checkout:\n\n```bash\ndart run tool/benchmark_large_document.dart --repeats=2000 --warmup=1 --iterations=5 --spelling-limit=200 --writing-limit=200 --suggestions=5 --language=en-US\n```\n\nAdd `--json` for the stable version-1 machine-readable report. The default scenario repeats a source-controlled synthetic chunk; no editor document, clipboard content, personal dictionary, or persisted preference is read. A fixed synthetic spelling dictionary/frequency map keeps benchmark eligibility stable when bundled vocabulary changes.\n\nEvery sample creates a fresh `SpellCheckerEngine` and `WritingAnalyzer`. Warmup samples are discarded; measured samples must produce identical analysis outcomes or summary construction fails. The report records spelling scanned/captured/truncated metadata and writing captured/exact-total/truncated metadata alongside elapsed microseconds.\n\nMin/median/max timings are descriptive only. They vary with hardware, operating system, Flutter/Dart version, process scheduling, build/runtime mode, and other machine conditions. CI therefore executes a small smoke scenario solely to prove the benchmark command and report path work; it does not compare timing values against a threshold.\n\nFor comparisons, keep the command/options, Flutter/Dart versions, machine/runtime mode, and repository commit constant. Prefer multiple measured iterations and compare medians. Never replace the built-in synthetic corpus with private user documents for public benchmark reports.\n''',
          )

          append_section(
              'docs/TESTING.md',
              '## V2.10 benchmark regression contract',
              '''## V2.10 benchmark regression contract\n\nBenchmark tooling is tested as correctness infrastructure, not with wall-clock thresholds. The V2.10 suite covers deterministic corpus generation and metadata privacy, scenario bound validation, sample/result invariants, odd/even median aggregation, immutable samples, stable outcome validation across iterations, runner behavior for US/UK packs, strict CLI parsing, human/JSON corpus-text exclusion, help/error exits, and a small end-to-end JSON command run.\n\nPermanent CI formatting now includes `tool/`, then runs `flutter analyze`, the complete Flutter test suite, and a tiny synthetic benchmark CLI smoke command. The release workflow repeats those checks before the web build. Timing values themselves must not become pass/fail expectations unless the project later establishes a controlled benchmark environment with an explicitly reviewed policy.\n''',
          )

          append_section(
              'docs/DEVELOPMENT.md',
              '## V2.10 benchmark development workflow',
              '''## V2.10 benchmark development workflow\n\nUse the benchmark only with its generated synthetic corpus when producing repository/public comparison data:\n\n```bash\ndart run tool/benchmark_large_document.dart --repeats=2000 --warmup=1 --iterations=5 --spelling-limit=200 --writing-limit=200 --suggestions=5 --language=en-US --json\n```\n\nWhen changing benchmark code, run formatting over `lib test tool`, `flutter analyze`, the complete tests, and at least one small benchmark command. Do not tune implementation behavior solely to one machine's timing, commit timing thresholds to normal correctness tests, or add editor-document ingestion/telemetry as part of benchmark maintenance. Changes to corpus shape, fixed benchmark vocabulary, report format version, or outcome fields require focused tests and performance/privacy documentation review.\n''',
          )

          append_section(
              'docs/PRIVACY.md',
              '## V2.10 benchmark privacy boundary',
              '''## V2.10 benchmark privacy boundary\n\nThe V2.10 large-document benchmark is developer-run tooling under `tool/`. It generates its own source-controlled synthetic corpus and does not read the editor, clipboard, personal dictionary, ignored words, local preferences, correction history, files containing user documents, or application telemetry.\n\nHuman and JSON benchmark reports serialize scenario shape, language ID, analysis counts/states, iteration counts, and elapsed microseconds. They deliberately do not serialize the generated corpus text. The benchmark does not persist reports automatically or upload them; shell redirection or external CI artifact handling is controlled by the person/build environment invoking the command.\n\nBenchmark timing can reveal machine/toolchain characteristics, so public reports should include only the minimum environment metadata needed for reproducibility and should never contain private user documents. V2.10 adds no application runtime telemetry, analytics, account behavior, network request, preference key, document persistence, or runtime dependency.\n''',
          )

          append_section(
              'SECURITY.md',
              '## V2.10 benchmark security boundary',
              '''## V2.10 benchmark security boundary\n\nThe V2.10 benchmark is source-controlled developer tooling, not an application service, plugin loader, or execution sandbox. CLI values are parsed as bounded integer/language configuration and are not evaluated as code. Unsupported language IDs and malformed/duplicate options are rejected.\n\nThe benchmark uses generated synthetic text and fixed in-process dictionary metadata. It does not automatically read arbitrary document paths, execute imported content, contact a remote endpoint, write preferences, or upload results. Timing numbers are descriptive machine-local measurements and must not be treated as a security/resource guarantee. Untrusted third-party rule code or arbitrarily large externally supplied documents remain outside this benchmark's threat/resource boundary.\n''',
          )

          replace_once(
              'docs/RELEASING.md',
              'Current V2.9 release candidate:\n\n```text\n2.9.0+14\n```',
              'Current V2.10 release candidate:\n\n```text\n2.10.0+15\n```',
          )
          replace_once(
              'docs/RELEASING.md',
              'dart format --output=none --set-exit-if-changed lib test\nflutter analyze\nflutter test --reporter expanded\nflutter build web --release',
              'dart format --output=none --set-exit-if-changed lib test tool\nflutter analyze\nflutter test --reporter expanded\ndart run tool/benchmark_large_document.dart --repeats=4 --warmup=0 --iterations=1 --spelling-limit=2 --writing-limit=5 --suggestions=0 --language=en-US --json\nflutter build web --release',
          )
          replace_once(
              'docs/RELEASING.md',
              'dart format --output=none --set-exit-if-changed lib test\nflutter analyze\nflutter test --reporter expanded',
              'dart format --output=none --set-exit-if-changed lib test tool\nflutter analyze\nflutter test --reporter expanded\ndart run tool/benchmark_large_document.dart --repeats=4 --warmup=0 --iterations=1 --spelling-limit=2 --writing-limit=5 --suggestions=0 --language=en-US --json',
          )
          replace_once(
              'docs/RELEASING.md',
              'git tag -a v2.9.0 -m "SpellChecker v2.9.0"\ngit push origin v2.9.0',
              'git tag -a v2.10.0 -m "SpellChecker v2.10.0"\ngit push origin v2.10.0',
          )
          replace_once(
              'docs/RELEASING.md',
              '3. Highlight V2.9 privacy-safe shareable writing-analysis diagnostic summaries, retained V2.8 exact-count diagnostics, and V2.7 bounded-review safety, while noting compatibility with earlier writing-rule, Portable settings, ranking, and correction-safety foundations.',
              '3. Highlight V2.10 deterministic synthetic large-document benchmarking, retained V2.9 privacy-safe diagnostic summaries, V2.8 exact-count diagnostics, and V2.7 bounded-review safety, while noting compatibility with earlier writing-rule, Portable settings, ranking, and correction-safety foundations.',
          )
          replace_once(
              'docs/RELEASING.md',
              'V2.8 adds no new runtime dependency. `shared_preferences` remains the application-local preference adapter.',
              'V2.10 adds no new runtime dependency. `shared_preferences` remains the application-local preference adapter.',
          )
          append_section(
              'docs/RELEASING.md',
              '## V2.10 deterministic benchmark release checks',
              '''## V2.10 deterministic benchmark release checks\n\nBefore tagging V2.10, verify package/About versions `2.10.0+15` / `2.10.0`; deterministic scenario generation and option validation; immutable/stable benchmark result aggregation; US/UK runner coverage; human/JSON report exclusion of corpus text; formatter coverage for `tool/`; the threshold-free benchmark smoke command in both CI and release workflows; unchanged runtime dependencies/persistence formats; complete regression tests; and `flutter build web --release`.\n\nRun the documented benchmark command on synthetic data only and record the exact command plus Flutter/Dart versions when publishing comparative timing evidence. Do not fail a release merely because machine-dependent elapsed values differ from another machine. Confirm no temporary V2.10 synchronization/validation workflow remains in the release tree before tagging.\n''',
          )

          append_section(
              'SUPPORT.md',
              '## V2.10 benchmark support',
              '''## V2.10 benchmark support\n\nFor V2.10 benchmark questions, include the exact benchmark command, selected built-in language, Flutter/Dart versions, scenario repetition/limit values, and the metadata-only report output when safe. Use the built-in synthetic corpus; do not attach private documents to reproduce performance observations. Timing differences are meaningful only when the compared environment/toolchain and command are controlled. Malformed options, unsupported language IDs, changing analysis outcomes across measured iterations, or benchmark command crashes are correctness/support issues; a slower number on unrelated hardware by itself is not.\n''',
          )

          append_section(
              'CONTRIBUTING.md',
              '## V2.10 benchmark contributions',
              '''## V2.10 benchmark contributions\n\nBenchmark changes must preserve synthetic-only corpus generation, report-text exclusion, fixed benchmark spelling metadata unless intentionally versioned, strict option validation, and threshold-free normal CI. Include focused tests for corpus/result/options/report changes. If the JSON shape changes incompatibly, advance its format version and document migration/consumer impact. Do not add real user documents, private corpora, network telemetry, automatic result upload, or machine-specific pass/fail timing thresholds to normal project validation.\n''',
          )

          append_section(
              'docs/ARCHITECTURE.md',
              '## V2.10 benchmark tooling boundary',
              '''## V2.10 benchmark tooling boundary\n\nV2.10 adds a developer-tooling layer under `tool/`; it is intentionally outside the application runtime and public package barrels. The benchmark scenario owns deterministic synthetic corpus shape, the runner composes existing public spelling/writing APIs with fresh per-sample state, result models own immutable timing/outcome aggregation and versioned JSON serialization, the reporter owns terminal rendering, and the command/options layer owns CLI validation.\n\nThis direction keeps performance observation separate from production `SpellCheckReport` and `WritingAnalysisResult` correctness metadata: runtime analysis models remain deterministic and timing-free, while developer tooling may measure elapsed wall-clock time externally. No storage adapter, editor widget, persisted key, network boundary, or rule/ranker plugin contract is added by V2.10.\n''',
          )

          append_section(
              'docs/TROUBLESHOOTING.md',
              '## V2.10 benchmark troubleshooting',
              '''## V2.10 benchmark troubleshooting\n\nIf the benchmark command rejects an option, run `dart run tool/benchmark_large_document.dart --help` and use the documented `--name=value` forms. Repeated options are rejected deliberately, numeric bounds/iteration counts must satisfy their positive/non-negative contracts, and language IDs are limited to the built-in `en-US` / `en-GB` packs.\n\nIf analysis outcomes differ between measured samples, treat that as a determinism defect and report the exact commit/command using synthetic data. If only elapsed times differ, first compare Flutter/Dart versions, hardware, runtime load, build/runtime mode, options, and commit; timing variation alone is expected and is not a normal correctness failure.\n''',
          )
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          commit_one() {
            path="$1"
            message="$2"
            if ! git diff --quiet -- "$path"; then
              git add "$path"
              git commit -m "$message"
            fi
          }

          commit_one lib/features/editor/spell_checker_page.dart "chore: update About metadata for V2.10"
          commit_one test/widget_test.dart "test: expect V2.10 About metadata"
          commit_one README.md "docs: publish V2.10 benchmark README"
          commit_one CHANGELOG.md "docs: add V2.10 benchmark changelog"
          commit_one docs/ROADMAP.md "docs: mark V2.10 benchmark milestone implemented"
          commit_one docs/PERFORMANCE.md "docs: define V2.10 benchmark performance contract"
          commit_one docs/TESTING.md "docs: define V2.10 benchmark test contract"
          commit_one docs/DEVELOPMENT.md "docs: document V2.10 benchmark development workflow"
          commit_one docs/PRIVACY.md "docs: document V2.10 benchmark privacy boundary"
          commit_one SECURITY.md "docs: document V2.10 benchmark security boundary"
          commit_one docs/RELEASING.md "docs: advance release procedure to V2.10"
          commit_one SUPPORT.md "docs: add V2.10 benchmark support guidance"
          commit_one CONTRIBUTING.md "docs: add V2.10 benchmark contribution rules"
          commit_one docs/ARCHITECTURE.md "docs: document V2.10 benchmark architecture"
          commit_one docs/TROUBLESHOOTING.md "docs: add V2.10 benchmark troubleshooting"

          git push origin HEAD:v2.10-deterministic-benchmarks
