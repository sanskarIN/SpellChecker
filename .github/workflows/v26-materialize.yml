name: V2.6 One-Time Materializer

on:
  push:
    branches: [v2.6-writing-rule-catalogue]

permissions:
  contents: write

concurrency:
  group: v26-materialize
  cancel-in-progress: false

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out V2.6 branch
        uses: actions/checkout@v7
        with:
          ref: v2.6-writing-rule-catalogue
          fetch-depth: 0

      - name: Set up Flutter for formatting
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply guarded release materialization
        run: python tools/v26_release_apply.py

      - name: Remove one-time materializer files
        run: rm -f tools/v26_release_apply.py .github/workflows/v26-materialize.yml

      - name: Format source and tests
        run: dart format lib test

      - name: Assert permanent release markers
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -q '^version: 2.6.0+11$' pubspec.yaml
          grep -q "applicationVersion: '2.6.0'" lib/features/editor/spell_checker_page.dart
          grep -q "missing-space-after-punctuation" lib/writing/rules/missing_space_after_punctuation_rule.dart
          grep -q "space-before-punctuation" lib/writing/rules/space_before_punctuation_rule.dart
          grep -q 'MissingSpaceAfterPunctuationRule()' lib/writing/writing_analyzer.dart
          grep -q 'SpaceBeforePunctuationRule()' lib/writing/writing_analyzer.dart
          grep -q '`2.6.0+11`' README.md
          grep -q '## \[2.6.0\] - 2026-08-09' CHANGELOG.md
          grep -q '## 2.6 — Deterministic writing rule catalogue expansion' docs/ROADMAP.md
          grep -q '## V2.6 punctuation-spacing catalogue expansion' docs/WRITING_RULES.md
          grep -q '# V2.6 writing catalogue APIs' docs/API.md
          grep -q 'Current V2.6 release:' docs/RELEASING.md
          grep -q 'flutter build web --release' .github/workflows/ci.yml
          python -m json.tool web/manifest.json >/dev/null
          test ! -e tools/v26_release_apply.py
          test ! -e .github/workflows/v26-materialize.yml

      - name: Commit permanent V2.6 tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finalize V2.6 writing rule catalogue release'
          git push origin HEAD:v2.6-writing-rule-catalogue
