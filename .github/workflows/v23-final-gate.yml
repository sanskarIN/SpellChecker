name: V2.3 Final Release Validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  final-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact pull request head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Audit final release tree
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -q '^version: 2.3.0+8$' pubspec.yaml
          grep -q "applicationVersion: '2.3.0'" lib/features/editor/spell_checker_page.dart
          grep -q '`2.3.0+8`' README.md
          grep -q '## \[2.3.0\] - 2026-08-08' CHANGELOG.md
          grep -q '## 2.3 — Review presets and preference portability' docs/ROADMAP.md
          grep -q '# V2.3 review preset and portable-settings APIs' docs/API.md
          grep -q '# V2.3 review presets and preference portability' docs/ARCHITECTURE.md
          grep -q '## V2.3 review presets' docs/WRITING_RULES.md
          grep -q '## V2.3 portable language preferences' docs/LANGUAGE_PACKS.md
          grep -q '# Portable settings — V2.3' docs/USER_GUIDE.md
          grep -q '## V2.3 development contracts' docs/DEVELOPMENT.md
          grep -q '## V2.3 focused coverage' docs/TESTING.md
          grep -q '## V2.3 review presets and portable settings' docs/ACCESSIBILITY.md
          grep -q '## Portable settings import problems — V2.3' docs/TROUBLESHOOTING.md
          grep -q 'Current V2.3 release:' docs/RELEASING.md
          grep -q 'git tag -a v2.3.0' docs/RELEASING.md
          grep -q '## Review presets and Portable settings — V2.3' docs/PRIVACY.md
          grep -q '## V2.3 review preset and portability changes' CONTRIBUTING.md
          grep -q '## Portable settings security boundary — V2.3' SECURITY.md
          grep -q '## V2.3 portable settings reports' SUPPORT.md
          grep -q 'Writing insights review presets' web/index.html
          grep -q 'portable non-document preferences' web/manifest.json
          grep -q '## V2.3 review presets and portable settings' .github/pull_request_template.md
          test -f lib/core/settings_transfer_codec.dart
          test -f lib/storage/settings_transfer_service.dart
          test -f lib/features/editor/settings_transfer_dialog.dart
          test -f lib/writing/writing_review_preset.dart
          test -f test/settings_transfer_codec_test.dart
          test -f test/settings_transfer_service_test.dart
          test -f test/settings_transfer_dialog_test.dart
          test -f test/writing_review_preset_test.dart
          test -f test/v23_widget_test.dart
          if git ls-files 'tools/v23*' | grep -q .; then
            echo 'Unexpected tracked V2.3 helper:' >&2
            git ls-files 'tools/v23*' >&2
            exit 1
          fi
          if git ls-files '.github/workflows/v23-*' | grep -q .; then
            echo 'Unexpected tracked V2.3 temporary workflow:' >&2
            git ls-files '.github/workflows/v23-*' >&2
            exit 1
          fi
          ! grep -q 'Current V2.2 release:' docs/RELEASING.md
          ! grep -q '2.2.0+7' README.md docs/RELEASING.md web/index.html web/manifest.json
          ! grep -q 'currently have no separate export UI' SUPPORT.md
          ! grep -q 'V2.1 adds no new runtime dependency' docs/RELEASING.md
          ! grep -q 'V2.1 adds no new runtime package' SECURITY.md
          python -m json.tool web/manifest.json >/dev/null
          python - <<'PY'
          from pathlib import Path
          lines = Path('pubspec.yaml').read_text().splitlines()
          start = lines.index('dependencies:') + 1
          end = lines.index('dev_dependencies:')
          direct = []
          for line in lines[start:end]:
              if line.startswith('  ') and not line.startswith('    ') and ':' in line:
                  direct.append(line.strip().split(':', 1)[0])
          if direct != ['flutter', 'shared_preferences']:
              raise SystemExit(f'Unexpected runtime dependencies: {direct}')
          PY

      - name: Resolve dependencies
        run: flutter pub get

      - name: Verify lockfile stability
        run: git diff --exit-code -- pubspec.lock

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Test focused V2.3 suites
        run: |
          flutter test test/writing_review_preset_test.dart --reporter expanded
          flutter test test/settings_transfer_codec_test.dart --reporter expanded
          flutter test test/settings_transfer_service_test.dart --reporter expanded
          flutter test test/settings_transfer_dialog_test.dart --reporter expanded
          flutter test test/v23_widget_test.dart --reporter expanded

      - name: Test complete suite
        run: flutter test --reporter expanded

      - name: Build release web app
        run: flutter build web --release

      - name: Re-audit exact head
        shell: bash
        run: |
          git diff --check
          git diff --exit-code -- pubspec.lock
          if git ls-files 'tools/v23*' | grep -q .; then exit 1; fi
          if git ls-files '.github/workflows/v23-*' | grep -q .; then exit 1; fi
          grep -q '^version: 2.3.0+8$' pubspec.yaml
          grep -q 'Current V2.3 release:' docs/RELEASING.md
