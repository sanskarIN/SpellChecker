name: V2.10 final formatter repair

on:
  push:
    branches:
      - v2.10-deterministic-benchmarks

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out V2.10 branch
        uses: actions/checkout@v7
        with:
          ref: v2.10-deterministic-benchmarks
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply exact formatter rewrites
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          format_one() {
            path="$1"
            message="$2"
            dart format "$path"
            if ! git diff --quiet -- "$path"; then
              git add "$path"
              git commit -m "$message"
            fi
          }

          format_one test/analysis_benchmark_reporter_test.dart "style: format benchmark reporter tests"
          format_one test/analysis_benchmark_result_test.dart "style: format benchmark result metadata tests"

          git push origin HEAD:v2.10-deterministic-benchmarks
