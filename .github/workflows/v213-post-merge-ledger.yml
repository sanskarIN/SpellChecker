name: V2.13 post-merge ledger synchronizer

on:
  push:
    branches:
      - v2.13-post-merge-validation-2026-08-15

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out post-merge evidence branch
        uses: actions/checkout@v7
        with:
          ref: v2.13-post-merge-validation-2026-08-15
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Record final V2.13 merge evidence in what_changed.md
        run: |
          python3 tool/v213_post_merge_ledger.py
          git add what_changed.md
          git commit -m "docs(ledger): record final V2.13 merge validation evidence"

      - name: Remove post-merge ledger helper
        run: |
          rm tool/v213_post_merge_ledger.py
          git add tool/v213_post_merge_ledger.py
          git commit -m "chore(v213): remove post-merge ledger helper"

      - name: Remove post-merge synchronizer
        run: |
          rm .github/workflows/v213-post-merge-ledger.yml
          git add .github/workflows/v213-post-merge-ledger.yml
          git commit -m "ci(v213): remove post-merge ledger synchronizer"

      - name: Push post-merge evidence commits
        run: git push origin HEAD:v2.13-post-merge-validation-2026-08-15
