name: V2.12 format Git-diff verifier

on:
  push:
    branches:
      - v2.12-missing-punctuation-space-2026-08-15

permissions:
  contents: write

concurrency:
  group: v212-format-git-diff-verifier
  cancel-in-progress: true

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out current branch head
        uses: actions/checkout@v7
        with:
          ref: v2.12-missing-punctuation-space-2026-08-15
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Apply formatter and verify tracked Git state
        shell: bash
        run: |
          set -euo pipefail
          dart format lib test tool
          git diff --check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if ! git diff --quiet -- lib test tool; then
            echo "Normal package-aware formatting produced a real tracked diff:"
            git diff --name-only -- lib test tool
            git add lib test tool
            git commit -m "style: commit package-aware Dart 3.13 formatting"
          else
            echo "Normal package-aware formatting leaves the tracked Dart tree clean."
          fi

          git rm .github/workflows/v212-format-git-diff.yml
          git commit -m "ci: remove V2.12 format Git-diff verifier"
          git push origin HEAD:v2.12-missing-punctuation-space-2026-08-15
