name: V2.13 final package-aware formatter

on:
  push:
    branches:
      - v2.13-unmatched-parenthesis-2026-08-15

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out final V2.13 branch
        uses: actions/checkout@v7
        with:
          ref: v2.13-unmatched-parenthesis-2026-08-15
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Apply canonical Dart formatting
        run: dart format lib test tool

      - name: Commit real formatter output when needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- lib test tool; then
            git add lib test tool
            git commit -m "style(v213): apply final package-aware Dart formatting"
          fi

      - name: Verify tracked Dart tree is clean
        run: |
          dart format lib test tool
          git diff --exit-code -- lib test tool

      - name: Remove one-time final formatter
        run: |
          rm .github/workflows/v213-final-format.yml
          git add .github/workflows/v213-final-format.yml
          git commit -m "ci(v213): remove final package-aware formatter"

      - name: Push formatting and cleanup commits
        run: git push origin HEAD:v2.13-unmatched-parenthesis-2026-08-15
