name: V3.1 multilingual metadata sync

on:
  push:
    branches:
      - v3.1/multilingual-foundation
    paths:
      - .github/workflows/v31-multilingual-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v3.1/multilingual-foundation
          fetch-depth: 0
      - name: Synchronize V3.1 metadata and documentation
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def rep(path, old, new, count=-1):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"expected text not found in {path}: {old[:90]!r}")
              p.write_text(text.replace(old, new, count))

          rep('pubspec.yaml', 'version: 3.0.0+22', 'version: 3.1.0+23')
          rep('lib/features/editor/spell_checker_page.dart', "applicationVersion: '3.0.0'", "applicationVersion: '3.1.0'")
          rep('lib/features/editor/spell_checker_page.dart', 'A privacy-first open-source cross-platform writing utility in V3.0 with official Android, iOS, Linux, macOS, Web, and Windows runners, plus Unicode-scalar unrestricted Damerau-Levenshtein distance,', 'A privacy-first open-source cross-platform writing utility in V3.1 with eight built-in offline language packs across Latin and Devanagari scripts, official Android, iOS, Linux, macOS, Web, and Windows runners, plus Unicode-scalar unrestricted Damerau-Levenshtein distance,')
          rep('test/widget_test.dart', "testWidgets('About dialog reports the final V2.16 release', (", "testWidgets('About dialog reports the V3.1 multilingual release', (")
          rep('test/widget_test.dart', "expect(find.textContaining('3.0.0'), findsOneWidget);", "expect(find.textContaining('3.1.0'), findsOneWidget);")
          rep('test/documentation_repository_test.dart', "const currentVersion = '3.0.0+22';", "const currentVersion = '3.1.0+23';")
          rep('test/documentation_repository_test.dart', "const builtInLanguageIds = <String>['en-US', 'en-GB'];", "const builtInLanguageIds = <String>[\n    'en-US',\n    'en-GB',\n    'hi-IN',\n    'es-ES',\n    'fr-FR',\n    'de-DE',\n    'pt-BR',\n    'it-IT',\n  ];")

          rep('README.md', 'supports explicit English language packs,', 'supports eight explicit offline language packs,')
          rep('README.md', '**Current package:** `3.0.0+22`', '**Current package:** `3.1.0+23`')
          rep('README.md', '**Built-in languages:** English (US) `en-US`, English (UK) `en-GB`  ', '**Built-in languages:** English (US) `en-US`, English (UK) `en-GB`, Hindi `hi-IN`, Spanish `es-ES`, French `fr-FR`, German `de-DE`, Portuguese (Brazil) `pt-BR`, Italian `it-IT`  ')
          rep('README.md', '- **Language explicit.** Built-in `en-US` and `en-GB` packs keep regional dictionaries, personal vocabulary, and writing-rule choices separate.', '- **Language explicit and offline.** Eight built-in packs cover English, Hindi, Spanish, French, German, Brazilian Portuguese, and Italian spelling while keeping personal vocabulary separate by language. English writing rules remain limited to the English packs.')
          rep('README.md', '2. Choose English (US) or English (UK).', '2. Choose one of the eight built-in offline spelling language packs.')
          rep('README.md', 'All current built-ins support language code `en`, making both registered English packs eligible. Structural unmatched-delimiter rules deliberately do not guess whether insertion, deletion, movement, or rewriting is the correct correction.', 'All current built-in writing rules support language code `en`, so they run for the two registered English packs. The six new non-English packs provide spelling, suggestions, and personal dictionaries without applying English-specific writing rules. Structural unmatched-delimiter rules deliberately do not guess whether insertion, deletion, movement, or rewriting is the correct correction.')

          rep('docs/README.md', 'SpellChecker `3.0.0+22`', 'SpellChecker `3.1.0+23`')
          rep('docs/README.md', 'ships two built-in English language packs', 'ships eight built-in offline spelling language packs')

          rep('docs/FEATURES.md', 'SpellChecker `2.16.0+21`', 'SpellChecker `3.1.0+23`')
          rep('docs/FEATURES.md', 'designed for explicit English language selection,', 'designed for explicit multilingual spelling-language selection,')
          rep('docs/FEATURES.md', '- regular English suffix/contraction acceptance from known stems;', '- language-specific recognized prefix/suffix handling from known stems;')
          rep('docs/FEATURES.md', '| `en-US` | English (US) | built in, default |\n| `en-GB` | English (UK) | built in |', '| `en-US` | English (US) | built in, default |\n| `en-GB` | English (UK) | built in |\n| `hi-IN` | Hindi (India) | built in |\n| `es-ES` | Spanish (Spain) | built in |\n| `fr-FR` | French (France) | built in |\n| `de-DE` | German (Germany) | built in |\n| `pt-BR` | Portuguese (Brazil) | built in |\n| `it-IT` | Italian (Italy) | built in |')
          rep('docs/FEATURES.md', 'Additional languages require a `SpellLanguagePack` implementation and associated dictionary/tokenization/normalization behavior. See [Language packs](LANGUAGE_PACKS.md).', 'The six V3.1 non-English packs are curated offline starter lexicons rather than exhaustive linguistic dictionaries. Further languages or deeper vocabulary require reviewed `SpellLanguagePack` data, normalization/affix behavior, tests, and licensing review. See [Language packs](LANGUAGE_PACKS.md).')
          rep('docs/FEATURES.md', 'All current built-ins declare English (`en`) eligibility, so they run for both built-in English packs.', 'All current built-in writing rules declare English (`en`) eligibility, so they run for the two built-in English packs only. The six non-English V3.1 packs provide spelling and suggestions without applying English-specific writing rules.')

          rep('docs/LANGUAGE_PACKS.md', 'current `2.16.0+21` language model', 'current `3.1.0+23` language model')
          rep('docs/LANGUAGE_PACKS.md', '| `en-US` | `en` | `US` | English (US) | built in, default |\n| `en-GB` | `en` | `GB` | English (UK) | built in |', '| `en-US` | `en` | `US` | English (US) | built in, default |\n| `en-GB` | `en` | `GB` | English (UK) | built in |\n| `hi-IN` | `hi` | `IN` | Hindi (India) | built in |\n| `es-ES` | `es` | `ES` | Spanish (Spain) | built in |\n| `fr-FR` | `fr` | `FR` | French (France) | built in |\n| `de-DE` | `de` | `DE` | German (Germany) | built in |\n| `pt-BR` | `pt` | `BR` | Portuguese (Brazil) | built in |\n| `it-IT` | `it` | `IT` | Italian (Italy) | built in |')
          rep('docs/LANGUAGE_PACKS.md', 'normalizer\nrecognizedSuffixes', 'normalizer\nrecognizedPrefixes\nrecognizedSuffixes')
          rep('docs/LANGUAGE_PACKS.md', 'The constructor captures dictionary, frequency, and suffix collections as immutable snapshots.', 'The constructor captures dictionary, frequency, prefix, and suffix collections as immutable snapshots.')
          rep('docs/LANGUAGE_PACKS.md', '### Recognized suffixes', '### Recognized affixes')
          rep('docs/LANGUAGE_PACKS.md', 'The spelling engine accepts a suffixed token when the normalized stem is known. Suggestions are ranked on the stem and then the recognized suffix is reattached.', "The spelling engine accepts recognized affixes when the normalized stem is known. English keeps its contraction suffixes. V3.1 also adds apostrophe-elision prefixes for French (for example `l'`, `d'`, `qu'`) and Italian (for example `l'`, `d'`, `all'`, `dell'`, `nell'`). Suggestions are ranked on the stem and recognized prefix/suffix text is reattached.")
          rep('docs/LANGUAGE_PACKS.md', 'Built-in English normalization:', 'Built-in Unicode normalization:')
          rep('docs/LANGUAGE_PACKS.md', 'Current built-ins use labels describing bundled English (US)/(UK) sources.', 'Each built-in uses a language-specific bundled source label in detailed suggestion metadata.')
          rep('docs/LANGUAGE_PACKS.md', 'SpellLanguageRegistry.englishGb\nSpellLanguageRegistry.builtIns', 'SpellLanguageRegistry.englishGb\nSpellLanguageRegistry.hindiIndia\nSpellLanguageRegistry.spanishSpain\nSpellLanguageRegistry.frenchFrance\nSpellLanguageRegistry.germanGermany\nSpellLanguageRegistry.portugueseBrazil\nSpellLanguageRegistry.italianItaly\nSpellLanguageRegistry.builtIns')
          rep('docs/LANGUAGE_PACKS.md', '## Common Unicode loanwords\n\nBoth built-in packs include a small explicit set of Unicode loanwords such as accented forms. Combined with normalization, this provides regression coverage for Unicode letter handling without claiming exhaustive multilingual dictionaries.', '## Multilingual coverage boundary\n\nV3.1 adds six curated offline starter lexicons across Latin and Devanagari scripts. They cover representative common vocabulary and deterministic typo suggestions but are not exhaustive national dictionaries, grammar engines, or morphology analyzers. Current Writing insights rules remain English-only (`en`), so the six new packs provide spelling without applying English-specific writing rules.')
          rep('docs/LANGUAGE_PACKS.md', '- recognized suffix behavior;', '- recognized affix behavior;')
          rep('docs/LANGUAGE_PACKS.md', 'dictionary source/content/licensing;', 'dictionary source/content/licensing and provenance;')

          v31_lines = [
              '# V3.1 Multilingual Foundation',
              '',
              'SpellChecker V3.1 expands the offline spelling registry from two English variants to eight built-in packs while keeping the V3 cross-platform, privacy, persistence, and deterministic-analysis contracts intact.',
              '',
              '## Version',
              '',
              '- package: `3.1.0+23`',
              '- About: `3.1.0`',
              '- default language remains: `en-US`',
              '',
              '## Added built-in spelling packs',
              '',
              '- `hi-IN` — Hindi (India)',
              '- `es-ES` — Spanish (Spain)',
              '- `fr-FR` — French (France)',
              '- `de-DE` — German (Germany)',
              '- `pt-BR` — Portuguese (Brazil)',
              '- `it-IT` — Italian (Italy)',
              '',
              'Together with `en-US` and `en-GB`, the application exposes eight explicit offline spelling packs.',
              '',
              '## Engine and persistence changes',
              '',
              '- reuse Unicode letter/combining-mark tokenization for Latin and Devanagari scripts;',
              '- generalize built-in normalization beyond English-only naming;',
              '- add immutable `recognizedPrefixes` to `SpellLanguagePack`;',
              '- add prefix/suffix-aware stem checking and suggestion reconstruction;',
              '- cover common French and Italian apostrophe elision;',
              '- keep personal dictionaries isolated by full language ID;',
              '- keep suggestion metadata deterministic and language-specific.',
              '',
              '## Writing-rule boundary',
              '',
              'This release expands spelling language support. Current Writing insights rules still declare English (`en`) eligibility and therefore run only for `en-US` and `en-GB`. V3.1 intentionally does not apply English-specific mechanics/capitalization rules to the six new packs.',
              '',
              '## Lexicon boundary',
              '',
              'The new dictionaries are project-curated offline starter lexicons of common words with small deterministic frequency-rank maps. They validate useful common-text behavior and the multilingual architecture, but are not exhaustive national dictionaries, morphology engines, or grammar references.',
              '',
              '## Privacy and dependencies',
              '',
              'No runtime dependency, account, telemetry, cloud writing service, document upload, or background dictionary download is added. Language data remains bundled and local.',
              '',
              '## Validation requirements',
              '',
              '- canonical formatting;',
              '- `flutter analyze`;',
              '- complete Flutter tests;',
              '- multilingual registry/engine/persistence/widget regressions;',
              '- deterministic benchmark smoke;',
              '- Android, iOS, Linux, macOS, Web, and Windows release builds.',
          ]
          Path('docs/V3_1_MULTILINGUAL_FOUNDATION.md').write_text('\n'.join(v31_lines) + '\n')

          changelog = Path('CHANGELOG.md').read_text()
          if '## [3.1.0] - 2026-08-17' not in changelog:
              entry_lines = [
                  '## [3.1.0] - 2026-08-17',
                  '',
                  '### Added',
                  '- Added offline built-in spelling packs for Hindi (India), Spanish (Spain), French (France), German (Germany), Portuguese (Brazil), and Italian (Italy), expanding the registry to eight packs.',
                  '- Added curated common-word dictionaries and deterministic frequency-rank metadata for each new pack.',
                  '- Added recognized-prefix support for French/Italian apostrophe elision while preserving English contraction suffixes.',
                  '- Added multilingual engine, persistence-isolation, normalization, metadata, and selector regressions.',
                  '',
                  '### Changed',
                  '- Advanced package identity to `3.1.0+23` and About identity to `3.1.0`.',
                  '- Generalized built-in Unicode normalization naming and affix handling for non-English packs.',
                  '- Updated current documentation and release evidence for the eight-pack spelling surface.',
                  '',
                  '### Compatibility, privacy, and language boundary',
                  '- `en-US` remains the default and unsupported stored language IDs still fall back safely.',
                  '- Current Writing insights rules remain English-only; the six new packs provide spelling/suggestions/personal dictionaries without applying English-specific rules.',
                  '- New lexicons are bundled project-curated starter vocabularies; no external dictionary package, runtime download, telemetry, account, or document-upload behavior was added.',
                  '',
              ]
              marker = '## [3.0.0] - 2026-08-17\n'
              if marker not in changelog:
                  raise SystemExit('CHANGELOG 3.0 marker missing')
              changelog = changelog.replace(marker, '\n'.join(entry_lines) + '\n' + marker, 1)
              Path('CHANGELOG.md').write_text(changelog)

          rep('docs/RELEASE_HISTORY.md', 'Current package version: `3.0.0+22`.', 'Current package version: `3.1.0+23`.')
          rep('docs/RELEASE_HISTORY.md', 'V3.0 is the cross-platform foundation release line. It retains the V2.16 spelling/writing behavior while adding committed Flutter runners and automated release-mode build validation for Android, iOS, Linux, macOS, Web, and Windows.\n\n## V3.0', 'V3.1 is the multilingual spelling foundation release line. It keeps the V3.0 six-target cross-platform build contract while expanding built-in offline spelling from two English variants to eight language packs.\n\n## V3.1\n\n- [V3.1 multilingual foundation](V3_1_MULTILINGUAL_FOUNDATION.md) — six new offline spelling packs, Unicode/affix behavior, persistence isolation, writing-rule boundary, lexicon scope, and validation requirements.\n\n## V3.0')
          rep('docs/ROADMAP.md', 'SpellChecker `3.0.0+22` is the current V3 cross-platform foundation.', 'SpellChecker `3.1.0+23` is the current V3 multilingual cross-platform foundation.')
          rep('docs/ROADMAP.md', '- English (US) and English (UK) built-in language packs;', '- eight built-in offline spelling packs: English (US/UK), Hindi, Spanish, French, German, Brazilian Portuguese, and Italian;')
          rep('docs/ROADMAP.md', '## Additional built-in languages\n\nPotential work:\n\n- additional `SpellLanguagePack` implementations;\n- dictionary/frequency data with compatible licensing;\n- language-specific tokenization/normalization;\n- personal-dictionary validation;\n- language selector/persistence integration;\n- writing-rule eligibility review;\n- benchmark/test coverage.\n\nA new official language should meet the completeness checklist in [Language packs](LANGUAGE_PACKS.md).', '## Further language depth and expansion\n\nV3.1 ships six new non-English starter packs. Future work can deepen those lexicons or add more languages, but should include compatible dictionary licensing/provenance, script-specific normalization and affix review, suggestion-quality/performance benchmarks, persistence/selector regressions, and an explicit writing-rule eligibility decision.\n\nA deeper or new official language should meet the completeness checklist in [Language packs](LANGUAGE_PACKS.md).')

          builds = Path('docs/EXECUTABLE_BUILDS.md').read_text().replace('3.0.0+22', '3.1.0+23')
          anchors = {
              '- `lib/data/english_word_frequencies.dart`': '- `lib/data/english_word_frequencies.dart`\n- `lib/data/french_dictionary.dart`\n- `lib/data/german_dictionary.dart`\n- `lib/data/hindi_dictionary.dart`\n- `lib/data/italian_dictionary.dart`\n- `lib/data/portuguese_br_dictionary.dart`\n- `lib/data/spanish_dictionary.dart`',
              '- `test/language_widget_test.dart`': '- `test/language_widget_test.dart`\n- `test/multilingual_language_pack_test.dart`\n- `test/multilingual_preferences_test.dart`\n- `test/multilingual_widget_test.dart`',
              '- `docs/V3_0_CROSS_PLATFORM_FOUNDATION.md`': '- `docs/V3_0_CROSS_PLATFORM_FOUNDATION.md`\n- `docs/V3_1_MULTILINGUAL_FOUNDATION.md`',
          }
          for old, new in anchors.items():
              if old not in builds:
                  raise SystemExit(f'inventory anchor missing: {old}')
              builds = builds.replace(old, new, 1)
          Path('docs/EXECUTABLE_BUILDS.md').write_text(builds)
          PY

          git config user.name "Sanskar"
          git config user.email "sanskarin@outlook.in"
          git add pubspec.yaml lib/features/editor/spell_checker_page.dart test/widget_test.dart test/documentation_repository_test.dart README.md CHANGELOG.md docs
          git diff --cached --check
          git commit -m "docs: synchronize V3.1 multilingual release surface"
          git push origin HEAD:v3.1/multilingual-foundation
