name: V3.1 multilingual metadata sync

on:
  push:
    branches:
      - v3.1/multilingual-foundation
    paths:
      - .github/workflows/v31-multilingual-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v3.1/multilingual-foundation
          fetch-depth: 0
      - name: Synchronize V3.1 metadata and documentation
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=-1):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"expected text not found in {path}: {old[:100]!r}")
              p.write_text(text.replace(old, new, count))

          replace('pubspec.yaml', 'version: 3.0.0+22', 'version: 3.1.0+23')

          replace(
              'lib/features/editor/spell_checker_page.dart',
              "applicationVersion: '3.0.0'",
              "applicationVersion: '3.1.0'",
          )
          replace(
              'lib/features/editor/spell_checker_page.dart',
              'A privacy-first open-source cross-platform writing utility in V3.0 with official Android, iOS, Linux, macOS, Web, and Windows runners, plus Unicode-scalar unrestricted Damerau-Levenshtein distance,',
              'A privacy-first open-source cross-platform writing utility in V3.1 with eight built-in offline language packs across Latin and Devanagari scripts, official Android, iOS, Linux, macOS, Web, and Windows runners, plus Unicode-scalar unrestricted Damerau-Levenshtein distance,',
          )

          replace(
              'test/widget_test.dart',
              "testWidgets('About dialog reports the final V2.16 release', (",
              "testWidgets('About dialog reports the V3.1 multilingual release', (",
          )
          replace(
              'test/widget_test.dart',
              "expect(find.textContaining('3.0.0'), findsOneWidget);",
              "expect(find.textContaining('3.1.0'), findsOneWidget);",
          )

          replace(
              'test/documentation_repository_test.dart',
              "const currentVersion = '3.0.0+22';",
              "const currentVersion = '3.1.0+23';",
          )
          replace(
              'test/documentation_repository_test.dart',
              "const builtInLanguageIds = <String>['en-US', 'en-GB'];",
              "const builtInLanguageIds = <String>[\n    'en-US',\n    'en-GB',\n    'hi-IN',\n    'es-ES',\n    'fr-FR',\n    'de-DE',\n    'pt-BR',\n    'it-IT',\n  ];",
          )

          replace(
              'README.md',
              'supports explicit English language packs,',
              'supports eight explicit offline language packs,',
          )
          replace('README.md', '**Current package:** `3.0.0+22`', '**Current package:** `3.1.0+23`')
          replace(
              'README.md',
              '**Built-in languages:** English (US) `en-US`, English (UK) `en-GB`  ',
              '**Built-in languages:** English (US) `en-US`, English (UK) `en-GB`, Hindi `hi-IN`, Spanish `es-ES`, French `fr-FR`, German `de-DE`, Portuguese (Brazil) `pt-BR`, Italian `it-IT`  ',
          )
          replace(
              'README.md',
              '- **Language explicit.** Built-in `en-US` and `en-GB` packs keep regional dictionaries, personal vocabulary, and writing-rule choices separate.',
              '- **Language explicit and offline.** Eight built-in packs cover English, Hindi, Spanish, French, German, Brazilian Portuguese, and Italian spelling while keeping personal vocabulary separate by language. English writing rules remain limited to the English packs.',
          )
          replace(
              'README.md',
              '2. Choose English (US) or English (UK).',
              '2. Choose one of the eight built-in offline spelling language packs.',
          )
          replace(
              'README.md',
              'All current built-ins support language code `en`, making both registered English packs eligible. Structural unmatched-delimiter rules deliberately do not guess whether insertion, deletion, movement, or rewriting is the correct correction.',
