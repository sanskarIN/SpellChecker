              'SpellChecker `3.1.0+23`',
          )
          replace(
              'docs/FEATURES.md',
              'designed for explicit English language selection,',
              'designed for explicit multilingual spelling-language selection,',
          )
          replace(
              'docs/FEATURES.md',
