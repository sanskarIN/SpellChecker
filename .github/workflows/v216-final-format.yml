name: V2.16 final package-aware formatter

on:
  push:
    branches:
      - v2.16-final-stabilization-2026-08-15
    paths:
      - .github/workflows/v216-final-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out synchronized release branch
        uses: actions/checkout@v4
        with:
          ref: v2.16-final-stabilization-2026-08-15
          fetch-depth: 0
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Resolve dependencies
        run: flutter pub get
      - name: Apply canonical formatting
        run: dart format lib test tool
      - name: Commit genuine formatter drift
        run: |
          if ! git diff --quiet -- lib test tool; then
            git add lib test tool
            git commit -m "style(v216): apply final canonical Dart formatting"
          fi
      - name: Verify immediate clean second pass
        run: dart format --output=none --set-exit-if-changed lib test tool
      - name: Verify no tracked Dart drift remains
        run: git diff --exit-code -- lib test tool
      - name: Remove formatter workflow
        run: |
          git rm .github/workflows/v216-final-format.yml
          git commit -m "ci(v216): remove final formatter workflow"
      - name: Push helper-free formatted branch
        run: git push origin HEAD:v2.16-final-stabilization-2026-08-15
