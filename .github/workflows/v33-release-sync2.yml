name: V3.3 release sync retry

on:
  push:
    branches:
      - agent/v3.3-writing-hardening

permissions:
  contents: write

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, '[v33-sync]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out V3.3 branch
        uses: actions/checkout@v7
        with:
          ref: agent/v3.3-writing-hardening
          fetch-depth: 0

      - name: Configure release commit identity
        run: |
          git config user.name "Sanskar"
          git config user.email "sanskarin@outlook.in"

      - name: Synchronize About identity
        shell: python
        run: |
          from pathlib import Path

          path = Path('lib/features/editor/spell_checker_page.dart')
          source = path.read_text()

          replacements = (
              ("applicationVersion: '3.2.0'", "applicationVersion: '3.3.0'"),
              (
                  'A privacy-first open-source cross-platform writing utility in V3.2 with thirteen built-in offline language packs',
                  'A privacy-first open-source cross-platform writing utility in V3.3 with thirteen built-in offline language packs',
              ),
              (
                  'expanded deterministic local writing rules including advisory unmatched-parenthesis, unmatched-square-bracket, and unmatched-curly-brace diagnostics',
                  'eleven deterministic local writing rules including missing-colon spacing plus advisory unmatched-parenthesis, unmatched-square-bracket, and unmatched-curly-brace diagnostics',
              ),
          )
          for old, new in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one stale About fragment, found {count}: {old[:80]!r}')
              source = source.replace(old, new, 1)

          path.write_text(source)
      - name: Commit About identity
        run: |
          git diff --check
          git add lib/features/editor/spell_checker_page.dart
          git commit -m "fix: synchronize About identity with V3.3"

      - name: Add V3.3 changelog entry
        shell: python
        run: |
          from pathlib import Path

          path = Path('CHANGELOG.md')
          source = path.read_text()
          if '## [3.3.0] - 2026-08-18' in source:
              raise SystemExit('V3.3 changelog entry already exists unexpectedly')

          anchor = 'The project follows semantic versioning for public releases where practical.\n\n'
          if source.count(anchor) != 1:
              raise SystemExit(f'expected one changelog insertion anchor, found {source.count(anchor)}')

          entry = '''## [3.3.0] - 2026-08-18

### Added
- Added public `MissingColonSpaceRule` with stable ID `missing-colon-space`, exported through `package:spellchecker/writing.dart` and enabled by current English defaults.
- Expanded the built-in writing-rule registry from ten to eleven deterministic local rules.
- Added focused detection, Unicode, correction-composition, bounded-analysis, persistence, Portable settings, and V3.2 explicit-override compatibility regressions for the new rule.
- Added executable relative-Markdown-link validation and live language/writing-registry documentation contract tests.
- Added `docs/V3_3_WRITING_HARDENING.md` as the release design and compatibility record.

### Fixed
- Preserved non-overlapping automatic-fix ownership for `Label :value`: `punctuation-spacing` owns the preceding whitespace while `missing-colon-space` owns only the colon, allowing a deterministic batch result of `Label: value`.
- Corrected stale evergreen API, feature, writing-rule, roadmap, README, release-history, and executable-build documentation that still described older package versions, language counts, rule counts, or web/native boundaries.
- Synchronized the About dialog with V3.3 and the eleven-rule writing surface.

### Compatibility, privacy, and release boundary
- Existing explicit V3.2 ten-rule preferences remain explicit and do not silently acquire the V3.3 rule; resetting removes the override and adopts current eleven-rule defaults.
- Writing-rule preference keys, Portable settings format version 1, personal-dictionary formats, runtime dependencies, language IDs, source-offset semantics, and deterministic correction APIs remain compatible.
- V3.3 adds no telemetry, account system, cloud writing service, document upload, background network analysis, or production signing credentials.
- Package identity advances to `3.3.0+26`; About identity advances to `3.3.0`.

'''
          path.write_text(source.replace(anchor, anchor + entry, 1))
      - name: Commit changelog
        run: |
          git diff --check
          git add CHANGELOG.md
          git commit -m "docs: add V3.3 changelog"

      - name: Record V3.3 engineering ledger
        shell: python
        run: |
          from pathlib import Path

          path = Path('what_changed.md')
          source = path.read_text()
          if '## V3.3 — Writing Hardening and Documentation Contracts' in source:
              raise SystemExit('V3.3 engineering ledger entry already exists unexpectedly')

          anchor = '# What Changed\n\n'
          if not source.startswith(anchor):
              raise SystemExit('what_changed.md title anchor is missing')

          entry = '''## V3.3 — Writing Hardening and Documentation Contracts

Release identity: package `3.3.0+26`; About `3.3.0`.

V3.3 extends the V3.2 multilingual/cross-platform line with one conservative deterministic English mechanics rule and stronger executable documentation contracts. It does not change persistence formats, runtime dependencies, the local privacy model, or six-target build support.

### Missing colon spacing
- Added `MissingColonSpaceRule` with stable ID `missing-colon-space` and English language-code eligibility.
- The rule detects a colon between Unicode letter clusters when the following word starts immediately and proposes `: `.
- Its finding owns only the colon. Optional pre-colon whitespace remains owned by `punctuation-spacing`, so `Label :value` produces adjacent non-overlapping fixes and safely becomes `Label: value` in one batch.
- Numeric times, URL separators, double-colon structures, and already-spaced colons remain outside this rule's deliberately narrow scope.

### Registry and compatibility
- The default built-in writing registry grows from ten to eleven rules.
- Explicit V3.2 ten-rule preferences remain authoritative and do not auto-expand.
- Reset/unset preferences resolve to the current eleven-rule defaults.
- Portable settings keeps format version 1 and round-trips the new stable rule ID without changing older explicit sets.

### Permanent regression coverage
- `test/missing_colon_space_rule_test.dart`
- `test/v33_colon_spacing_integration_test.dart`
- `test/v33_bounded_colon_analysis_test.dart`
- `test/v33_writing_rule_preference_test.dart`
- `test/v33_rule_preference_compatibility_widget_test.dart`
- `test/v33_settings_transfer_rule_compatibility_test.dart`
- `test/documentation_links_test.dart`
- `test/documentation_registry_contract_test.dart`
- expanded `test/writing_rules_test.dart` and `test/documentation_repository_test.dart` contracts.

### Documentation and release hardening
- Current README, documentation hub, feature reference, writing-rule contract, public API, release history, roadmap, executable build inventory, and V3.3 release record now describe the same package/language/rule/platform surface.
- Relative Markdown file links are now executable test coverage rather than a manual-only checklist.
- Current language and writing-rule reference pages are compared against live registries so future registry growth cannot silently leave those docs behind.
- The tracked-file inventory includes all permanent V3.3 sources, tests, and release evidence.

### Privacy and dependency boundary
- Analysis remains local and deterministic.
- No editor text, findings, personal vocabulary, ignored words, or correction history is added to remote or durable document storage.
- Direct runtime dependencies remain Flutter and `shared_preferences`.
- Production signing/notarization/store credentials remain outside the repository.

'''
          path.write_text(anchor + entry + source[len(anchor):])
      - name: Commit engineering ledger and push
        run: |
          git diff --check
          git add what_changed.md
          git commit -m "docs: record V3.3 engineering changes [v33-sync]"
          git push origin HEAD:agent/v3.3-writing-hardening
