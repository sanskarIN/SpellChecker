name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out V2.11 branch
        uses: actions/checkout@v7
        with:
          ref: v2.11-accessibility-review-2026-08-14
          fetch-depth: 0
      - name: Anchor shortcut focus scope
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('lib/features/editor/writing_insights_dialog.dart')
          s = p.read_text()
          old = """      child: AlertDialog(\n        title: const Row(\n"""
          new = """      child: Focus(\n        autofocus: true,\n        child: AlertDialog(\n          title: const Row(\n"""
          if s.count(old) != 1:
              raise SystemExit('shortcut focus opening anchor mismatch')
          s = s.replace(old, new, 1)
          old = """          TextButton(onPressed: () => _close(), child: const Text('Close')),\n        ],\n      ),\n    );\n  }\n}\n"""
          new = """          TextButton(onPressed: () => _close(), child: const Text('Close')),\n        ],\n        ),\n      ),\n    );\n  }\n}\n"""
          if s.count(old) != 1:
              raise SystemExit('shortcut focus closing anchor mismatch')
          p.write_text(s.replace(old, new, 1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/editor/writing_insights_dialog.dart
          git commit -m "fix: anchor Writing insights shortcut focus scope"
          git push origin HEAD:v2.11-accessibility-review-2026-08-14
