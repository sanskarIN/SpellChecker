name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, analyze, test, and benchmark smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show tool versions
        run: |
          flutter --version
          dart --version

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: >-
          dart format --output=show --set-exit-if-changed
          lib/features/editor/writing_insights_dialog.dart
          test/v211_writing_keyboard_test.dart
          test/v211_writing_semantics_test.dart

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --reporter expanded

      - name: Benchmark CLI smoke test
        run: >-
          dart run tool/benchmark_large_document.dart
          --repeats=4
          --warmup=0
          --iterations=1
          --spelling-limit=2
          --writing-limit=5
          --suggestions=0
          --language=en-US
          --json
