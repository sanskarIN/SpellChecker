name: V2.13 About release synchronizer

on:
  push:
    branches:
      - v2.13-unmatched-parenthesis-2026-08-15

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out V2.13 branch
        uses: actions/checkout@v7
        with:
          ref: v2.13-unmatched-parenthesis-2026-08-15
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Update About release identity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/features/editor/spell_checker_page.dart')
          text = path.read_text()
          old_version = "applicationVersion: '2.12.0'"
          new_version = "applicationVersion: '2.13.0'"
          if text.count(old_version) != 1:
              raise SystemExit(f'expected exactly one About version anchor, found {text.count(old_version)}')
          text = text.replace(old_version, new_version)
          old_phrase = 'expanded deterministic local writing rules, temporary review presets/search/filters'
          new_phrase = 'expanded deterministic local writing rules including advisory unmatched-parenthesis diagnostics, temporary review presets/search/filters'
          if text.count(old_phrase) != 1:
              raise SystemExit(f'expected exactly one About feature anchor, found {text.count(old_phrase)}')
          text = text.replace(old_phrase, new_phrase)
          path.write_text(text)
          PY
          git add lib/features/editor/spell_checker_page.dart
          git commit -m "chore(release): update About identity to V2.13"

      - name: Update About regression
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('test/widget_test.dart')
          text = path.read_text()
          replacements = {
              'About dialog reports the current V2.12 release': 'About dialog reports the current V2.13 release',
              "find.textContaining('2.12.0')": "find.textContaining('2.13.0')",
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'expected exactly one test anchor {old!r}, found {text.count(old)}')
              text = text.replace(old, new)
          path.write_text(text)
          PY
          git add test/widget_test.dart
          git commit -m "test(release): update About expectation to V2.13"

      - name: Remove synchronizer
        run: |
          rm .github/workflows/v213-about-sync.yml
          git add .github/workflows/v213-about-sync.yml
          git commit -m "ci(v213): remove About release synchronizer"

      - name: Push synchronized commits
        run: git push origin HEAD:v2.13-unmatched-parenthesis-2026-08-15
