name: Release build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-release:
    name: Validate benchmark tooling and build web release
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show tool versions
        run: |
          flutter --version
          dart --version

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test tool

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --reporter expanded

      - name: Benchmark CLI smoke test
        run: >-
          dart run tool/benchmark_large_document.dart
          --repeats=4
          --warmup=0
          --iterations=1
          --spelling-limit=2
          --writing-limit=5
          --suggestions=0
          --language=en-US
          --json

      - name: Build web
        run: flutter build web --release

      - name: Upload web artifact
        uses: actions/upload-artifact@v7
        with:
          name: spellchecker-web-${{ github.ref_name }}
          path: build/web
          if-no-files-found: error
          retention-days: 14
