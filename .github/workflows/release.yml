name: Cross-platform release build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Validate source before packaging
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      artifact_suffix: ${{ steps.release_metadata.outputs.artifact_suffix }}
      package_version: ${{ steps.release_metadata.outputs.package_version }}
      release_version: ${{ steps.release_metadata.outputs.release_version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Resolve release metadata
        id: release_metadata
        shell: bash
        run: |
          package_version="$(awk '/^version:/ { print $2; exit }' pubspec.yaml)"
          release_version="${package_version%%+*}"
          artifact_suffix="${GITHUB_REF_NAME//\//-}"
          {
            echo "package_version=$package_version"
            echo "release_version=$release_version"
            echo "artifact_suffix=$artifact_suffix"
          } >> "$GITHUB_OUTPUT"

      - name: Verify release tag matches package version
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          expected_tag="v${{ steps.release_metadata.outputs.release_version }}"
          if [ "$GITHUB_REF_NAME" != "$expected_tag" ]; then
            echo "Release tag $GITHUB_REF_NAME does not match pubspec.yaml version ${{ steps.release_metadata.outputs.package_version }}; expected $expected_tag."
            exit 1
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show tool versions
        run: |
          flutter --version
          dart --version

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test tool

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --reporter expanded

      - name: Benchmark CLI smoke test
        run: >-
          dart run tool/benchmark_large_document.dart
          --repeats=4
          --warmup=0
          --iterations=1
          --spelling-limit=2
          --writing-limit=5
          --suggestions=0
          --language=en-US
          --json

  web-release:
    name: Build Web release
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Run Web widget smoke in Chrome
        run: flutter test --platform chrome test/widget_test.dart --reporter expanded
      - name: Build Web
        run: flutter build web --release
      - name: Verify installable Web shell
        run: |
          test -f build/web/manifest.json
          test -f build/web/icons/Icon-192.png
          test -f build/web/icons/Icon-512.png
          grep -q '"display": "standalone"' build/web/manifest.json
          grep -q 'icons/Icon-192.png' build/web/manifest.json
          grep -q 'icons/Icon-512.png' build/web/manifest.json
      - name: Package Web release
        shell: bash
        run: |
          asset="$GITHUB_WORKSPACE/spellchecker-web-${{ needs.quality.outputs.artifact_suffix }}.zip"
          (cd build/web && zip -qr "$asset" .)
          test -s "$asset"
      - name: Upload Web release artifact
        uses: actions/upload-artifact@v7
        with:
          name: spellchecker-release-web-${{ needs.quality.outputs.artifact_suffix }}
          path: spellchecker-web-${{ needs.quality.outputs.artifact_suffix }}.zip
          if-no-files-found: error
          retention-days: 30

  android-release:
    name: Build Android release APK + App Bundle
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Check Android support test formatting
        run: dart format --output=none --set-exit-if-changed android/test
      - name: Test Android repository support contract
        run: flutter test android/test/android_repository_support_test.dart --reporter expanded
      - name: Verify Android production manifest policy
        run: |
          grep -q 'android:allowBackup="false"' android/app/src/main/AndroidManifest.xml
          grep -q 'android:usesCleartextTraffic="false"' android/app/src/main/AndroidManifest.xml
          if grep -q 'uses-permission android:name="android.permission.INTERNET"' android/app/src/main/AndroidManifest.xml; then
            echo "Production Android manifest must not request INTERNET."
            exit 1
          fi
      - name: Build Android APK
        run: flutter build apk --release
      - name: Build Android App Bundle
        run: flutter build appbundle --release
      - name: Normalize Android validation asset names
        shell: bash
        run: |
          apk_path="$(find build/app/outputs/flutter-apk -maxdepth 1 -name '*.apk' -type f -print -quit)"
          aab_path="$(find build/app/outputs/bundle/release -maxdepth 1 -name '*.aab' -type f -print -quit)"
          test -n "$apk_path"
          test -n "$aab_path"
          cp "$apk_path" "spellchecker-android-validation-${{ needs.quality.outputs.artifact_suffix }}.apk"
          cp "$aab_path" "spellchecker-android-validation-${{ needs.quality.outputs.artifact_suffix }}.aab"
      - name: Upload Android validation artifacts
        uses: actions/upload-artifact@v7
        with:
          name: spellchecker-release-android-${{ needs.quality.outputs.artifact_suffix }}
          path: |
            spellchecker-android-validation-${{ needs.quality.outputs.artifact_suffix }}.apk
            spellchecker-android-validation-${{ needs.quality.outputs.artifact_suffix }}.aab
          if-no-files-found: error
          retention-days: 30

  linux-release:
    name: Build Linux release bundle
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop
      - name: Install dependencies
        run: flutter pub get
      - name: Build Linux
        run: flutter build linux --release
      - name: Package Linux bundle with permissions
        shell: bash
        run: |
          bundle_dir="$(find build/linux -path '*/release/bundle' -type d -print -quit)"
          test -n "$bundle_dir"
          tar -C "$(dirname "$bundle_dir")" -czf "spellchecker-linux-${{ needs.quality.outputs.artifact_suffix }}.tar.gz" "$(basename "$bundle_dir")"
      - name: Upload Linux release artifact
        uses: actions/upload-artifact@v7
        with:
          name: spellchecker-release-linux-${{ needs.quality.outputs.artifact_suffix }}
          path: spellchecker-linux-${{ needs.quality.outputs.artifact_suffix }}.tar.gz
          if-no-files-found: error
          retention-days: 30

  windows-release:
    name: Build Windows release bundle
    needs: quality
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop
      - name: Install dependencies
        run: flutter pub get
      - name: Build Windows
        run: flutter build windows --release
      - name: Package Windows release bundle
        shell: pwsh
        run: |
          $releaseDir = Get-ChildItem -Path build/windows -Directory -Recurse |
            Where-Object { $_.FullName -match '[\\/]runner[\\/]Release$' } |
            Select-Object -First 1
          if (-not $releaseDir) {
            throw 'Windows release directory was not found.'
          }
          $asset = "spellchecker-windows-${{ needs.quality.outputs.artifact_suffix }}.zip"
          Compress-Archive -Path "$($releaseDir.FullName)\*" -DestinationPath $asset -Force
          if (-not (Test-Path $asset)) {
            throw 'Windows release archive was not created.'
          }
      - name: Upload Windows release artifact
        uses: actions/upload-artifact@v7
        with:
          name: spellchecker-release-windows-${{ needs.quality.outputs.artifact_suffix }}
          path: spellchecker-windows-${{ needs.quality.outputs.artifact_suffix }}.zip
          if-no-files-found: error
          retention-days: 30

  macos-release:
    name: Build macOS release app
    needs: quality
    runs-on: macos-latest
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop
      - name: Install dependencies
        run: flutter pub get
      - name: Build macOS
        run: flutter build macos --release
      - name: Package macOS app with permissions
        shell: bash
        run: |
          app_path="$(find build/macos/Build/Products/Release -maxdepth 1 -name '*.app' -type d -print -quit)"
          test -n "$app_path"
          tar -C "$(dirname "$app_path")" -czf "spellchecker-macos-unsigned-${{ needs.quality.outputs.artifact_suffix }}.tar.gz" "$(basename "$app_path")"
      - name: Upload macOS release artifact
        uses: actions/upload-artifact@v7
        with:
          name: spellchecker-release-macos-${{ needs.quality.outputs.artifact_suffix }}
          path: spellchecker-macos-unsigned-${{ needs.quality.outputs.artifact_suffix }}.tar.gz
          if-no-files-found: error
          retention-days: 30

  ios-release:
    name: Build iOS no-codesign release app
    needs: quality
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Build iOS without signing
        run: flutter build ios --release --no-codesign
      - name: Package iOS app with permissions
        shell: bash
        run: |
          app_path="$(find build/ios/iphoneos -maxdepth 1 -name '*.app' -type d -print -quit)"
          test -n "$app_path"
          tar -C "$(dirname "$app_path")" -czf "spellchecker-ios-no-codesign-${{ needs.quality.outputs.artifact_suffix }}.tar.gz" "$(basename "$app_path")"
      - name: Upload iOS release artifact
        uses: actions/upload-artifact@v7
        with:
          name: spellchecker-release-ios-${{ needs.quality.outputs.artifact_suffix }}
          path: spellchecker-ios-no-codesign-${{ needs.quality.outputs.artifact_suffix }}.tar.gz
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publish GitHub Release and provenance
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs:
      - quality
      - web-release
      - android-release
      - linux-release
      - windows-release
      - macos-release
      - ios-release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Download packaged release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: spellchecker-release-*
          path: dist
          merge-multiple: true

      - name: Verify complete release asset set
        shell: bash
        run: |
          suffix="${{ needs.quality.outputs.artifact_suffix }}"
          expected_assets=(
            "spellchecker-web-${suffix}.zip"
            "spellchecker-android-validation-${suffix}.apk"
            "spellchecker-android-validation-${suffix}.aab"
            "spellchecker-linux-${suffix}.tar.gz"
            "spellchecker-windows-${suffix}.zip"
            "spellchecker-macos-unsigned-${suffix}.tar.gz"
            "spellchecker-ios-no-codesign-${suffix}.tar.gz"
          )
          for asset in "${expected_assets[@]}"; do
            test -s "dist/$asset" || {
              echo "Missing or empty release asset: $asset"
              exit 1
            }
          done
          actual_count="$(find dist -maxdepth 1 -type f | wc -l | tr -d ' ')"
          if [ "$actual_count" -ne "${#expected_assets[@]}" ]; then
            echo "Expected ${#expected_assets[@]} release assets before checksum generation, found $actual_count."
            find dist -maxdepth 1 -type f -print
            exit 1
          fi

      - name: Generate SHA-256 checksum manifest
        shell: bash
        run: |
          suffix="${{ needs.quality.outputs.artifact_suffix }}"
          (
            cd dist
            sha256sum \
              "spellchecker-web-${suffix}.zip" \
              "spellchecker-android-validation-${suffix}.apk" \
              "spellchecker-android-validation-${suffix}.aab" \
              "spellchecker-linux-${suffix}.tar.gz" \
              "spellchecker-windows-${suffix}.zip" \
              "spellchecker-macos-unsigned-${suffix}.tar.gz" \
              "spellchecker-ios-no-codesign-${suffix}.tar.gz" \
              > "spellchecker-${suffix}-SHA256SUMS.txt"
          )
          test -s "dist/spellchecker-${suffix}-SHA256SUMS.txt"

      - name: Attest release asset provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*

      - name: Create or refresh GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          release_header=$'Automated cross-platform artifacts built by GitHub Actions from this exact tag.\n\nDistribution boundary: Android APK/AAB files are CI validation builds that use the repository fallback signing path unless private production signing is supplied; iOS is intentionally no-codesign; macOS and Windows assets are unsigned. Verify downloads with the SHA-256 manifest and GitHub build-provenance attestations before further packaging or distribution.'
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --verify-tag \
              --title "SpellChecker ${{ needs.quality.outputs.release_version }}" \
              --generate-notes \
              --notes "$release_header" \
              --latest
          fi

      - name: Verify published GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          published_assets="$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')"
          while IFS= read -r asset; do
            asset_name="$(basename "$asset")"
            if ! grep -Fxq "$asset_name" <<< "$published_assets"; then
              echo "GitHub Release is missing asset: $asset_name"
              exit 1
            fi
          done < <(find dist -maxdepth 1 -type f -print | sort)
