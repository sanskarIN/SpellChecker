name: V2.15 one-time test diagnostic

on:
  push:
    branches: [v2.15-unmatched-curly-brace-2026-08-15]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out V2.15 branch
        uses: actions/checkout@v7
        with:
          ref: v2.15-unmatched-curly-brace-2026-08-15

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Run suite and expose concise first failure context
        shell: bash
        run: |
          set +e
          flutter test --reporter expanded > /tmp/v215-test.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            payload=$(python3 - <<'PY'
          from pathlib import Path
          lines = Path('/tmp/v215-test.log').read_text(errors='replace').splitlines()
          first = next((i for i, line in enumerate(lines) if ' -1:' in line), None)
          if first is None:
              start, end = max(0, len(lines) - 45), len(lines)
          else:
              start, end = max(0, first - 12), min(len(lines), first + 35)
          text = '\n'.join(lines[start:end])
          text = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(text)
          PY
            )
            echo "::error title=V2.15 concise first failure::$payload"
            exit "$status"
          fi
