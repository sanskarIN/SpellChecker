name: V2.15 one-time test diagnostic

on:
  push:
    branches: [v2.15-unmatched-curly-brace-2026-08-15]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out V2.15 branch
        uses: actions/checkout@v7
        with:
          ref: v2.15-unmatched-curly-brace-2026-08-15

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Run suite and expose failure tail as annotation
        shell: bash
        run: |
          set +e
          flutter test --reporter expanded > /tmp/v215-test.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            tail -n 160 /tmp/v215-test.log > /tmp/v215-tail.log
            payload=$(python3 - <<'PY'
          from pathlib import Path
          text = Path('/tmp/v215-tail.log').read_text(errors='replace')
          text = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(text)
          PY
            )
            echo "::error title=V2.15 full-suite failure::$payload"
            exit "$status"
          fi
