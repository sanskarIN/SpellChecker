name: V2.16 final release synchronization

on:
  push:
    branches:
      - v2.16-final-stabilization-2026-08-15
    paths:
      - .github/workflows/v216-release-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: v2.16-final-stabilization-2026-08-15
          fetch-depth: 0
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Run guarded release synchronizer
        run: python3 tool/v216_release_sync.py
      - name: Commit permanent release surfaces individually
        run: |
          commit_one() {
            path="$1"
            message="$2"
            if [ -n "$(git status --porcelain -- "$path")" ]; then
              git add "$path"
              git commit -m "$message"
            fi
          }
          commit_one lib/features/editor/spell_checker_page.dart "release(v216): update About final stabilization identity"
          commit_one CHANGELOG.md "docs(v216): add final stabilization changelog"
          commit_one README.md "docs(v216): publish final stabilization overview"
          commit_one .github/pull_request_template.md "docs(v216): add final stabilization review checklist"
          commit_one CONTRIBUTING.md "docs(v216): document final stabilization contributions"
          commit_one SECURITY.md "docs(v216): document final stabilization security boundary"
          commit_one SUPPORT.md "docs(v216): document final stabilization support guidance"
          commit_one docs/ACCESSIBILITY.md "docs(v216): document final accessibility stabilization"
          commit_one docs/API.md "docs(v216): document final API semantics"
          commit_one docs/ARCHITECTURE.md "docs(v216): document final architecture boundaries"
          commit_one docs/DEVELOPMENT.md "docs(v216): document final development gate"
          commit_one docs/LANGUAGE_PACKS.md "docs(v216): document decomposed Unicode language behavior"
          commit_one docs/PERFORMANCE.md "docs(v216): document unrestricted distance performance"
          commit_one docs/PRIVACY.md "docs(v216): document final privacy boundary"
          commit_one docs/RELEASING.md "docs(v216): document final release gate"
          commit_one docs/ROADMAP.md "docs(v216): close final planned implementation milestone"
          commit_one docs/TESTING.md "docs(v216): document final regression matrix"
          commit_one docs/TROUBLESHOOTING.md "docs(v216): document final stabilization troubleshooting"
          commit_one docs/USER_GUIDE.md "docs(v216): document final user-visible fixes"
          commit_one docs/WRITING_RULES.md "docs(v216): preserve ten-rule final catalogue contract"
          commit_one web/index.html "web(v216): update final release metadata"
          commit_one web/manifest.json "web(v216): update final release manifest"
          commit_one docs/V2_16_BUG_AUDIT.md "docs(v216): finalize bug-audit release evidence"
          commit_one what_changed.md "docs(v216): record complete final stabilization ledger"
          commit_one docs/V2_16_FINAL_VALIDATION.md "docs(v216): add final release validation record"
      - name: Remove temporary working scope
        run: |
          git rm docs/V2_16_FINAL_STABILIZATION_SCOPE.md
          git commit -m "docs(v216): retire final stabilization working scope"
      - name: Remove synchronizer
        run: |
          git rm tool/v216_release_sync.py
          git commit -m "chore(v216): remove final release synchronizer"
      - name: Remove synchronization workflow
        run: |
          git rm .github/workflows/v216-release-sync.yml
          git commit -m "ci(v216): remove final release synchronization workflow"
      - name: Verify helper-free synchronized tree
        run: |
          test ! -e docs/V2_16_FINAL_STABILIZATION_SCOPE.md
          test ! -e tool/v216_release_sync.py
          test ! -e .github/workflows/v216-release-sync.yml
          git diff --check HEAD~1..HEAD
      - name: Push synchronized release branch
        run: git push origin HEAD:v2.16-final-stabilization-2026-08-15
