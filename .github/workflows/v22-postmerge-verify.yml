name: Verify merged V2.2 and seed V2.3

on:
  pull_request:
    branches:
      - v2.2-postmerge-verify-base

permissions:
  contents: write
  pull-requests: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out merged main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Verify V2.2 merged-main contract
        run: |
          test "$(grep '^version: ' pubspec.yaml)" = "version: 2.2.0+7"
          grep -F '`2.2.0+7`' README.md
          grep -F '## 2.2 — Writing review and rule management' docs/ROADMAP.md
          grep -F '## [2.2.0] - 2026-08-08' CHANGELOG.md
          grep -F '## V2.2 rule categories' docs/WRITING_RULES.md

          state16="$(gh pr view 16 --repo sanskarIN/SpellChecker --json state --jq .state)"
          test "$state16" = "MERGED"

          if git ls-tree -r --name-only HEAD | grep -E '(^tools/v22_|^\.github/workflows/v22-)'; then
            echo "Temporary V2.2 helper/workflow residue exists in main." >&2
            exit 1
          fi

          for path in \
            lib/writing/writing_rule_category.dart \
            lib/writing/writing_review_query.dart \
            test/writing_review_query_test.dart; do
            test -f "$path"
          done

          grep -F "applicationVersion: '2.2.0'" lib/features/editor/spell_checker_page.dart
          grep -F 'clearWritingRuleIds(languageId: _languagePack.id)' lib/features/editor/spell_checker_page.dart
          grep -F "ValueKey<String>('writing-review-search')" lib/features/editor/writing_insights_dialog.dart
          grep -F 'Apply visible safe fixes' lib/features/editor/writing_insights_dialog.dart

      - name: Ensure temporary recovery PR was not merged
        run: |
          state22="$(gh pr view 22 --repo sanskarIN/SpellChecker --json state --jq .state)"
          if [ "$state22" = "MERGED" ]; then
            echo "Temporary recovery PR #22 must never be merged." >&2
            exit 1
          fi
          if [ "$state22" = "OPEN" ]; then
            gh pr close 22 \
              --repo sanskarIN/SpellChecker \
              --comment "Merged main has been independently verified as V2.2. Closing this temporary recovery PR unmerged."
          fi

      - name: Create V2.3 branch from verified main
        run: |
          sha="$(git rev-parse HEAD)"
          if gh api repos/sanskarIN/SpellChecker/git/ref/heads/v2.3-review-presets-portability >/dev/null 2>&1; then
            existing="$(gh api repos/sanskarIN/SpellChecker/git/ref/heads/v2.3-review-presets-portability --jq .object.sha)"
            test "$existing" = "$sha"
          else
            gh api \
              --method POST \
              repos/sanskarIN/SpellChecker/git/refs \
              -f ref='refs/heads/v2.3-review-presets-portability' \
              -f sha="$sha"
          fi

      - name: Close temporary verification PR
        run: |
          gh pr close "${{ github.event.pull_request.number }}" \
            --repo sanskarIN/SpellChecker \
            --comment "V2.2 merged main verified successfully. V2.3 branch created from the exact verified main SHA."

      - name: Remove temporary verifier from its base branch
        run: |
          git push origin HEAD:refs/heads/v2.2-postmerge-verify-base --force
