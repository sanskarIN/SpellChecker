name: V2.10 documentation completeness sync

on:
  push:
    branches:
      - v2.10-deterministic-benchmarks

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out V2.10 branch
        uses: actions/checkout@v7
        with:
          ref: v2.10-deterministic-benchmarks
          fetch-depth: 0

      - name: Complete V2.10 generic documentation contracts
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if new in text:
                  return
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected exact replacement once, found {text.count(old)}')
              p.write_text(text.replace(old, new, 1))

          def append_section(path, heading, section):
              p = Path(path)
              text = p.read_text()
              if heading in text:
                  return
              if not text.endswith('\n'):
                  text += '\n'
              p.write_text(text + '\n' + section)

          replace_once(
              '.github/pull_request_template.md',
              '`dart format --output=none --set-exit-if-changed lib test`',
              '`dart format --output=none --set-exit-if-changed lib test tool`',
          )
          append_section(
              '.github/pull_request_template.md',
              '## V2.10 deterministic benchmark checklist',
              '''## V2.10 deterministic benchmark checklist\n\nComplete when benchmark/tooling/performance-observability behavior is touched.\n\n- [ ] Benchmark inputs remain generated synthetic data; no private/user-document ingestion path was added.\n- [ ] Fixed benchmark dictionary/frequency metadata remains stable or the intentional workload change is versioned/documented.\n- [ ] Warmup and measured iteration validation remains explicit.\n- [ ] Each measured sample uses fresh spelling/writing analysis state.\n- [ ] Measured samples must agree on deterministic analysis outcomes even when elapsed timings differ.\n- [ ] Human/JSON reports exclude corpus text and raw document findings.\n- [ ] Incompatible JSON report changes advance `formatVersion` and are documented.\n- [ ] Timing values remain descriptive and machine-dependent; normal CI does not use performance thresholds.\n- [ ] `tool/` is included in formatting/static-analysis coverage and the benchmark CLI smoke test remains green.\n- [ ] Both built-in language IDs remain covered when language-aware benchmark behavior changes.\n- [ ] No runtime dependency, persistence format, application telemetry, network request, or public runtime API was introduced unintentionally.\n- [ ] `docs/V2_10_BENCHMARK.md`, performance/testing/privacy/security/releasing docs, changelog/roadmap/README, and `what_changed.md` are synchronized.\n- [ ] No temporary V2.10 synchronization/validation workflow remains in the permanent release tree.\n''',
          )

          replace_once(
              'docs/API.md',
              'SpellChecker 2.9 exposes reusable spelling, language, correction, suggestion-ranking, local writing-review, writing-analysis diagnostic-summary, and portable-settings APIs through three public barrels.',
              'SpellChecker 2.10 exposes reusable spelling, language, correction, suggestion-ranking, local writing-review, writing-analysis diagnostic-summary, and portable-settings APIs through three public barrels.',
          )
          append_section(
              'docs/API.md',
              '# V2.10 developer benchmark API boundary',
              '''# V2.10 developer benchmark API boundary\n\nV2.10 adds developer tooling under `tool/benchmark/` and the `tool/benchmark_large_document.dart` command. These benchmark scenario/result/runner/options/reporter/command types are intentionally **not** exported from `package:spellchecker/spell_checker.dart`, `package:spellchecker/language.dart`, or `package:spellchecker/writing.dart`.\n\nThe benchmark composes the existing public spelling/language/writing APIs from outside the application runtime. V2.10 therefore adds no supported runtime package API surface, no application timing field on `SpellCheckReport` or `WritingAnalysisResult`, and no timing telemetry contract. Consumers that need performance measurements should treat the `tool/` implementation as repository developer tooling rather than a semver-stable library API.\n\nSee [V2.10 benchmark](V2_10_BENCHMARK.md) and [Performance](PERFORMANCE.md).\n''',
          )

          append_section(
              'docs/LANGUAGE_PACKS.md',
              '## V2.10 benchmark language behavior',
              '''## V2.10 benchmark language behavior\n\nThe V2.10 developer benchmark accepts the two current built-in IDs, `en-US` and `en-GB`, and passes the selected `SpellLanguagePack` through the existing spelling/writing APIs. The pack still owns tokenization, normalization, suffix behavior, suggestion-distance policy, language identity, and writing-rule support.\n\nFor workload stability the benchmark supplies its own fixed synthetic dictionary/frequency metadata to `SpellCheckerEngine`; this does **not** change either built-in pack's application dictionary or persisted vocabulary behavior. Adding a future language pack does not automatically make it a benchmark option: benchmark eligibility must be reviewed/tested explicitly so comparisons remain intentional.\n''',
          )

          append_section(
              'docs/WRITING_RULES.md',
              '## V2.10 benchmark interaction with writing rules',
              '''## V2.10 benchmark interaction with writing rules\n\nThe V2.10 benchmark constructs the normal `WritingAnalyzer()` and therefore exercises the current built-in deterministic registry against generated synthetic text. It does not add, remove, rename, enable, persist, or dynamically load a writing rule. All six existing stable IDs/defaults and their source-range/correction contracts remain unchanged.\n\nThe benchmark records only captured/exact-total/truncated writing outcome metadata and elapsed time. It does not serialize `WritingIssue` source text/messages into the benchmark report and does not convert writing `maxIssues` into a CPU-time guarantee.\n''',
          )

          append_section(
              'docs/ACCESSIBILITY.md',
              '## V2.10 developer benchmark accessibility scope',
              '''## V2.10 developer benchmark accessibility scope\n\nV2.10 adds no new in-app control, focus target, gesture, color-only indicator, or keyboard shortcut. The benchmark is a developer CLI and its human-readable mode uses plain text labels for scenario shape, analysis outcomes, and timing aggregates. `--help` exposes the supported command options without requiring the graphical application.\n\nThe existing app accessibility contract remains unchanged; release-version metadata is the only app-visible V2.10 change. Any future in-app performance/diagnostic UI would require a separate accessibility review rather than inheriting the CLI contract automatically.\n''',
          )

          append_section(
              'docs/USER_GUIDE.md',
              '## V2.10 developer benchmark note',
              '''## V2.10 developer benchmark note\n\nV2.10's large-document benchmark is repository developer tooling, not an editor feature. Regular SpellChecker use does not require running it and no benchmark control appears in the application UI. Maintainers/contributors who need controlled synthetic performance comparisons should use `tool/benchmark_large_document.dart` and the dedicated [V2.10 benchmark guide](V2_10_BENCHMARK.md). The command does not read the current editor document.\n''',
          )
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          commit_one() {
            path="$1"
            message="$2"
            if ! git diff --quiet -- "$path"; then
              git add "$path"
              git commit -m "$message"
            fi
          }

          commit_one .github/pull_request_template.md "docs: add V2.10 benchmark PR checklist"
          commit_one docs/API.md "docs: document V2.10 benchmark API boundary"
          commit_one docs/LANGUAGE_PACKS.md "docs: document V2.10 benchmark language behavior"
          commit_one docs/WRITING_RULES.md "docs: document V2.10 benchmark writing-rule boundary"
          commit_one docs/ACCESSIBILITY.md "docs: document V2.10 benchmark accessibility scope"
          commit_one docs/USER_GUIDE.md "docs: add V2.10 developer benchmark user note"

          git push origin HEAD:v2.10-deterministic-benchmarks
