name: V3.3 evergreen documentation sync

on:
  push:
    branches:
      - agent/v3.3-writing-hardening
    paths:
      - .github/workflows/v33-evergreen-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out latest V3.3 branch
        uses: actions/checkout@v7
        with:
          ref: agent/v3.3-writing-hardening
          fetch-depth: 0

      - name: Configure commit identity
        run: |
          git config user.name "Sanskar"
          git config user.email "sanskarin@outlook.in"

      - name: Refresh Getting Started
        shell: python
        run: |
          from pathlib import Path
          p = Path('docs/GETTING_STARTED.md')
          s = p.read_text()
          replacements = (
            ('It supports English (US) and English (UK), per-language personal dictionaries, local writing-rule preferences, bounded large-document review, portable non-document settings, and ten deterministic built-in writing rules.',
             'It supports thirteen built-in offline spelling language packs, per-language personal dictionaries, local writing-rule preferences, bounded large-document review, portable non-document settings, and eleven deterministic built-in writing rules.'),
            ('Current package version: `3.0.0+22`.', 'Current package version: `3.3.0+26`.'),
            ('2. Keep **English (US)** selected or choose **English (UK)** from the language selector.',
             '2. Keep **English (US)** selected or choose any of the thirteen built-in spelling packs from the language selector.'),
            ('Depending on the text, Writing insights can report repeated words, capitalization, repeated spaces, punctuation spacing, missing punctuation spacing, trailing whitespace, repeated punctuation, and advisory unmatched delimiters.',
             'Depending on the English text, Writing insights can report repeated words, capitalization, repeated spaces, punctuation spacing, missing punctuation spacing, missing colon spacing, trailing whitespace, repeated punctuation, and advisory unmatched delimiters.'),
            ('The current built-in rule catalogue contains ten rules.', 'The current built-in rule catalogue contains eleven rules.'),
          )
          for old, new in replacements:
            if old not in s:
              raise SystemExit(f'missing Getting Started fragment: {old[:80]!r}')
            s = s.replace(old, new, 1)
          p.write_text(s)
      - name: Commit Getting Started
        run: |
          git diff --check
          git add docs/GETTING_STARTED.md
          git commit -m "docs: refresh Getting Started for V3.3"

      - name: Refresh User Guide
        shell: python
        run: |
          from pathlib import Path
          p = Path('docs/USER_GUIDE.md')
          s = p.read_text()
          replacements = (
            ('This guide describes the current SpellChecker `2.16.0+21` application workflow.',
             'This guide describes the current SpellChecker `3.3.0+26` application workflow.'),
            ('- English (US) and English (UK) language selection;',
             '- explicit selection among thirteen built-in offline spelling language packs;'),
            ('2. Choose **English (US)** or **English (UK)**.',
             '2. Choose the built-in spelling language pack that matches the text.'),
            ('''Current built-ins are:

```text
English (US) — en-US
English (UK) — en-GB
```

`en-US` is the default.

SpellChecker does not auto-detect language. Change the language explicitly when the text uses another supported variant.''',
             '''Current built-ins are:

```text
English (US) — en-US
English (UK) — en-GB
Hindi (India) — hi-IN
Spanish (Spain) — es-ES
French (France) — fr-FR
German (Germany) — de-DE
Portuguese (Brazil) — pt-BR
Italian (Italy) — it-IT
Bengali (India) — bn-IN
Marathi (India) — mr-IN
Tamil (India) — ta-IN
Telugu (India) — te-IN
Russian (Russia) — ru-RU
```

`en-US` is the default.

SpellChecker does not auto-detect language. Change the language explicitly when the text uses another supported pack.'''),
            ('Writing insights analyzes the current editor text with deterministic local rules for the selected language.',
             'Writing insights analyzes the current editor text with deterministic local rules supported by the selected language. The current built-in writing rules are English-only, so non-English packs provide spelling without English writing findings.'),
            ('''The current default registry contains ten rules:

```text
repeated-word
sentence-capitalization
repeated-space
punctuation-spacing
missing-punctuation-space
trailing-whitespace
repeated-punctuation
unmatched-parenthesis
unmatched-square-bracket
unmatched-curly-brace
```

The first seven can provide deterministic automatic replacements in their documented scope. The three unmatched-delimiter rules are advisory and never guess a mutation.''',
             '''The current default registry contains eleven rules:

```text
repeated-word
sentence-capitalization
repeated-space
punctuation-spacing
missing-punctuation-space
missing-colon-space
trailing-whitespace
repeated-punctuation
unmatched-parenthesis
unmatched-square-bracket
unmatched-curly-brace
```

The first eight can provide deterministic automatic replacements in their documented scope. The three unmatched-delimiter rules are advisory and never guess a mutation.'''),
          )
          for old, new in replacements:
            if old not in s:
              raise SystemExit(f'missing User Guide fragment: {old[:80]!r}')
            s = s.replace(old, new, 1)
          p.write_text(s)
      - name: Commit User Guide
        run: |
          git diff --check
          git add docs/USER_GUIDE.md
          git commit -m "docs: refresh user workflow for V3.3"

      - name: Refresh Configuration language registry
        shell: python
        run: |
          from pathlib import Path
          p = Path('docs/CONFIGURATION.md')
          s = p.read_text()
          old = '''Current built-in language IDs are:

```text
en-US
en-GB
```'''
          new = '''Current built-in language IDs are:

```text
en-US
en-GB
hi-IN
es-ES
fr-FR
de-DE
pt-BR
it-IT
bn-IN
mr-IN
ta-IN
te-IN
ru-RU
```'''
          if old not in s:
            raise SystemExit('missing Configuration language list')
          p.write_text(s.replace(old, new, 1))
      - name: Commit Configuration registry
        run: |
          git diff --check
          git add docs/CONFIGURATION.md
          git commit -m "docs: synchronize configuration language registry"

      - name: Refresh Language Packs identity
        shell: python
        run: |
          from pathlib import Path
          p = Path('docs/LANGUAGE_PACKS.md')
          s = p.read_text()
          old = 'current `3.2.0+25` language model'
          if old not in s:
            raise SystemExit('missing Language Packs version')
          p.write_text(s.replace(old, 'current `3.3.0+26` language model', 1))
      - name: Commit Language Packs identity
        run: |
          git diff --check
          git add docs/LANGUAGE_PACKS.md
          git commit -m "docs: advance language pack reference to V3.3"

      - name: Refresh Glossary registries
        shell: python
        run: |
          from pathlib import Path
          p = Path('docs/GLOSSARY.md')
          s = p.read_text()
          replacements = (
            ('A `SpellLanguagePack` registered in `SpellLanguageRegistry.builtIns`. Current built-ins are English (US), `en-US`, and English (UK), `en-GB`.',
             'A `SpellLanguagePack` registered in `SpellLanguageRegistry.builtIns`. The current registry contains thirteen offline spelling packs: `en-US`, `en-GB`, `hi-IN`, `es-ES`, `fr-FR`, `de-DE`, `pt-BR`, `it-IT`, `bn-IN`, `mr-IN`, `ta-IN`, `te-IN`, and `ru-RU`.'),
            ('currently the IDs of all ten built-in writing rules.',
             'currently the IDs of all eleven built-in writing rules.'),
          )
          for old, new in replacements:
            if old not in s:
              raise SystemExit(f'missing Glossary fragment: {old!r}')
            s = s.replace(old, new, 1)
          p.write_text(s)
      - name: Commit Glossary registries
        run: |
          git diff --check
          git add docs/GLOSSARY.md
          git commit -m "docs: synchronize glossary registries"

      - name: Refresh Architecture identity
        shell: python
        run: |
          from pathlib import Path
          p = Path('docs/ARCHITECTURE.md')
          s = p.read_text()
          old = 'current SpellChecker `2.16.0+21` architecture'
          if old not in s:
            raise SystemExit('missing Architecture version')
          s = s.replace(old, 'current SpellChecker `3.3.0+26` architecture', 1)
          s = s.replace('- recognized suffixes;', '- recognized prefixes and suffixes;', 1)
          p.write_text(s)
      - name: Commit Architecture identity
        run: |
          git diff --check
          git add docs/ARCHITECTURE.md
          git commit -m "docs: refresh architecture for V3.3"

      - name: Refresh Accessibility identity
        shell: python
        run: |
          from pathlib import Path
          p = Path('docs/ACCESSIBILITY.md')
          s = p.read_text()
          old = 'current `2.16.0+21` accessibility contract'
          if old not in s:
            raise SystemExit('missing Accessibility version')
          p.write_text(s.replace(old, 'current `3.3.0+26` accessibility contract', 1))
      - name: Commit Accessibility identity
        run: |
          git diff --check
          git add docs/ACCESSIBILITY.md
          git commit -m "docs: advance accessibility contract to V3.3"

      - name: Refresh Privacy identity
        shell: python
        run: |
          from pathlib import Path
          p = Path('docs/PRIVACY.md')
          s = p.read_text()
          old = 'current `2.16.0+21` application/library privacy model'
          if old not in s:
            raise SystemExit('missing Privacy version')
          p.write_text(s.replace(old, 'current `3.3.0+26` application/library privacy model', 1))
      - name: Commit Privacy identity
        run: |
          git diff --check
          git add docs/PRIVACY.md
          git commit -m "docs: advance privacy contract to V3.3"

      - name: Refresh Troubleshooting identity
        shell: python
        run: |
          from pathlib import Path
          p = Path('docs/TROUBLESHOOTING.md')
          s = p.read_text()
          old = 'common SpellChecker `2.16.0+21` application'
          if old not in s:
            raise SystemExit('missing Troubleshooting version')
          p.write_text(s.replace(old, 'common SpellChecker `3.3.0+26` application', 1))
      - name: Commit Troubleshooting identity
        run: |
          git diff --check
          git add docs/TROUBLESHOOTING.md
          git commit -m "docs: advance troubleshooting guide to V3.3"

      - name: Refresh Development guide
        shell: python
        run: |
          from pathlib import Path
          p = Path('docs/DEVELOPMENT.md')
          s = p.read_text()
          replacements = (
            ('current development guide for SpellChecker `2.16.0+21`',
             'current development guide for SpellChecker `3.3.0+26`'),
            ('- platform tooling only when intentionally working on an additional generated Flutter target.',
             '- the platform toolchain for each Android, iOS, Linux, macOS, Web, or Windows target you intend to run/build.'),
            ('''## Run the committed target

```bash
flutter run -d chrome
```

The repository commits the web host plus portable Flutter/Dart source. Native Android/iOS/Windows/macOS/Linux runner directories are not currently committed. See [Platform support](PLATFORM_SUPPORT.md) and [Executable builds and packaging](EXECUTABLE_BUILDS.md).''',
             '''## Run a committed target

Choose any target whose host toolchain is available, for example:

```bash
flutter run -d chrome
```

The repository commits official Flutter runners for Android, iOS, Linux, macOS, Web, and Windows. See [Platform support](PLATFORM_SUPPORT.md) and [Executable builds and packaging](EXECUTABLE_BUILDS.md) for host requirements and distribution/signing boundaries.'''),
            ('web/                      committed Flutter web host\ndocs/',
             'android/                  committed Android Flutter runner\nios/                      committed iOS Flutter runner\nlinux/                    committed Linux Flutter runner\nmacos/                    committed macOS Flutter runner\nweb/                      committed Flutter web host\nwindows/                  committed Windows Flutter runner\ndocs/'),
            ('- ten built-in rules;', '- eleven built-in rules;'),
          )
          for old, new in replacements:
            if old not in s:
              raise SystemExit(f'missing Development fragment: {old[:80]!r}')
            s = s.replace(old, new, 1)
          p.write_text(s)
      - name: Commit Development guide
        run: |
          git diff --check
          git add docs/DEVELOPMENT.md
          git commit -m "docs: refresh development guide for V3.3"

      - name: Refresh Testing guide
        shell: python
        run: |
          from pathlib import Path
          p = Path('docs/TESTING.md')
          s = p.read_text()
          replacements = (
            ('current SpellChecker `2.16.0+21` test strategy',
             'current SpellChecker `3.3.0+26` test strategy'),
            ('CI also runs deterministic benchmark command smoke. The release workflow repeats the gate and then builds the web release target.',
             'CI also runs deterministic benchmark command smoke. Cross-platform and release workflows repeat the shared gate and build Android, iOS, Linux, macOS, Web, and Windows release-mode targets on appropriate hosts.'),
            ('- apostrophe/hyphen normalization;\n- UTF-16 source ownership;',
             '- apostrophe/hyphen normalization;\n- in-word U+200C ZERO WIDTH NON-JOINER and U+200D ZERO WIDTH JOINER tokenization;\n- UTF-16 source ownership;'),
            ('Repository tests protect non-code project contracts such as Buy Me a Coffee surfaces and the complete documentation hub/current capability references.',
             'Repository tests protect non-code project contracts such as Buy Me a Coffee surfaces, relative Markdown links, live language/writing registry references, and the complete documentation hub/current capability references.'),
            ('''flutter test test/bmc_repository_metadata_test.dart
flutter test test/documentation_repository_test.dart''',
             '''flutter test test/bmc_repository_metadata_test.dart
flutter test test/documentation_links_test.dart
flutter test test/documentation_registry_contract_test.dart
flutter test test/documentation_repository_test.dart'''),
          )
          for old, new in replacements:
            if old not in s:
              raise SystemExit(f'missing Testing fragment: {old[:80]!r}')
            s = s.replace(old, new, 1)
          p.write_text(s)
      - name: Commit Testing guide
        run: |
          git diff --check
          git add docs/TESTING.md
          git commit -m "docs: refresh testing guide for V3.3"

      - name: Refresh Releasing identity
        shell: python
        run: |
          from pathlib import Path
          p = Path('docs/RELEASING.md')
          s = p.read_text()
          if '3.0.0+22' not in s or 'v3.0.0' not in s:
            raise SystemExit('missing Releasing V3.0 identity')
          s = s.replace('3.0.0+22', '3.3.0+26')
          s = s.replace('v3.0.0', 'v3.3.0')
          p.write_text(s)
      - name: Commit Releasing identity
        run: |
          git diff --check
          git add docs/RELEASING.md
          git commit -m "docs: advance release guide to V3.3"

      - name: Refresh FAQ
        shell: python
        run: |
          from pathlib import Path
          p = Path('docs/FAQ.md')
          s = p.read_text()
          replacements = (
            ('The evergreen documentation describes `2.16.0+21` on the current repository `main` branch',
             'The evergreen documentation describes `3.3.0+26` on the current repository `main` branch'),
            ('English (US), `en-US`, and English (UK), `en-GB`.',
             'Thirteen offline spelling packs are built in: `en-US`, `en-GB`, `hi-IN`, `es-ES`, `fr-FR`, `de-DE`, `pt-BR`, `it-IT`, `bn-IN`, `mr-IN`, `ta-IN`, `te-IN`, and `ru-RU`.'),
            ('Ten in the current registry.', 'Eleven in the current registry.'),
          )
          for old, new in replacements:
            if old not in s:
              raise SystemExit(f'missing FAQ fragment: {old!r}')
            s = s.replace(old, new, 1)
          p.write_text(s)
      - name: Commit FAQ
        run: |
          git diff --check
          git add docs/FAQ.md
          git commit -m "docs: refresh FAQ for V3.3"

      - name: Refresh Performance benchmark language help
        shell: python
        run: |
          from pathlib import Path
          p = Path('docs/PERFORMANCE.md')
          s = p.read_text()
          old = '--language=ID        Built-in language: en-US or en-GB (default: en-US)'
          new = '--language=ID        Any current built-in language ID (default: en-US)'
          if old not in s:
            raise SystemExit('missing Performance benchmark language help')
          p.write_text(s.replace(old, new, 1))
      - name: Commit Performance help
        run: |
          git diff --check
          git add docs/PERFORMANCE.md
          git commit -m "docs: synchronize benchmark language help"

      - name: Refresh documentation maintenance count
        shell: python
        run: |
          from pathlib import Path
          p = Path('docs/DOCUMENTATION_MAINTENANCE.md')
          s = p.read_text()
          old = 'merely because current `main` has ten rules.'
          if old not in s:
            raise SystemExit('missing Documentation Maintenance rule count')
          s = s.replace(old, 'merely because current `main` has eleven rules.', 1)
          historical = 'docs/POST_V216_AUDIT_2026_08_16.md\n```'
          if historical in s:
            s = s.replace(historical, 'docs/POST_V216_AUDIT_2026_08_16.md\ndocs/V3_3_WRITING_HARDENING.md\n```', 1)
          p.write_text(s)
      - name: Commit documentation maintenance count
        run: |
          git diff --check
          git add docs/DOCUMENTATION_MAINTENANCE.md
          git commit -m "docs: update documentation maintenance examples"

      - name: Refresh About widget regression
        shell: python
        run: |
          from pathlib import Path
          p = Path('test/widget_test.dart')
          s = p.read_text()
          replacements = (
            ('About dialog reports the V3.2 multilingual release', 'About dialog reports the V3.3 writing hardening release'),
            ("find.textContaining('3.2.0')", "find.textContaining('3.3.0')"),
          )
          for old, new in replacements:
            if old not in s:
              raise SystemExit(f'missing widget version fragment: {old!r}')
            s = s.replace(old, new, 1)
          p.write_text(s)
      - name: Commit About widget regression
        run: |
          git diff --check
          git add test/widget_test.dart
          git commit -m "test: advance About regression to V3.3"

      - name: Rebase and push granular evergreen commits
        run: |
          git fetch origin agent/v3.3-writing-hardening
          git rebase origin/agent/v3.3-writing-hardening
          git push origin HEAD:agent/v3.3-writing-hardening
