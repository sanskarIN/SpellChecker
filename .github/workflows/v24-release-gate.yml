name: V2.4 Release Gate

on:
  pull_request:
    branches: [v2.4-gate-base]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out V2.4 feature branch
        uses: actions/checkout@v7
        with:
          ref: v2.4-suggestion-ranking
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply permanent V2.4 release integration
        run: python tools/v24_release_apply.py

      - name: Remove one-time helper
        run: rm -f tools/v24_release_apply.py

      - name: Format source and tests
        run: dart format lib test

      - name: Resolve dependencies
        run: flutter pub get

      - name: Verify lockfile stability
        run: git diff --exit-code -- pubspec.lock

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Test suggestion rankers
        run: flutter test test/suggestion_ranker_test.dart --reporter expanded

      - name: Test complete suite
        run: flutter test --reporter expanded

      - name: Build release web app
        run: flutter build web --release

      - name: Audit permanent V2.4 tree
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^version: 2.4.0+9$' pubspec.yaml
          grep -q "applicationVersion: '2.4.0'" lib/features/editor/spell_checker_page.dart
          grep -q 'class SpellSuggestionCandidate' lib/core/spell_suggestion_ranker.dart
          grep -q 'abstract interface class SpellSuggestionRanker' lib/core/spell_suggestion_ranker.dart
          grep -q 'class DefaultSpellSuggestionRanker' lib/core/spell_suggestion_ranker.dart
          grep -q 'suggestionRanker.compare' lib/core/spell_checker_engine.dart
          grep -q "spell_suggestion_ranker.dart" lib/spell_checker.dart
          grep -q '`2.4.0+9`' README.md
          grep -q '## \[2.4.0\] - 2026-08-08' CHANGELOG.md
          grep -q '## 2.4 — Suggestion ranking extensibility and determinism' docs/ROADMAP.md
          grep -q '# V2.4 suggestion ranking APIs' docs/API.md
          grep -q '# V2.4 suggestion ranking boundary' docs/ARCHITECTURE.md
          grep -q 'Current V2.4 release:' docs/RELEASING.md
          grep -q 'git tag -a v2.4.0' docs/RELEASING.md
          test ! -e tools/v24_release_apply.py
          if find .github/workflows -maxdepth 1 -type f -name 'v24-*' | grep -q .; then
            echo 'Unexpected V2.4 temporary workflow in candidate tree.' >&2
            exit 1
          fi
          python - <<'PY'
          from pathlib import Path
          lines = Path('pubspec.yaml').read_text().splitlines()
          start = lines.index('dependencies:') + 1
          end = lines.index('dev_dependencies:')
          direct = []
          for line in lines[start:end]:
              if line.startswith('  ') and not line.startswith('    ') and ':' in line:
                  direct.append(line.strip().split(':', 1)[0])
          if direct != ['flutter', 'shared_preferences']:
              raise SystemExit(f'Unexpected runtime dependencies: {direct}')
          PY

      - name: Commit exact validated V2.4 tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'V2.4 feature branch already matches the validated tree.'
          else
            git commit -m 'Finalize V2.4 suggestion ranking release'
            git push origin HEAD:v2.4-suggestion-ranking
          fi
