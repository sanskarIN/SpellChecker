name: V2.2 integration gate

on:
  pull_request:
    branches:
      - v2.2-integration-gate-base

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out V2.2 feature branch
        uses: actions/checkout@v7
        with:
          ref: v2.2-writing-review-management
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply permanent V2.2 page integration
        run: python3 tools/v22_apply.py

      - name: Remove feature integration helper
        run: |
          rm -f tools/v22_apply.py
          rmdir tools 2>/dev/null || true

      - name: Format source and tests
        run: dart format lib test

      - name: Resolve dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --reporter expanded

      - name: Build release web app
        run: flutter build web --release

      - name: Commit exact validated V2.2 tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: integrate and validate v2.2 review management"
          git push origin HEAD:v2.2-writing-review-management
