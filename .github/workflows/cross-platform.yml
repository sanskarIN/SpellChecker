name: Cross-platform CI

on:
  push:
    branches:
      - main
      - v3/cross-platform-foundation
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cross-platform-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Source quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show tool versions
        run: |
          flutter --version
          dart --version

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: |
          dart format lib test tool
          git diff --exit-code

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --reporter expanded

      - name: Benchmark CLI smoke test
        run: >-
          dart run tool/benchmark_large_document.dart
          --repeats=4
          --warmup=0
          --iterations=1
          --spelling-limit=2
          --writing-limit=5
          --suggestions=0
          --language=en-US
          --json

  web:
    name: Web release build
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Run Web widget smoke in Chrome
        run: flutter test --platform chrome test/widget_test.dart --reporter expanded
      - name: Build web
        run: flutter build web --release
      - name: Verify installable web shell
        run: |
          test -f build/web/index.html
          test -f build/web/flutter_bootstrap.js
          test -f build/web/main.dart.js
          test -f build/web/manifest.json
          test -f build/web/icons/Icon-192.png
          test -f build/web/icons/Icon-512.png
          grep -q 'flutter_bootstrap.js' build/web/index.html
          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path('build/web/manifest.json').read_text())
          assert manifest['name'] == 'SpellChecker'
          assert manifest['short_name'] == 'SpellChecker'
          assert manifest['id'] == '.'
          assert manifest['start_url'] == '.'
          assert manifest['scope'] == '.'
          assert manifest['display'] == 'standalone'
          icons = {item['src']: item for item in manifest['icons']}
          assert icons['icons/Icon-192.png']['sizes'] == '192x192'
          assert icons['icons/Icon-512.png']['sizes'] == '512x512'
          PY
      - name: Upload web bundle
        uses: actions/upload-artifact@v7
        with:
          name: spellchecker-web-${{ github.sha }}
          path: build/web
          if-no-files-found: error
          retention-days: 7

  android:
    name: Android release APK + App Bundle
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Check Android support test formatting
        run: dart format --output=none --set-exit-if-changed android/test
      - name: Test Android repository support contract
        run: flutter test android/test/android_repository_support_test.dart --reporter expanded
      - name: Verify Android production manifest policy
        run: |
          grep -q 'android:allowBackup="false"' android/app/src/main/AndroidManifest.xml
          grep -q 'android:usesCleartextTraffic="false"' android/app/src/main/AndroidManifest.xml
          if grep -q 'uses-permission android:name="android.permission.INTERNET"' android/app/src/main/AndroidManifest.xml; then
            echo "Production Android manifest must not request INTERNET."
            exit 1
          fi
      - name: Build Android APK
        run: flutter build apk --release
      - name: Build Android App Bundle
        run: flutter build appbundle --release
      - name: Upload Android APK and App Bundle
        uses: actions/upload-artifact@v7
        with:
          name: spellchecker-android-${{ github.sha }}
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 7

  linux:
    name: Linux release bundle
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop
      - name: Install dependencies
        run: flutter pub get
      - name: Build Linux
        run: flutter build linux --release
      - name: Verify Linux release bundle contents
        shell: bash
        run: |
          bundle_dir="$(find build/linux -path '*/release/bundle' -type d -print -quit)"
          test -n "$bundle_dir"
          binary_path="$bundle_dir/spellchecker"
          test -x "$binary_path"
          test -f "$bundle_dir/lib/libflutter_linux_gtk.so"
          test -d "$bundle_dir/data/flutter_assets"
          file "$binary_path" | grep -q 'ELF'
          ldd_output="$(ldd "$binary_path")"
          printf '%s\n' "$ldd_output"
          if printf '%s\n' "$ldd_output" | grep -q 'not found'; then
            echo "Linux release bundle has unresolved shared-library dependencies."
            exit 1
          fi
      - name: Package Linux bundle with permissions
        shell: bash
        run: |
          bundle_dir="$(find build/linux -path '*/release/bundle' -type d -print -quit)"
          test -n "$bundle_dir"
          tar -C "$(dirname "$bundle_dir")" -czf spellchecker-linux.tar.gz "$(basename "$bundle_dir")"
      - name: Upload Linux bundle
        uses: actions/upload-artifact@v7
        with:
          name: spellchecker-linux-${{ github.sha }}
          path: spellchecker-linux.tar.gz
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Windows release bundle
    needs: quality
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop
      - name: Install dependencies
        run: flutter pub get
      - name: Build Windows
        run: flutter build windows --release
      - name: Verify Windows release bundle metadata
        shell: pwsh
        run: |
          $releaseDir = Get-ChildItem -Path build/windows -Directory -Recurse |
            Where-Object { $_.FullName -match '[\\/]runner[\\/]Release$' } |
            Select-Object -First 1
          if (-not $releaseDir) { throw 'Windows Release directory was not produced.' }

          $exe = Join-Path $releaseDir.FullName 'spellchecker.exe'
          $flutterDll = Join-Path $releaseDir.FullName 'flutter_windows.dll'
          $assets = Join-Path $releaseDir.FullName 'data/flutter_assets'
          if (-not (Test-Path -Path $exe -PathType Leaf)) { throw 'spellchecker.exe is missing.' }
          if (-not (Test-Path -Path $flutterDll -PathType Leaf)) { throw 'flutter_windows.dll is missing.' }
          if (-not (Test-Path -Path $assets -PathType Container)) { throw 'Flutter assets are missing.' }

          $version = (Get-Item $exe).VersionInfo
          if ($version.ProductName -ne 'SpellChecker') { throw "Unexpected ProductName: $($version.ProductName)" }
          if ($version.FileDescription -ne 'SpellChecker') { throw "Unexpected FileDescription: $($version.FileDescription)" }
          if ($version.OriginalFilename -ne 'spellchecker.exe') { throw "Unexpected OriginalFilename: $($version.OriginalFilename)" }
          if ([string]::IsNullOrWhiteSpace($version.ProductVersion)) { throw 'ProductVersion is empty.' }
      - name: Upload Windows bundle
        uses: actions/upload-artifact@v7
        with:
          name: spellchecker-windows-${{ github.sha }}
          path: build/windows/*/runner/Release
          if-no-files-found: error
          retention-days: 7

  macos:
    name: macOS release app
    needs: quality
    runs-on: macos-latest
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop
      - name: Install dependencies
        run: flutter pub get
      - name: Validate macOS plist and entitlements
        run: >-
          plutil -lint
          macos/Runner/Info.plist
          macos/Runner/Release.entitlements
          macos/Runner/DebugProfile.entitlements
      - name: Test Apple repository support contract
        run: flutter test test/apple_repository_support_test.dart --reporter expanded
      - name: Build macOS
        run: flutter build macos --release
      - name: Verify macOS bundle metadata and privacy manifest
        shell: bash
        run: |
          app_path="$(find build/macos/Build/Products/Release -maxdepth 1 -name '*.app' -type d -print -quit)"
          test -n "$app_path"
          info_plist="$app_path/Contents/Info.plist"
          test -f "$info_plist"
          bundle_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$info_plist")"
          test "$bundle_id" = "in.sanskar.spellchecker"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$info_plist" | grep -Eq '.+'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$info_plist" | grep -Eq '.+'
          privacy_manifest="$(find "$app_path" -name PrivacyInfo.xcprivacy -type f -print -quit)"
          test -n "$privacy_manifest"
          plutil -lint "$privacy_manifest"
      - name: Package macOS app with permissions
        shell: bash
        run: |
          app_path="$(find build/macos/Build/Products/Release -maxdepth 1 -name '*.app' -type d -print -quit)"
          test -n "$app_path"
          tar -C "$(dirname "$app_path")" -czf spellchecker-macos.tar.gz "$(basename "$app_path")"
      - name: Upload macOS app
        uses: actions/upload-artifact@v7
        with:
          name: spellchecker-macos-${{ github.sha }}
          path: spellchecker-macos.tar.gz
          if-no-files-found: error
          retention-days: 7

  ios:
    name: iOS no-codesign release app
    needs: quality
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Validate iOS plist
        run: plutil -lint ios/Runner/Info.plist
      - name: Test Apple repository support contract
        run: flutter test test/apple_repository_support_test.dart --reporter expanded
      - name: Build iOS without signing
        run: flutter build ios --release --no-codesign
      - name: Verify iOS bundle metadata and privacy manifest
        shell: bash
        run: |
          app_path="$(find build/ios/iphoneos -maxdepth 1 -name '*.app' -type d -print -quit)"
          test -n "$app_path"
          info_plist="$app_path/Info.plist"
          test -f "$info_plist"
          bundle_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$info_plist")"
          display_name="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$info_plist")"
          test "$bundle_id" = "in.sanskar.spellchecker"
          test "$display_name" = "SpellChecker"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$info_plist" | grep -Eq '.+'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$info_plist" | grep -Eq '.+'
          privacy_manifest="$(find "$app_path" -name PrivacyInfo.xcprivacy -type f -print -quit)"
          test -n "$privacy_manifest"
          plutil -lint "$privacy_manifest"
      - name: Package iOS app with permissions
        shell: bash
        run: |
          app_path="$(find build/ios/iphoneos -maxdepth 1 -name '*.app' -type d -print -quit)"
          test -n "$app_path"
          tar -C "$(dirname "$app_path")" -czf spellchecker-ios.tar.gz "$(basename "$app_path")"
      - name: Upload iOS app bundle
        uses: actions/upload-artifact@v7
        with:
          name: spellchecker-ios-${{ github.sha }}
          path: spellchecker-ios.tar.gz
          if-no-files-found: error
          retention-days: 7
