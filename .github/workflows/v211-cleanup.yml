name: V2.11 cleanup helper

on:
  push:
    branches:
      - v2.11-missing-punctuation-space

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out V2.11 branch
        uses: actions/checkout@v7
        with:
          ref: v2.11-missing-punctuation-space
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply formatter and roadmap cleanup separately
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          dart format test/writing_preferences_test.dart
          if ! git diff --quiet -- test/writing_preferences_test.dart; then
            git add test/writing_preferences_test.dart
            git commit -m "style: format V2.11 preference regressions"
          fi

          python3 <<'PY'
          from pathlib import Path
          path = Path('docs/ROADMAP.md')
          text = path.read_text()
          bullets = [
              '- Richer deterministic writing-rule catalogues with explicit source-range ownership tests.\n',
              '- Repeatable performance benchmarking for very large documents, kept separate from correctness metadata and without persisted document content.\n',
          ]
          for bullet in bullets:
              count = text.count(bullet)
              if count != 1:
                  raise SystemExit(f'Expected roadmap bullet exactly once, found {count}: {bullet.strip()}')
              text = text.replace(bullet, '', 1)
          path.write_text(text)
          PY
          if ! git diff --quiet -- docs/ROADMAP.md; then
            git add docs/ROADMAP.md
            git commit -m "docs: remove completed V2.10 and V2.11 future bullets"
          fi

          git push origin HEAD:v2.11-missing-punctuation-space
