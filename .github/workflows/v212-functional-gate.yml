name: V2.12 functional gate

on:
  push:
    branches:
      - v2.12-unicode-combining-boundaries

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out V2.12 branch
        uses: actions/checkout@v7
        with:
          ref: v2.12-unicode-combining-boundaries
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test tool

      - name: Analyze
        run: flutter analyze

      - name: Run focused Unicode boundary regressions
        run: flutter test test/missing_punctuation_space_unicode_test.dart --reporter expanded

      - name: Run complete test suite
        run: flutter test --reporter expanded

      - name: Run threshold-free benchmark smoke
        run: >-
          dart run tool/benchmark_large_document.dart
          --repeats=4
          --warmup=0
          --iterations=1
          --spelling-limit=2
          --writing-limit=5
          --suggestions=0
          --language=en-US
          --json

      - name: Remove successful functional gate
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/v212-functional-gate.yml
          git commit -m "ci: remove successful V2.12 functional gate"
          git push origin HEAD:v2.12-unicode-combining-boundaries
