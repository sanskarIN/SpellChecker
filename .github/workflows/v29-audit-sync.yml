name: V2.9 audit sync

on:
  push:
    branches:
      - fix/v2.9-zero-error-audit-2026-08-14

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out audit branch
        uses: actions/checkout@v7
        with:
          ref: fix/v2.9-zero-error-audit-2026-08-14
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Refresh resolved dependencies
        run: flutter pub get

      - name: Synchronize V2.9 documentation
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, sentinel=None):
              p = Path(path)
              text = p.read_text()
              if sentinel is not None and sentinel in text:
                  return
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one guarded match, found {count}')
              p.write_text(text.replace(old, new, 1))

          def append_once(path, sentinel, section):
              p = Path(path)
              text = p.read_text()
              if sentinel in text:
                  return
              p.write_text(text.rstrip() + '\n\n' + section.strip() + '\n')

          readme_old = '''## Current release

          `2.8.0+13`

          Version 2.8 is the **Writing Analysis Diagnostics & Exact Limited Counts** release. It keeps the V2.7 200-finding retained-review safety contract while adding exact whole-analysis and per-rule finding counts to analyzer-produced results. Writing insights can now distinguish `200 captured of 1437 total` from an unknown `200+` state without retaining every uncaptured `WritingIssue`. Filters and corrections remain captured-only for limited results, and V2.8 adds no persistence format, runtime dependency, analytics, telemetry, or application network behavior.

          ## Exact Writing insights diagnostics — V2.8'''
          readme_new = '''## Current release

          `2.9.0+14`

          Version 2.9 is the **Shareable Writing-Analysis Diagnostics** release. It adds a deterministic `WritingAnalysisDiagnosticSummary` layer over V2.8 exact finding counts so bug reports, performance investigations, and support discussions can share language, capture-state, count, and rule metadata without serializing editor text, finding excerpts/messages, replacements, or source offsets. The V2.9 hardening pass also closes release-only invariant gaps, preserves active IME composing spans, aligns Unicode word statistics with spelling tokenization, normalizes custom frequency metadata, and removes obsolete reconciliation workflows.

          ## Shareable writing-analysis diagnostics — V2.9

          `WritingAnalysisDiagnosticSummary.fromResult(...)` builds an immutable metadata snapshot from a `WritingAnalysisResult`. Pass the analyzer's rules when human-readable rule names are desired; rows are always emitted in lexical rule-ID order.

          ```dart
          final result = WritingAnalyzer().analyze(
            text,
            languagePack: SpellLanguageRegistry.englishUs,
            maxIssues: 200,
          );
          final summary = WritingAnalysisDiagnosticSummary.fromResult(
            result,
            rules: WritingRuleRegistry.builtIns,
          );
          final reportText = summary.toPlainText();
          ```

          The summary includes language ID, complete/limited status, capture limit, captured/exact/uncaptured counts when available, analyzed rule IDs/display names, and captured/exact per-rule counts. It deliberately excludes editor text, source excerpts, finding messages, replacements, source offsets, personal vocabulary, ignored words, review filters, correction history, timestamps, device identifiers, telemetry, and network metadata. The model itself has no clipboard, persistence, or network side effect.

          ## Exact Writing insights diagnostics — V2.8'''
          replace_once(
              'README.md',
              readme_old,
              readme_new,
              sentinel='## Shareable writing-analysis diagnostics — V2.9',
          )
          replace_once(
              'README.md',
              '- Bounded Writing insights analysis with an explicit first-200 finding policy, exact observed/per-rule totals, captured/total diagnostics, and captured-only limited-review/fix semantics.\n',
              '- Bounded Writing insights analysis with an explicit first-200 finding policy, exact observed/per-rule totals, captured/total diagnostics, and captured-only limited-review/fix semantics.\n- Deterministic privacy-safe V2.9 writing-analysis diagnostic summaries containing counts and rule metadata only.\n',
              sentinel='- Deterministic privacy-safe V2.9 writing-analysis diagnostic summaries',
          )

          changelog_entry = '''## [2.9.0] - 2026-08-14

          ### Added

          - Public `WritingAnalysisDiagnosticSummary` and `WritingRuleDiagnosticSummary` models with deterministic lexical rule ordering.
          - `WritingAnalysisDiagnosticSummary.fromResult(...)` for metadata-only snapshots over V2.8 exact diagnostics and `toPlainText()` for stable shareable text.
          - Focused V2.9 coverage for bounded exact totals, compatibility results without exact totals, empty results, deterministic ordering, and exclusion of document/finding content from diagnostic summaries.
          - Regression coverage for release-mode report/result invariants, normalized custom frequency keys, immutable suffix configuration, dot-connected sentence boundaries, IME composition, Unicode statistics, duplicate writing-rule IDs, and V2.9 About/version metadata.

          ### Changed

          - Package version is `2.9.0+14`; the About dialog reports `2.9.0`.
          - `SpellCheckReport` constructor consistency checks now execute at runtime instead of relying on debug-only assertions.
          - `WritingAnalysisResult` now rejects captured findings owned by non-analyzed rules, findings with a different result language, and per-rule totals for non-analyzed rules.
          - `WritingAnalyzer` rejects duplicate configured rule IDs so persisted IDs and diagnostics remain unambiguous.
          - Custom suggestion-frequency keys are normalized through the active language pack; normalized duplicates retain the best (lowest) frequency rank.
          - `SpellLanguagePack` defensively snapshots recognized suffix configuration in addition to dictionary/frequency collections.
          - Sentence-capitalization boundaries require separating whitespace after terminal punctuation, preventing dot-connected text such as `example.com` from being treated as a new sentence.
          - Inline spelling highlighting preserves Flutter's native active IME composing span while composition is in progress.
          - `TextStatistics` counts Unicode-letter words and supported apostrophe/hyphen forms consistently with the spelling tokenizer.
          - Flutter 3.47/Dart 3.13 analyzer/formatter configuration and resolved transitive dependency metadata are synchronized with the CI toolchain.
          - Obsolete V2.2, V2.3, and V2.8 one-time reconciliation workflows are removed from the permanent release tree.

          ### Compatibility, security, privacy, and validation

          - V2.8 analyzer/result APIs, capture semantics, exact totals, writing-rule IDs, preference formats, Portable settings, correction safety, ranking extension points, and language IDs remain source/data compatible for valid inputs.
          - The V2.9 diagnostic formatter contains counts and rule metadata only and does not read editor text, finding messages/excerpts, replacements, or source offsets.
          - V2.9 adds no runtime dependency, analytics, telemetry, account behavior, cloud writing service, persistence format, automatic clipboard write, or application network request.
          - The hardening audit validates formatting, static analysis, the complete Flutter test suite, and the release web build on the final candidate tree before merge.
          '''
          p = Path('CHANGELOG.md')
          text = p.read_text()
          if '## [2.9.0] - 2026-08-14' not in text:
              marker = '## [2.8.0] - 2026-08-12'
              if text.count(marker) != 1:
                  raise SystemExit('CHANGELOG.md: V2.8 insertion marker mismatch')
              p.write_text(text.replace(marker, changelog_entry.strip() + '\n\n' + marker, 1))

          replace_once(
              'docs/API.md',
              'SpellChecker 2.4 exposes reusable spelling, language, correction, suggestion-ranking, local writing-review, and portable-settings APIs through three public barrels.',
              'SpellChecker 2.9 exposes reusable spelling, language, correction, suggestion-ranking, local writing-review, writing-analysis diagnostic-summary, and portable-settings APIs through three public barrels.',
              sentinel='SpellChecker 2.9 exposes reusable spelling',
          )
          replace_once(
              'docs/API.md',
              'The spelling engine delegates tokenization, normalization, dictionary lookup behavior, and suggestion metadata to the selected pack.\n',
              'The spelling engine delegates tokenization, normalization, dictionary lookup behavior, and suggestion metadata to the selected pack. Pack dictionary, frequency, and recognized-suffix collections are defensive immutable snapshots after construction.\n',
              sentinel='Pack dictionary, frequency, and recognized-suffix collections are defensive immutable snapshots',
          )
          replace_once(
              'docs/API.md',
              'A custom dictionary/frequency set can still be supplied where supported by the constructor. Existing `SpellCheckerEngine()` callers remain source-compatible and default to `en-US`.',
              'A custom dictionary/frequency set can still be supplied where supported by the constructor. Both custom dictionary words and custom frequency keys are normalized through the selected language pack; when multiple frequency keys normalize to the same word, the lowest rank value is retained. Existing `SpellCheckerEngine()` callers remain source-compatible and default to `en-US`.',
              sentinel='when multiple frequency keys normalize to the same word',
          )
          replace_once(
              'docs/API.md',
              '''Fields:

          ```text
          characters
          words
          sentences
          ```''',
              '''Fields:

          ```text
          characters
          words
          sentences
          ```

          Word counting is Unicode-letter aware and keeps supported internal straight/curly apostrophes and ASCII/Unicode hyphen forms inside the same word token.''',
              sentinel='Word counting is Unicode-letter aware',
          )
          replace_once(
              'docs/API.md',
              '''Current IDs:

          ```text
          repeated-word
          sentence-capitalization
          repeated-space
          repeated-punctuation
          ```''',
              '''Current IDs:

          ```text
          repeated-word
          sentence-capitalization
          repeated-space
          punctuation-spacing
          trailing-whitespace
          repeated-punctuation
          ```''',
              sentinel='trailing-whitespace\nrepeated-punctuation',
          )
          replace_once(
              'docs/API.md',
              "The report does not claim `scannedTokenCount` is the document's total token count when `truncated` is true; analysis returns at the first proven overflow unknown token.",
              "The report does not claim `scannedTokenCount` is the document's total token count when `truncated` is true; analysis returns at the first proven overflow unknown token. The public constructor enforces its consistency invariants at runtime in debug and release builds: non-negative scanned counts, positive optional limits, a declared limit for truncated reports, captured issues not exceeding the limit, and scanned-token counts not smaller than captured issue counts.",
              sentinel='The public constructor enforces its consistency invariants at runtime',
          )
          replace_once(
              'docs/API.md',
              '''- per-rule exact totals must be non-negative;
          - the per-rule exact-total map must sum to the exact overall total;
          - a per-rule exact total cannot under-report the retained count for that rule;
          - exact diagnostic maps are exposed immutably.''',
              '''- captured findings must belong to a rule listed in `analyzedRuleIds`;
          - captured findings must use the same `languageId` as the result;
          - per-rule exact totals must be non-negative and may contain only analyzed rule IDs;
          - the per-rule exact-total map must sum to the exact overall total;
          - a per-rule exact total cannot under-report the retained count for that rule;
          - exact diagnostic maps are exposed immutably.''',
              sentinel='captured findings must belong to a rule listed in `analyzedRuleIds`',
          )
          append_once(
              'docs/API.md',
              '# V2.9 writing-analysis diagnostic summary',
              '''# V2.9 writing-analysis diagnostic summary

          `package:spellchecker/writing.dart` exports `WritingAnalysisDiagnosticSummary` and `WritingRuleDiagnosticSummary`.

          ```dart
          final result = WritingAnalyzer().analyze(
            text,
            languagePack: SpellLanguageRegistry.englishUs,
            maxIssues: 200,
          );
          final summary = WritingAnalysisDiagnosticSummary.fromResult(
            result,
            rules: WritingRuleRegistry.builtIns,
          );
          final reportText = summary.toPlainText();
          ```

          `fromResult` snapshots only analysis metadata. Rule rows are ordered lexically by stable rule ID regardless of iterable/set insertion order. If a direct compatibility result omits V2.8 exact totals, the summary preserves that uncertainty and renders exact total/uncaptured values as unavailable rather than guessing.

          `WritingAnalysisDiagnosticSummary` exposes language ID, captured count, optional exact total, optional capture limit, truncation state, immutable rule rows, `hasExactIssueTotals`, `uncapturedIssueCount`, and format version `1`. Each `WritingRuleDiagnosticSummary` contains rule ID/display name plus captured and optional exact total counts.

          The formatter does not read or serialize editor text, source excerpts, finding messages, replacements, source offsets, personal vocabulary, ignored words, review filters, correction history, timestamps, device identifiers, telemetry, or network metadata. Constructing/formatting the summary has no persistence, clipboard, or network side effect.''',
          )

          replace_once(
              'docs/RELEASING.md',
              '''Current V2.8 release candidate:

          ```text
          2.8.0+13
          ```''',
              '''Current V2.9 release candidate:

          ```text
          2.9.0+14
          ```''',
              sentinel='Current V2.9 release candidate:',
          )
          replace_once(
              'docs/RELEASING.md',
              '''git tag -a v2.8.0 -m "SpellChecker v2.8.0"
          git push origin v2.8.0''',
              '''git tag -a v2.9.0 -m "SpellChecker v2.9.0"
          git push origin v2.9.0''',
              sentinel='git tag -a v2.9.0 -m "SpellChecker v2.9.0"',
          )
          replace_once(
              'docs/RELEASING.md',
              '3. Highlight V2.8 exact local writing-analysis diagnostics and retained V2.7 bounded-review safety, while noting compatibility with earlier writing-rule, Portable settings, ranking, and correction-safety foundations.',
              '3. Highlight V2.9 privacy-safe shareable writing-analysis diagnostic summaries, retained V2.8 exact-count diagnostics, and V2.7 bounded-review safety, while noting compatibility with earlier writing-rule, Portable settings, ranking, and correction-safety foundations.',
              sentinel='Highlight V2.9 privacy-safe shareable writing-analysis diagnostic summaries',
          )
          replace_once(
              'docs/RELEASING.md',
              '''flutter clean
          flutter pub get
          dart format --output=none --set-exit-if-changed lib test''',
              '''flutter clean
          flutter pub get
          git diff --exit-code -- pubspec.lock
          dart format --output=none --set-exit-if-changed lib test''',
              sentinel='git diff --exit-code -- pubspec.lock',
          )

          replace_once(
              'docs/ARCHITECTURE.md',
              '''Current built-ins:

          ```text
          repeated-word
          sentence-capitalization
          repeated-space
          repeated-punctuation
          ```''',
              '''Current built-ins:

          ```text
          repeated-word
          sentence-capitalization
          repeated-space
          punctuation-spacing
          trailing-whitespace
          repeated-punctuation
          ```''',
              sentinel='punctuation-spacing\ntrailing-whitespace\nrepeated-punctuation',
          )
          replace_once(
              'docs/ARCHITECTURE.md',
              '`TextStatistics` calculates character, word, and sentence counts.',
              '`TextStatistics` calculates character, Unicode-aware word, and sentence counts using the same supported internal apostrophe/hyphen forms as spelling tokenization.',
              sentinel='`TextStatistics` calculates character, Unicode-aware word',
          )
          append_once(
              'docs/ARCHITECTURE.md',
              '# V2.9 hardening and diagnostic-summary flow',
              '''# V2.9 hardening and diagnostic-summary flow

          V2.9 strengthens model boundaries without changing the layer split:

          - `SpellCheckReport` validates public report invariants at runtime in release builds.
          - `WritingAnalysisResult` validates captured-rule ownership, result language ownership, and exact per-rule diagnostic ownership.
          - `WritingAnalyzer` rejects duplicate configured rule IDs before analysis so persistence and diagnostics remain unambiguous.
          - `SpellCheckEditingController` delegates to Flutter's native composing-span renderer while a valid IME composing range is active; checked spelling highlights resume after composition is committed.
          - `WritingAnalysisDiagnosticSummary.fromResult` reads only result/rule metadata, sorts rule rows by stable ID, and formats a deterministic metadata-only representation without reading document text.

          The summary model belongs to the writing layer and introduces no storage, UI, clipboard, network, or telemetry dependency.''',
          )

          append_once(
              'docs/LANGUAGE_PACKS.md',
              '## V2.9 configuration hardening',
              '''## V2.9 configuration hardening

          `SpellLanguagePack` defensively snapshots its dictionary, frequency map, and recognized-suffix list at construction. Mutating caller-owned collections after pack creation therefore cannot silently change token acceptance or suffix behavior.

          When a caller supplies a custom `wordFrequencies` map to `SpellCheckerEngine`, its keys are normalized through the active pack just like dictionary words. Empty normalized keys are discarded, and when multiple input keys normalize to the same word the lowest rank value is kept. This preserves deterministic frequency-aware ordering for mixed-case/custom-normalizer inputs.''',
          )

          replace_once(
              'docs/PRIVACY.md',
              'SpellChecker 2.3 performs spelling and optional deterministic writing-rule analysis locally.',
              'SpellChecker 2.9 performs spelling and optional deterministic writing-rule analysis locally.',
              sentinel='SpellChecker 2.9 performs spelling',
          )
          replace_once(
              'docs/PRIVACY.md',
              'V2.3 application preferences remain limited to:',
              'V2.9 application preferences remain limited to:',
              sentinel='V2.9 application preferences remain limited to:',
          )
          replace_once(
              'docs/PRIVACY.md',
              'SpellChecker 2.3 contains no analytics SDK, advertising SDK, telemetry SDK, account/authentication dependency, cloud spelling/grammar dependency, AI rewriting service, or remote document logging pipeline.',
              'SpellChecker 2.9 contains no analytics SDK, advertising SDK, telemetry SDK, account/authentication dependency, cloud spelling/grammar dependency, AI rewriting service, or remote document logging pipeline.',
              sentinel='SpellChecker 2.9 contains no analytics SDK',
          )
          replace_once(
              'docs/PRIVACY.md',
              'Any future persistence or export of exact finding totals requires explicit privacy review and user-facing documentation. V2.8 itself keeps them local and memory-only.',
              'Any persistence, automatic upload, telemetry, or application-owned clipboard/file export of exact finding totals requires explicit privacy review and user-facing documentation. V2.8 keeps raw result diagnostics local and memory-only; V2.9 adds only the separately documented metadata-only formatter and no automatic transport.',
              sentinel='V2.9 adds only the separately documented metadata-only formatter',
          )
          append_once(
              'docs/PRIVACY.md',
              '## V2.9 diagnostic-summary privacy boundary',
              '''## V2.9 diagnostic-summary privacy boundary

          `WritingAnalysisDiagnosticSummary` is designed to make support/performance metadata safer to share than a raw `WritingAnalysisResult`. It includes language ID, complete/limited state, capture limit, captured/exact/uncaptured counts when available, stable analyzed rule IDs/display names, and captured/exact per-rule counts.

          It deliberately does not read or serialize editor text, source excerpts, finding messages, replacements, source offsets, personal dictionary entries, ignored words, review search/filter state, correction history, timestamps, device identifiers, telemetry, or network metadata. `toPlainText()` is a pure in-memory formatter; V2.9 adds no automatic clipboard write, persistence, upload, or background reporting. A future UI transport must remain explicit and must use the privacy-safe representation rather than raw findings unless separately reviewed.''',
          )

          append_once(
              'docs/TESTING.md',
              '# V2.9 diagnostic-summary and hardening regressions',
              '''# V2.9 diagnostic-summary and hardening regressions

          V2.9 release-sensitive coverage additionally verifies:

          - `WritingAnalysisDiagnosticSummary` exact bounded totals, lexical rule ordering, compatibility results with unavailable exact totals, stable empty output, and exclusion of editor/finding content;
          - `SpellCheckReport` invalid public constructor states throw at runtime rather than relying on debug-only assertions;
          - `WritingAnalysisResult` rejects findings/totals owned by non-analyzed rules and findings using the wrong result language;
          - `WritingAnalyzer` rejects duplicate rule IDs;
          - custom frequency keys are pack-normalized and normalized duplicates keep the best rank;
          - caller mutation cannot change `SpellLanguagePack.recognizedSuffixes` after construction;
          - sentence capitalization does not treat dot-connected segments such as `example.com` as sentence boundaries;
          - active IME composition preserves Flutter's native composing span even when checked spelling issues exist;
          - text statistics count Unicode words consistently with supported spelling token forms;
          - About/version text is synchronized with the V2.9 package release.

          For the release candidate, run the normal format/analyze/full-test gate and `flutter build web --release` on the exact candidate tree. After `flutter pub get`, `pubspec.lock` must remain clean under the supported release toolchain.''',
          )

          replace_once(
              'docs/TROUBLESHOOTING.md',
              'SpellChecker 2.1 keeps the small runtime dependency surface: Flutter plus `shared_preferences` for local settings.',
              'SpellChecker 2.9 keeps the small runtime dependency surface: Flutter plus `shared_preferences` for local settings.',
              sentinel='SpellChecker 2.9 keeps the small runtime dependency surface',
          )
          append_once(
              'docs/TROUBLESHOOTING.md',
              '## V2.9 diagnostic-summary troubleshooting',
              '''## V2.9 diagnostic-summary troubleshooting

          ### A diagnostic summary says `unavailable` for exact totals

          This is expected for a directly constructed compatibility `WritingAnalysisResult` that omitted the optional V2.8 exact-total fields. V2.9 does not invent totals. Analyzer-produced results provide exact totals and therefore normally render numeric total/uncaptured values.

          ### A diagnostic summary contains a rule ID instead of a friendly rule name

          Pass the relevant configured `WritingRule` values to `WritingAnalysisDiagnosticSummary.fromResult(..., rules: ...)`. Unknown rule IDs intentionally fall back to their stable ID rather than guessing a display label.

          ### I need to report a diagnostics bug

          Prefer the V2.9 metadata-only summary or a synthetic minimal example. Do not attach a private document, raw finding excerpts, personal vocabulary, or correction history unless a private security/support channel explicitly requires and authorizes it.''',
          )

          replace_once(
              'docs/USER_GUIDE.md',
              '''- **Repeated word** — adjacent duplicate words.
          - **Sentence capitalization** — lowercase supported sentence starts.
          - **Repeated spaces** — repeated horizontal spaces.
          - **Repeated punctuation** — repeated identical supported punctuation.''',
              '''- **Repeated word** — adjacent duplicate words.
          - **Sentence capitalization** — lowercase supported sentence starts.
          - **Repeated spaces** — repeated interior horizontal spaces.
          - **Punctuation spacing** — horizontal whitespace immediately before supported punctuation.
          - **Trailing whitespace** — horizontal whitespace before line endings or document end.
          - **Repeated punctuation** — repeated identical supported punctuation.''',
              sentinel='- **Trailing whitespace** — horizontal whitespace before line endings or document end.',
          )
          replace_once(
              'docs/USER_GUIDE.md',
              'Manual typing invalidates the previous spelling snapshot, so old highlights/results are cleared instead of being painted against changed text.',
              "Manual typing invalidates the previous spelling snapshot, so old highlights/results are cleared instead of being painted against changed text. While an input method editor (IME) has an active composing range, Flutter's native composing visualization takes priority over custom spelling highlights so composition remains visible; checked issue styling resumes after composition is committed.",
              sentinel="Flutter's native composing visualization takes priority",
          )

          append_once(
              'docs/WRITING_RULES.md',
              '## V2.9 analyzer/result hardening and diagnostic summaries',
              '''## V2.9 analyzer/result hardening and diagnostic summaries

          `WritingAnalyzer` now rejects duplicate configured rule IDs at construction. A stable rule ID identifies persistence, filtering, totals, and diagnostic rows; allowing two configured rules to share it would make those contracts ambiguous.

          `WritingAnalysisResult` additionally validates that every captured issue belongs to an analyzed rule and uses the result language, and that exact per-rule total keys belong to analyzed rules. These are runtime public-value invariants, not debug-only assertions.

          V2.9 also exports `WritingAnalysisDiagnosticSummary` / `WritingRuleDiagnosticSummary`. The summary derives deterministic count/rule metadata from a result, sorts rows by stable rule ID, represents missing V2.8 exact totals as unavailable, and deliberately omits document text, excerpts, messages, replacements, and source offsets. See [V2_9_DIAGNOSTIC_SUMMARY.md](V2_9_DIAGNOSTIC_SUMMARY.md).''',
          )

          append_once(
              'docs/ACCESSIBILITY.md',
              '## V2.9 IME composition hardening',
              '''## V2.9 IME composition hardening

          When Flutter reports a valid active IME composing range, the editor delegates text-span construction to Flutter's native composing renderer instead of replacing it with spelling-highlight spans. This keeps composition feedback visible for keyboard/input-method users. After composition is committed, normal checked spelling underlines and active-issue styling resume from current issue state.''',
          )

          append_once(
              'docs/PERFORMANCE.md',
              '## V2.9 diagnostic-summary cost',
              '''## V2.9 diagnostic-summary cost

          `WritingAnalysisDiagnosticSummary.fromResult` does not re-run writing rules or re-scan editor text. It reads already-produced result count metadata, derives captured per-rule counts from the retained findings, sorts analyzed rule IDs, and formats one row per analyzed rule. Its cost is tied to retained findings/analyzed-rule metadata rather than document length beyond the analysis work that already occurred. It does not change V2.7 `maxIssues` or V2.8 exact-count semantics.''',
          )

          append_once(
              'CONTRIBUTING.md',
              '## V2.9 diagnostics and hardening contributions',
              '''## V2.9 diagnostics and hardening contributions

          For V2.9-sensitive changes, preserve the metadata-only diagnostic-summary boundary, public runtime result/report invariants, unique writing-rule IDs, language ownership of findings, IME composing visibility, Unicode token/statistics consistency, and deterministic custom-frequency normalization. Add focused regressions for any changed invariant. Before a release-sensitive PR is complete, `flutter pub get` must leave `pubspec.lock` clean and the exact tree must pass format, analyze, full tests, and the release web build. Disposable reconciliation workflows/scripts must not remain in the release tree.''',
          )

          append_once(
              'SECURITY.md',
              '## V2.9 diagnostic-summary security boundary',
              '''## V2.9 diagnostic-summary security boundary

          The V2.9 `WritingAnalysisDiagnosticSummary` API is intentionally metadata-only. It does not read or serialize editor text, finding excerpts/messages, replacements, source offsets, personal vocabulary, correction history, timestamps, device identifiers, or network metadata. It adds no automatic clipboard write, persistence, transport, telemetry, or remote logging behavior. Future UI/file/network transport of diagnostics requires separate security/privacy review and must not silently substitute raw `WritingIssue` data for the safe summary.''',
          )

          append_once(
              'SUPPORT.md',
              '## V2.9 diagnostic-summary support reports',
              '''## V2.9 diagnostic-summary support reports

          For writing-analysis count/ordering problems, maintainers can ask for the deterministic `WritingAnalysisDiagnosticSummary.toPlainText()` output plus the SpellChecker version and a synthetic reproduction. The summary is designed to contain counts and stable rule/language metadata without editor text or finding excerpts. If exact totals show `unavailable`, record whether the result was directly constructed for compatibility rather than returned by `WritingAnalyzer.analyze()`. Do not ask users to post private documents, personal dictionaries, raw correction history, or sensitive finding excerpts in public issues.''',
          )

          append_once(
              '.github/pull_request_template.md',
              '## V2.9 diagnostic-summary / hardening checklist',
              '''## V2.9 diagnostic-summary / hardening checklist

          Complete when relevant.

          - [ ] Diagnostic summaries remain deterministic and metadata-only; raw editor text/findings are not serialized.
          - [ ] Compatibility results without V2.8 exact totals remain representable without guessed counts.
          - [ ] `SpellCheckReport` / `WritingAnalysisResult` runtime consistency invariants remain enforced in release builds.
          - [ ] Writing analyzer rule IDs remain unique and finding/total ownership matches analyzed rule IDs/language.
          - [ ] Language-pack configuration remains immutable after construction and custom frequency keys follow pack normalization.
          - [ ] IME composing feedback and Unicode token/statistics behavior have focused regressions when touched.
          - [ ] `pubspec.yaml`/About/README/changelog/releasing/tag instructions match the intended V2.9 release.
          - [ ] `flutter pub get` leaves `pubspec.lock` clean on the supported release toolchain.
          - [ ] Exact-tree format, analyze, full tests, and `flutter build web --release` pass before release.
          - [ ] No V2.2/V2.3/V2.8/V2.9 disposable reconciliation workflow/helper remains in the permanent release tree.''',
          )

          replace_once(
              '.github/ISSUE_TEMPLATE/bug_report.yml',
              'description: For V2.8 count/limited-result problems, include maxIssues when applicable, captured count, exact overall total, exact per-rule totals, complete/truncated state, active review filters, and whether the text/language/rule settings changed after analysis. Use synthetic data only.',
