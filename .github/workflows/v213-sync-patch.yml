name: V2.13 release-sync patch

on:
  push:
    branches:
      - v2.13-unmatched-parenthesis-2026-08-15

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out V2.13 branch
        uses: actions/checkout@v7
        with:
          ref: v2.13-unmatched-parenthesis-2026-08-15
          fetch-depth: 0

      - name: Patch guarded insertion rule
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tool/v213_release_sync.py')
          text = path.read_text()
          old = "for path, block in notes.items():\n    updates[path] = after_heading(read(path), block, path=path)\n"
          new = "for path, block in notes.items():\n    if path == '.github/pull_request_template.md':\n        updates[path] = insert_before(read(path), '## Writing rules', block, path=path)\n    else:\n        updates[path] = after_heading(read(path), block, path=path)\n"
          if text.count(old) != 1:
              raise SystemExit(f'expected one notes-loop anchor, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tool/v213_release_sync.py
          git commit -m "fix(v213): handle H2 pull-request template in release sync"

      - name: Remove patch workflow
        run: |
          rm .github/workflows/v213-sync-patch.yml
          git add .github/workflows/v213-sync-patch.yml
          git commit -m "ci(v213): remove release-sync patch workflow"

      - name: Push patch commits
        run: git push origin HEAD:v2.13-unmatched-parenthesis-2026-08-15
