Every permanent changed path above was inspected at the diff level during the release audit. Tracked files absent from this permanent change set are byte-identical to the fully audited merged V2.10 base and were intentionally not churned simply to mention V2.11.

### Ordinary functional CI evidence

Permanent ordinary CI run `31778547418` (CI #423) validated helper-free functional/documented candidate `6e57c34c58d00a06616f098822ccaaa17df91201` and passed:

```text
flutter pub get
dart format --output=none --set-exit-if-changed lib test tool
flutter analyze
flutter test --reporter expanded
dart run tool/benchmark_large_document.dart --repeats=4 --warmup=0 --iterations=1 --spelling-limit=2 --writing-limit=5 --suggestions=0 --language=en-US --json
```

The full Flutter suite ended with **224 tests passed**. The permanent benchmark smoke command also passed.

### Final V2.11 release-validator evidence

Corrected read-only V2.11 final release-validator run `31778813655` validated the release candidate after all runtime/test/document/version work and passed every configured stage:

```text
flutter pub get
git diff --exit-code -- pubspec.lock
dart format --output=none --set-exit-if-changed lib test tool
flutter analyze
flutter test --reporter expanded
en-US JSON benchmark: 250 repeats, 1 warmup, 3 measured iterations, 100/100 capture limits, 3 suggestions
en-GB human benchmark: 50 repeats, 1 warmup, 2 measured iterations, 20/20 capture limits, 2 suggestions
V2.11 package/About/README/changelog/roadmap/contract/workflow identity assertions
flutter build web --release
```

The en-US report check additionally asserted JSON format version 1; lexically sorted analyzed rule IDs; exact per-rule key-set equality with analyzed rule IDs; non-negative integer totals; per-rule sum equality with the exact overall writing total; and representative-sample equality with summary-level analysis-outcome rule/totals metadata.

At this gate the candidate had no lockfile drift, formatter failure, analyzer diagnostic, test failure, benchmark-invariant failure, release-identity failure, or web release-build failure.

### Final permanent-tree merge invariant

The release validator is deliberately not permanent. After recording this section, the final branch must contain only the reusable `.github/workflows/ci.yml` and `.github/workflows/release.yml` workflows, and an ordinary CI run on the exact documentation-complete helper-free head must pass dependency installation, canonical formatting, analyzer, all 224 Flutter tests, and the benchmark CLI smoke command.

Only that exact final CI-green head is eligible for merge to `main`. The resulting `main` merge commit must then pass the same ordinary push-triggered CI. This establishes a verified zero-failure state for the repository's audited automated gates and V2.11 invariants; it is not a mathematical claim that non-trivial software can contain no undiscovered future defect.
'''
          path.write_text(text.rstrip() + section + '\n')
          PY
      - name: Commit and push ledger
        shell: bash
        run: |
          git config user.name "Sanskar"
          git config user.email "sanskarin@outlook.in"
          git add what_changed.md
          git commit -m "docs: record complete V2.11 engineering ledger"
          for attempt in 1 2 3; do
            if git push origin HEAD:v2.11-accessibility-review-2026-08-14; then
              exit 0
            fi
            sleep 2
          done
          exit 1
