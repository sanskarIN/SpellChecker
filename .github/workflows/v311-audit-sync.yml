name: V3.1.1 audit synchronization

on:
  push:
    branches:
      - v3.1.1/line-audit-hardening

permissions:
  contents: write

jobs:
  synchronize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out audit branch
        uses: actions/checkout@v4
        with:
          ref: v3.1.1/line-audit-hardening
          fetch-depth: 0

      - name: Synchronize release identity and evergreen docs
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new):
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected text not found in {path}: {old!r}')
              file.write_text(text.replace(old, new), encoding='utf-8')

          replace(
              'lib/features/editor/spell_checker_page.dart',
              "applicationVersion: '3.1.0'",
              "applicationVersion: '3.1.1'",
          )

          replace('README.md', '**Current package:** `3.1.0+23`', '**Current package:** `3.1.1+24`')
          replace(
              'README.md',
              'The current package version is `3.0.0+22`. V3.0 establishes the cross-platform foundation with committed Android, iOS, Linux, macOS, Web, and Windows runners plus multi-OS release-mode CI. V2.16 remains the completed stabilization line immediately before this platform expansion.',
              'The current package version is `3.1.1+24`. V3.1 is the multilingual cross-platform release line with eight built-in offline spelling packs on the V3.0 six-target platform foundation. V3.1.1 hardens strict language-namespace writes, Unicode-scalar suggestion ranking, and current-state documentation consistency. V2.16 remains the completed stabilization line immediately before the V3 platform expansion.',
          )

          replace('docs/README.md', 'SpellChecker `3.1.0+23`', 'SpellChecker `3.1.1+24`')
          replace(
              'docs/README.md',
              'The current repository commits the web host plus portable Flutter/Dart source, ships eight built-in offline spelling language packs, exposes three public Dart API barrels, and contains ten built-in local writing rules.',
              'The current repository commits official Flutter runners for Android, iOS, Linux, macOS, Windows, and Web, ships eight built-in offline spelling language packs, exposes three public Dart API barrels, and contains ten built-in local writing rules.',
          )
          replace(
              'docs/README.md',
              '4. [Release guide](RELEASING.md) — tagged web-release workflow and release validation.',
              '4. [Release guide](RELEASING.md) — tagged multi-platform release workflow and release validation.',
          )
          replace(
              'docs/README.md',
              '6. [Platform support](PLATFORM_SUPPORT.md) — what is committed, built, validated, and still optional for native runners.',
              '6. [Platform support](PLATFORM_SUPPORT.md) — what is committed, built, validated, and still external distribution/signing work.',
          )
          replace('docs/README.md', '| Package version | `3.0.0+22` |', '| Package version | `3.1.1+24` |')
          replace(
              'docs/README.md',
              '| Built-in language packs | `en-US` and `en-GB` |',
              '| Built-in language packs | `en-US`, `en-GB`, `hi-IN`, `es-ES`, `fr-FR`, `de-DE`, `pt-BR`, `it-IT` |',
          )
          replace(
              'docs/README.md',
              '| Committed host runner | web |',
              '| Committed host runners | Android, iOS, Linux, macOS, Windows, Web |',
          )
          replace(
              'docs/README.md',
              '| Automated release artifact | Flutter web build |',
              '| Automated release artifacts | Android APK, iOS no-codesign app, Linux bundle, macOS app, Web bundle, Windows bundle |',
          )

          replace('docs/FEATURES.md', 'SpellChecker `3.1.0+23`', 'SpellChecker `3.1.1+24`')
          replace('docs/LANGUAGE_PACKS.md', 'current `3.1.0+23` language model', 'current `3.1.1+24` language model')
          replace('docs/ROADMAP.md', 'SpellChecker `3.1.0+23`', 'SpellChecker `3.1.1+24`')
          replace(
              'docs/ROADMAP.md',
              '- validated Flutter web release build artifact.',
              '- validated release-mode build artifacts for Android, iOS, Linux, macOS, Web, and Windows.',
          )
          replace(
              'docs/ROADMAP.md',
              'Current web UI has keyboard, semantics, responsive, and theme coverage. Optional expansion could include broader manual screen-reader/browser matrices, text-scale audits, automated accessibility tooling, and native-platform accessibility review when native runners become supported.',
              'Current UI has keyboard, semantics, responsive, and theme coverage. Optional expansion could include broader manual screen-reader/browser matrices, text-scale audits, automated accessibility tooling, and deeper native-platform accessibility review.',
          )

          replace('docs/RELEASE_HISTORY.md', 'Current package version: `3.1.0+23`.', 'Current package version: `3.1.1+24`.')
          replace(
              'docs/RELEASE_HISTORY.md',
              'V3.1 is the multilingual spelling foundation release line. It keeps the V3.0 six-target cross-platform build contract while expanding built-in offline spelling from two English variants to eight language packs.',
              'V3.1 is the multilingual spelling foundation release line. It keeps the V3.0 six-target cross-platform build contract while expanding built-in offline spelling from two English variants to eight language packs. V3.1.1 is a hardening patch for strict language-namespace persistence, Unicode-scalar ranking consistency, and evergreen documentation truthfulness.',
          )

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text(encoding='utf-8')
          marker = '## [3.1.0] - 2026-08-17\n'
          if marker not in text:
              raise SystemExit('3.1.0 changelog marker not found')
          entry = '''## [3.1.1] - 2026-08-17\n\n### Fixed\n- Rejected unsupported explicit language IDs in preference save/load/clear namespace APIs instead of silently routing them into the default `en-US` namespace. Corrupt or obsolete stored selected-language values still fall back safely when read.\n- Made the default suggestion ranker compare Unicode scalar lengths consistently with engine candidate filtering instead of using UTF-16 code-unit length for its final length criterion.\n- Corrected stale evergreen README/documentation claims that still described the V3.0 web-only/two-language current contract after V3.1 shipped eight languages and six committed runners.\n\n### Changed\n- Advanced package identity to `3.1.1+24` and About identity to `3.1.1`.\n- Kept the eight-language registry, ten English writing rules, transfer formats, runtime dependencies, local privacy model, and six-target release-build contract unchanged.\n\n'''
          changelog.write_text(text.replace(marker, entry + marker, 1), encoding='utf-8')

          for path in ['README.md', 'docs/README.md']:
              current = Path(path).read_text(encoding='utf-8')
              if '`3.0.0+22`' in current:
                  raise SystemExit(f'Stale current package identity remains in {path}')

      - name: Format Dart sources
        run: |
          flutter pub get
          dart format lib test tool

      - name: Commit synchronized audit changes
        run: |
          git config user.name "Sanskar"
          git config user.email "sanskarin@outlook.in"
          git add lib/features/editor/spell_checker_page.dart README.md docs/README.md docs/FEATURES.md docs/LANGUAGE_PACKS.md docs/ROADMAP.md docs/RELEASE_HISTORY.md CHANGELOG.md pubspec.lock
          if git diff --cached --quiet; then
            echo "No synchronization changes to commit."
            exit 0
          fi
          git commit -m "docs: synchronize V3.1.1 audit identity"
          git push origin HEAD:v3.1.1/line-audit-hardening
