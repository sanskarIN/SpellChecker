name: V2.15 one-time functional hardening

on:
  push:
    branches: [v2.15-unmatched-curly-brace-2026-08-15]

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out V2.15 branch
        uses: actions/checkout@v7
        with:
          ref: v2.15-unmatched-curly-brace-2026-08-15
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Apply guarded functional hardening
        run: python3 tool/v215_functional_hardening.py

      - name: Commit shared widget geometry hardening
        run: |
          git add test/writing_widget_test.dart
          git commit -m "test(widget): harden lazy findings scroll for ten-rule catalogue"

      - name: Commit Portable-settings wording hardening
        run: |
          git add test/v214_settings_transfer_rule_compatibility_test.dart
          git commit -m "test(v214): keep unset settings semantics expansion-safe"

      - name: Commit preference wording hardening
        run: |
          git add test/v214_rule_preference_compatibility_widget_test.dart
          git commit -m "test(v214): describe reset against current defaults"

      - name: Remove hardening helper
        run: |
          git rm tool/v215_functional_hardening.py
          git commit -m "tool(v215): remove functional hardening helper"

      - name: Remove hardening workflow
        run: |
          git rm .github/workflows/v215-functional-hardening.yml
          git commit -m "ci(v215): remove one-time functional hardening"

      - name: Push helper-free branch
        run: git push origin HEAD:v2.15-unmatched-curly-brace-2026-08-15
