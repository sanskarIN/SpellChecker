name: V3.3 integration bootstrap

on:
  push:
    branches: [v3.3/localization-release-prep]

permissions:
  contents: write

concurrency:
  group: v33-bootstrap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out working branch
        uses: actions/checkout@v7
        with:
          ref: v3.3/localization-release-prep
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Configure commit identity
        run: |
          git config user.name "sanskarIN"
          git config user.email "sanskarIN@outlook.in"

      - name: Integrate searchable spelling-language picker
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('lib/features/editor/spell_checker_page.dart')
          text = path.read_text()

          import_anchor = "import 'dictionary_manager_dialog.dart';\n"
          import_replacement = import_anchor + "import 'language_picker_dialog.dart';\n"
          if "import 'language_picker_dialog.dart';" not in text:
              if import_anchor not in text:
                  raise SystemExit('language picker import anchor not found')
              text = text.replace(import_anchor, import_replacement, 1)

          old = """                SizedBox(
                  width: 170,
                  child: Semantics(
                    label: 'Spelling language',
                    child: DropdownButton<String>(
                      key: const ValueKey<String>('language-selector'),
                      value: languagePack.id,
                      isDense: true,
                      isExpanded: true,
                      items: languagePacks
                          .map(
                            (SpellLanguagePack pack) =>
                                DropdownMenuItem<String>(
                                  value: pack.id,
                                  child: Text(pack.displayName),
                                ),
                          )
                          .toList(growable: false),
                      onChanged: preferencesLoaded ? onLanguageChanged : null,
                    ),
                  ),
                ),"""
          new = """                ConstrainedBox(
                  constraints: const BoxConstraints(maxWidth: 240),
                  child: SpellingLanguageSelector(
                    languagePacks: languagePacks,
                    selectedLanguage: languagePack,
                    enabled: preferencesLoaded,
                    selectorKey: const ValueKey<String>('language-selector'),
                    onChanged: (String languageId) =>
                        onLanguageChanged(languageId),
                  ),
                ),"""
          if old not in text:
              raise SystemExit('legacy language dropdown block not found')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY

          dart format lib/features/editor/spell_checker_page.dart
          git add lib/features/editor/spell_checker_page.dart
          git commit -m "Integrate searchable spelling language picker"

      - name: Add source-generated localization foundation
        run: |
          cat > l10n.yaml <<'EOF'
          arb-dir: lib/l10n
          template-arb-file: app_en.arb
          output-localization-file: app_localizations.dart
          synthetic-package: false
          nullable-getter: false
          required-resource-attributes: true
          EOF

          mkdir -p lib/l10n
          cat > lib/l10n/app_en.arb <<'EOF'
          {
            "@@locale": "en",
            "appTitle": "SpellChecker",
            "@appTitle": {"description": "Application title."},
            "keyboardShortcutsTitle": "Keyboard shortcuts",
            "@keyboardShortcutsTitle": {"description": "Title of the keyboard shortcut help dialog."},
            "keyboardShortcutsIntro": "Use these shortcuts while SpellChecker has focus. On macOS, ⌘ replaces Ctrl for the primary command shortcuts.",
            "@keyboardShortcutsIntro": {"description": "Introductory text for keyboard shortcut help."},
            "shortcutCheckSpelling": "Check spelling",
            "@shortcutCheckSpelling": {"description": "Keyboard shortcut action label for spelling analysis."},
            "shortcutOpenWritingInsights": "Open Writing insights",
            "@shortcutOpenWritingInsights": {"description": "Keyboard shortcut action label for Writing insights."},
            "shortcutNextSpellingIssue": "Next spelling issue",
            "@shortcutNextSpellingIssue": {"description": "Keyboard shortcut action label for moving to the next spelling issue."},
            "shortcutPreviousSpellingIssue": "Previous spelling issue",
            "@shortcutPreviousSpellingIssue": {"description": "Keyboard shortcut action label for moving to the previous spelling issue."},
            "shortcutOpenHelp": "Open keyboard shortcut help",
            "@shortcutOpenHelp": {"description": "Keyboard shortcut action label for opening help."},
            "keyboardShortcutsVisibleActions": "All commands also remain available through visible buttons so keyboard access is never required.",
            "@keyboardShortcutsVisibleActions": {"description": "Accessibility note in keyboard shortcut help."},
            "close": "Close",
            "@close": {"description": "Generic close action."},
            "shortcutSemantics": "{action} shortcut: {shortcut}",
            "@shortcutSemantics": {
              "description": "Screen-reader label for a shortcut row.",
              "placeholders": {
                "action": {"type": "String"},
                "shortcut": {"type": "String"}
              }
            },
            "spellingLanguageSemantics": "Spelling language. Current language {displayName}, {languageId}.",
            "@spellingLanguageSemantics": {
              "description": "Screen-reader label for the spelling-language selector.",
              "placeholders": {
                "displayName": {"type": "String"},
                "languageId": {"type": "String"}
              }
            },
            "chooseSpellingLanguage": "Choose spelling language",
            "@chooseSpellingLanguage": {"description": "Title of the searchable spelling-language picker."},
            "searchLanguages": "Search languages",
            "@searchLanguages": {"description": "Label for the language-picker search field."},
            "languageSearchHint": "Name or language ID",
            "@languageSearchHint": {"description": "Hint for searchable language identifiers."},
            "clearLanguageSearch": "Clear language search",
            "@clearLanguageSearch": {"description": "Tooltip for clearing the language search query."},
            "spellingLanguageOptionSemantics": "{displayName}, spelling language {languageId}{selectedSuffix}",
            "@spellingLanguageOptionSemantics": {
              "description": "Screen-reader label for one spelling-language option.",
              "placeholders": {
                "displayName": {"type": "String"},
                "languageId": {"type": "String"},
                "selectedSuffix": {"type": "String"}
              }
            },
            "selectedSuffix": ", selected",
            "@selectedSuffix": {"description": "Suffix appended to the selected language option semantics."},
            "selectedLanguage": "Selected language",
            "@selectedLanguage": {"description": "Semantic label for the selected-language check icon."},
            "cancel": "Cancel",
            "@cancel": {"description": "Generic cancel action."},
            "noSpellingLanguagesMatch": "No spelling languages match the current search.",
            "@noSpellingLanguagesMatch": {"description": "Live-region text when language search has no matches."},
            "noMatchingLanguages": "No matching languages",
            "@noMatchingLanguages": {"description": "Visible empty-state text for language search."}
          }
          EOF

          python3 <<'PY'
          from pathlib import Path

          pubspec = Path('pubspec.yaml')
          text = pubspec.read_text()
          old = """dependencies:
            flutter:
              sdk: flutter
            shared_preferences: ^2.5.3
          """
          new = """dependencies:
            flutter:
              sdk: flutter
            flutter_localizations:
              sdk: flutter
            intl: any
            shared_preferences: ^2.5.3
          """
          if old not in text:
              raise SystemExit('pubspec dependency anchor not found')
          text = text.replace(old, new, 1)
          text = text.replace(
              "flutter:\n  uses-material-design: true\n",
              "flutter:\n  generate: true\n  uses-material-design: true\n",
              1,
          )
          pubspec.write_text(text)

          app = Path('lib/app.dart')
          text = app.read_text()
          text = text.replace(
              "import 'package:flutter/material.dart';\nimport 'package:flutter/services.dart';\n",
              "import 'package:flutter/material.dart';\nimport 'package:flutter/services.dart';\nimport 'package:flutter_localizations/flutter_localizations.dart';\n",
              1,
          )
          text = text.replace(
              "import 'features/editor/spell_checker_page.dart';\n",
              "import 'features/editor/spell_checker_page.dart';\nimport 'l10n/app_localizations.dart';\n",
              1,
          )
          text = text.replace(
              "      title: 'SpellChecker',\n      debugShowCheckedModeBanner: false,\n",
              "      title: 'SpellChecker',\n      onGenerateTitle: (BuildContext context) =>\n          AppLocalizations.of(context).appTitle,\n      localizationsDelegates: const <LocalizationsDelegate<dynamic>>[\n        AppLocalizations.delegate,\n        GlobalMaterialLocalizations.delegate,\n        GlobalWidgetsLocalizations.delegate,\n        GlobalCupertinoLocalizations.delegate,\n      ],\n      supportedLocales: AppLocalizations.supportedLocales,\n      debugShowCheckedModeBanner: false,\n",
              1,
          )
          text = text.replace(
              "  Widget build(BuildContext context) {\n    return AlertDialog(\n      title: const Text('Keyboard shortcuts'),\n",
              "  Widget build(BuildContext context) {\n    final l10n = AppLocalizations.of(context);\n    return AlertDialog(\n      title: Text(l10n.keyboardShortcutsTitle),\n",
              1,
          )
          text = text.replace(
              "        child: const SingleChildScrollView(\n          child: Column(\n",
              "        child: SingleChildScrollView(\n          child: Column(\n",
              1,
          )
          replacements = {
              "              Text(\n                'Use these shortcuts while SpellChecker has focus. On macOS, ⌘ replaces Ctrl for the primary command shortcuts.',\n              ),": "              Text(l10n.keyboardShortcutsIntro),",
              "                action: 'Check spelling',": "                action: l10n.shortcutCheckSpelling,",
              "                action: 'Open Writing insights',": "                action: l10n.shortcutOpenWritingInsights,",
              "              _ShortcutRow(action: 'Next spelling issue', shortcut: 'F7'),": "              _ShortcutRow(\n                action: l10n.shortcutNextSpellingIssue,\n                shortcut: 'F7',\n              ),",
              "                action: 'Previous spelling issue',": "                action: l10n.shortcutPreviousSpellingIssue,",
              "                action: 'Open keyboard shortcut help',": "                action: l10n.shortcutOpenHelp,",
              "              Text(\n                'All commands also remain available through visible buttons so keyboard access is never required.',\n              ),": "              Text(l10n.keyboardShortcutsVisibleActions),",
              "          child: const Text('Close'),": "          child: Text(l10n.close),",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'app localization anchor not found: {old[:60]}')
              text = text.replace(old, new, 1)
          text = text.replace(
              "    final textTheme = Theme.of(context).textTheme;\n    final colorScheme = Theme.of(context).colorScheme;\n",
              "    final textTheme = Theme.of(context).textTheme;\n    final colorScheme = Theme.of(context).colorScheme;\n    final l10n = AppLocalizations.of(context);\n",
              1,
          )
          text = text.replace(
              "            label: '$action shortcut: $shortcut',",
              "            label: l10n.shortcutSemantics(action, shortcut),",
              1,
          )
          app.write_text(text)

          picker = Path('lib/features/editor/language_picker_dialog.dart')
          text = picker.read_text()
          text = text.replace(
              "import '../../core/spell_language_pack.dart';\n",
              "import '../../core/spell_language_pack.dart';\nimport '../../l10n/app_localizations.dart';\n",
              1,
          )
          text = text.replace(
              "  Widget build(BuildContext context) {\n    return Semantics(\n      button: true,\n      label:\n          'Spelling language. Current language ${selectedLanguage.displayName}, ${selectedLanguage.id}.',\n",
              "  Widget build(BuildContext context) {\n    final l10n = AppLocalizations.of(context);\n    return Semantics(\n      button: true,\n      label: l10n.spellingLanguageSemantics(\n        selectedLanguage.displayName,\n        selectedLanguage.id,\n      ),\n",
              1,
          )
          text = text.replace(
              "    final visiblePacks = _visibleLanguagePacks;\n\n    return AlertDialog(\n      title: const Text('Choose spelling language'),\n",
              "    final visiblePacks = _visibleLanguagePacks;\n    final l10n = AppLocalizations.of(context);\n\n    return AlertDialog(\n      title: Text(l10n.chooseSpellingLanguage),\n",
              1,
          )
          replacements = {
              "                labelText: 'Search languages',": "                labelText: l10n.searchLanguages,",
              "                hintText: 'Name or language ID',": "                hintText: l10n.languageSearchHint,",
              "                        tooltip: 'Clear language search',": "                        tooltip: l10n.clearLanguageSearch,",
              "                          label:\n                              '${pack.displayName}, spelling language ${pack.id}${selected ? ', selected' : ''}',": "                          label: l10n.spellingLanguageOptionSemantics(\n                            pack.displayName,\n                            pack.id,\n                            selected ? l10n.selectedSuffix : '',\n                          ),",
              "                                    semanticLabel: 'Selected language',": "                                    semanticLabel: l10n.selectedLanguage,",
              "          child: const Text('Cancel'),": "          child: Text(l10n.cancel),",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'picker localization anchor not found: {old[:60]}')
              text = text.replace(old, new, 1)
          text = text.replace(
              "      child: Semantics(\n        liveRegion: true,\n        label: 'No spelling languages match the current search.',\n        child: Text(\n          'No matching languages',\n          textAlign: TextAlign.center,\n        ),\n      ),",
              "      child: Builder(\n        builder: (BuildContext context) {\n          final l10n = AppLocalizations.of(context);\n          return Semantics(\n            liveRegion: true,\n            label: l10n.noSpellingLanguagesMatch,\n            child: Text(\n              l10n.noMatchingLanguages,\n              textAlign: TextAlign.center,\n            ),\n          );\n        },\n      ),",
              1,
          )
          picker.write_text(text)
          PY

          flutter pub get
          flutter gen-l10n
          dart format lib/app.dart lib/features/editor/language_picker_dialog.dart lib/l10n
          git add pubspec.yaml pubspec.lock l10n.yaml lib/app.dart lib/features/editor/language_picker_dialog.dart lib/l10n
          git commit -m "Add source generated UI localization foundation"

      - name: Add V3.3 localization integration regressions
        run: |
          cat > test/localization_foundation_test.dart <<'EOF'
          import 'package:flutter/material.dart';
          import 'package:flutter_test/flutter_test.dart';
          import 'package:shared_preferences/shared_preferences.dart';
          import 'package:spellchecker/app.dart';
          import 'package:spellchecker/features/editor/spell_checker_page.dart';
          import 'package:spellchecker/l10n/app_localizations.dart';

          void main() {
            TestWidgetsFlutterBinding.ensureInitialized();

            setUp(() {
              SharedPreferences.setMockInitialValues(<String, Object>{});
            });

            test('localization foundation exposes only the reviewed English locale', () {
              expect(
                AppLocalizations.supportedLocales,
                const <Locale>[Locale('en')],
              );
            });

            testWidgets('app shell and searchable language picker use generated strings', (
              WidgetTester tester,
            ) async {
              await tester.pumpWidget(const SpellCheckerApp());
              await tester.pumpAndSettle();

              expect(find.text('SpellChecker'), findsOneWidget);

              await tester.tap(
                find.byKey(const ValueKey<String>('language-selector')),
              );
              await tester.pumpAndSettle();

              expect(find.text('Choose spelling language'), findsOneWidget);
              expect(find.text('Search languages'), findsOneWidget);
              expect(find.text('Name or language ID'), findsOneWidget);
            });

            testWidgets('spelling-language changes never change the UI locale', (
              WidgetTester tester,
            ) async {
              await tester.pumpWidget(const SpellCheckerApp());
              await tester.pumpAndSettle();

              BuildContext pageContext = tester.element(find.byType(SpellCheckerPage));
              expect(Localizations.localeOf(pageContext), const Locale('en'));

              await tester.tap(
                find.byKey(const ValueKey<String>('language-selector')),
              );
              await tester.pumpAndSettle();
              await tester.enterText(
                find.byKey(const ValueKey<String>('language-picker-search')),
                'hi-IN',
              );
              await tester.pumpAndSettle();
              await tester.tap(
                find.byKey(const ValueKey<String>('language-option-hi-IN')),
              );
              await tester.pumpAndSettle();

              expect(find.text('Hindi'), findsOneWidget);
              pageContext = tester.element(find.byType(SpellCheckerPage));
              expect(Localizations.localeOf(pageContext), const Locale('en'));
            });
          }
          EOF

          cat > docs/LOCALIZATION.md <<'EOF'
          # UI localization

          SpellChecker V3.3 introduces Flutter source-generated localization as a presentation-layer concern. It is deliberately independent from the spelling/document language selected in the editor.

          ## Current V3.3 foundation

          - `lib/l10n/app_en.arb` is the English source-of-truth bundle.
          - `l10n.yaml` generates `AppLocalizations` into `lib/l10n`, inside the application source tree rather than through a synthetic package.
          - `flutter_localizations` supplies Flutter widget localizations and `intl` follows the version pinned by the Flutter SDK.
          - The application shell keyboard-help surface and the searchable spelling-language picker consume generated strings.
          - English is the only supported UI locale while extraction of the complete user-facing surface is still in progress.
          - Changing spelling language never changes UI locale, personal-dictionary ownership, writing-rule preferences, or deterministic analysis behavior.

          ## Adding the first non-English UI locale

          Do not add a locale merely to demonstrate translation plumbing. A locale becomes supported only after the chosen user-facing release scope is completely translated, reviewed for meaning, exercised at narrow widths and large text scale, and covered by locale-resolution/widget tests.

          A new locale must preserve stable spelling-language IDs, writing-rule IDs, Portable settings, personal-dictionary formats, and the local/offline privacy boundary. UI translation must never imply cloud translation, document upload, telemetry, or automatic document-language detection.

          ## Contributor workflow

          After changing an ARB resource, run `flutter pub get` and `flutter gen-l10n`, then format/analyze/test the project. Generated source belongs in `lib/l10n` and must stay synchronized with its ARB inputs.
          EOF

          python3 <<'PY'
          from pathlib import Path

          docs_index = Path('docs/README.md')
          text = docs_index.read_text()
          anchor = "3. [Language packs](LANGUAGE_PACKS.md) — built-ins and extension model.\n4. [Writing rules](WRITING_RULES.md)"
          replacement = "3. [Language packs](LANGUAGE_PACKS.md) — built-ins and extension model.\n4. [UI localization](LOCALIZATION.md) — V3.3 source-generated UI localization boundaries and contribution contract.\n5. [Writing rules](WRITING_RULES.md)"
          if anchor not in text:
              raise SystemExit('docs localization link anchor not found')
          text = text.replace(anchor, replacement, 1)
          text = text.replace("5. [Architecture](ARCHITECTURE.md)", "6. [Architecture](ARCHITECTURE.md)", 1)
          text = text.replace("6. [Performance](PERFORMANCE.md)", "7. [Performance](PERFORMANCE.md)", 1)
          text = text.replace("7. [Glossary](GLOSSARY.md)", "8. [Glossary](GLOSSARY.md)", 1)
          docs_index.write_text(text)

          test_path = Path('test/documentation_repository_test.dart')
          text = test_path.read_text()
          anchor = "    'LANGUAGE_PACKS.md',\n    'WRITING_RULES.md',"
          replacement = "    'LANGUAGE_PACKS.md',\n    'LOCALIZATION.md',\n    'WRITING_RULES.md',"
          if anchor not in text:
              raise SystemExit('evergreen documentation anchor not found')
          test_path.write_text(text.replace(anchor, replacement, 1))
          PY

          dart format test/localization_foundation_test.dart test/documentation_repository_test.dart
          git add test/localization_foundation_test.dart test/documentation_repository_test.dart docs/LOCALIZATION.md docs/README.md
          git commit -m "Cover V3.3 localization and locale independence"

      - name: Validate V3.3 integration
        run: |
          flutter gen-l10n
          dart format lib test tool
          git diff --exit-code
          flutter analyze
          flutter test --reporter expanded
          dart run tool/benchmark_large_document.dart --repeats=4 --warmup=0 --iterations=1 --spelling-limit=2 --writing-limit=5 --suggestions=0 --language=en-US --json

      - name: Remove one-time bootstrap workflow
        run: |
          rm .github/workflows/v33-bootstrap.yml
          git add .github/workflows/v33-bootstrap.yml
          git commit -m "Remove one-time V3.3 bootstrap workflow"
          git push origin HEAD:v3.3/localization-release-prep
