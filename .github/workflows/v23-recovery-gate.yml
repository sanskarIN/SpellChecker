name: V2.3 Release Recovery Gate

on:
  pull_request:
    branches: [v2.3-recovery-gate-base]

permissions:
  contents: write

jobs:
  recover-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out recovery branch
        uses: actions/checkout@v7
        with:
          ref: v2.3-release-recovery
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply permanent V2.3 page integration
        run: python tools/v23_page_apply.py

      - name: Remove temporary V2.3 infrastructure
        run: |
          rm -f tools/v23_page_apply.py
          rm -f tools/v23_recovery_trigger.txt
          rm -f .github/workflows/v23-integration-gate.yml

      - name: Format source and tests
        run: dart format lib test

      - name: Resolve dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Test review presets
        run: flutter test test/writing_review_preset_test.dart --reporter expanded

      - name: Test settings codec
        run: flutter test test/settings_transfer_codec_test.dart --reporter expanded

      - name: Test settings persistence
        run: flutter test test/settings_transfer_service_test.dart --reporter expanded

      - name: Test settings dialog
        run: flutter test test/settings_transfer_dialog_test.dart --reporter expanded

      - name: Test V2.3 editor workflow
        run: flutter test test/v23_widget_test.dart --reporter expanded

      - name: Test complete suite
        run: flutter test --reporter expanded

      - name: Build release web app
        run: flutter build web --release

      - name: Assert clean permanent V2.3 code tree
        shell: bash
        run: |
          grep -q '^version: 2.3.0+8$' pubspec.yaml
          grep -q "applicationVersion: '2.3.0'" lib/features/editor/spell_checker_page.dart
          grep -q "tooltip: 'Portable settings'" lib/features/editor/spell_checker_page.dart
          grep -q 'WritingReviewPreset.values' lib/features/editor/writing_insights_dialog.dart
          grep -q "'automatic-fixes'" lib/writing/writing_review_preset.dart
          test ! -e tools/v23_page_apply.py
          test ! -e tools/v23_recovery_trigger.txt
          if find .github/workflows -maxdepth 1 -type f -name 'v23-*' | grep -q .; then
            echo 'Unexpected V2.3 temporary workflow in candidate tree.' >&2
            find .github/workflows -maxdepth 1 -type f -name 'v23-*' >&2
            exit 1
          fi

      - name: Commit exact validated V2.3 code tree
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No recovery changes to commit.'
          else
            git commit -m 'Finalize V2.3 code integration'
            git push origin HEAD:v2.3-release-recovery
          fi
