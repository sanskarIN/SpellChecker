name: V2.15 one-time functional formatter

on:
  push:
    branches: [v2.15-unmatched-curly-brace-2026-08-15]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out V2.15 branch
        uses: actions/checkout@v7
        with:
          ref: v2.15-unmatched-curly-brace-2026-08-15
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Apply package-aware Dart formatting
        run: |
          dart format lib test tool
          git add lib test tool
          if ! git diff --cached --quiet; then
            git commit -m "style(v215): apply package-aware Dart formatting"
          fi

      - name: Verify immediate second format pass is clean
        run: |
          dart format --output=none --set-exit-if-changed lib test tool
          git diff --exit-code -- lib test tool

      - name: Remove one-time formatter
        run: |
          git rm .github/workflows/v215-functional-format.yml
          git commit -m "ci(v215): remove one-time functional formatter"

      - name: Push formatted helper-free branch
        run: git push origin HEAD:v2.15-unmatched-curly-brace-2026-08-15
