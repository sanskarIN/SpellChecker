name: V2.12 one-time release gate

on:
  push:
    branches:
      - v2.12-missing-punctuation-space-2026-08-15

permissions:
  contents: write

concurrency:
  group: v212-release-gate
  cancel-in-progress: true

jobs:
  release-gate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v7
        with:
          ref: v2.12-missing-punctuation-space-2026-08-15
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Verify canonical formatting
        run: dart format --output=none --set-exit-if-changed lib test tool

      - name: Analyze release candidate
        run: flutter analyze

      - name: Run complete release tests
        run: flutter test --reporter expanded

      - name: Run deterministic benchmark smoke
        shell: bash
        run: |
          dart run tool/benchmark_large_document.dart \
            --repeats=4 \
            --warmup=0 \
            --iterations=1 \
            --spelling-limit=2 \
            --writing-limit=5 \
            --suggestions=0 \
            --language=en-US \
            --json

      - name: Build release web application
        run: flutter build web --release

      - name: Verify V2.12 release identity and repository hygiene
        shell: bash
        run: |
          set -euo pipefail
          grep -Fx 'version: 2.12.0+17' pubspec.yaml
          grep -Fq "applicationVersion: '2.12.0'" lib/features/editor/spell_checker_page.dart
          grep -Fq 'MissingPunctuationSpaceRule()' lib/writing/writing_analyzer.dart
          grep -Fq "missing_punctuation_space_rule.dart" lib/writing.dart
          grep -Fq "String get id => 'missing-punctuation-space';" lib/writing/rules/missing_punctuation_space_rule.dart
          test -f test/missing_punctuation_space_rule_test.dart
          test -f test/missing_punctuation_space_unicode_test.dart
          test -f test/v212_missing_punctuation_space_widget_test.dart
          grep -Fq '## V2.12 — Missing Punctuation Spacing & Unicode Boundary Completion' what_changed.md
          grep -Fq '## [2.12.0] - 2026-08-15' CHANGELOG.md
          grep -Fq '`2.12.0+17`' README.md
          python3 - <<'PY'
          import json
          from pathlib import Path

          json.loads(Path('web/manifest.json').read_text(encoding='utf-8'))

          pubspec = Path('pubspec.yaml').read_text(encoding='utf-8').splitlines()
          dependencies = []
          in_dependencies = False
          for line in pubspec:
              if line == 'dependencies:':
                  in_dependencies = True
                  continue
              if in_dependencies and line and not line.startswith(' '):
                  break
              if in_dependencies and line.startswith('  ') and not line.startswith('    '):
                  dependencies.append(line.strip().split(':', 1)[0])
          if dependencies != ['flutter', 'shared_preferences']:
              raise SystemExit(f'unexpected direct runtime dependencies: {dependencies}')
          PY
          if git ls-files '.github/workflows/v212-*' | grep -vFx '.github/workflows/v212-release-gate.yml' | grep -q .; then
            echo 'Unexpected V2.12 helper workflow remains tracked.' >&2
            git ls-files '.github/workflows/v212-*' >&2
            exit 1
          fi
          if git ls-files 'tool/v212_*' | grep -q .; then
            echo 'Unexpected V2.12 tool helper remains tracked.' >&2
            git ls-files 'tool/v212_*' >&2
            exit 1
          fi
          if git ls-files 'v212_*' | grep -q .; then
            echo 'Unexpected V2.12 root diagnostic remains tracked.' >&2
            git ls-files 'v212_*' >&2
            exit 1
          fi
          test -f build/web/index.html
          test -f build/web/flutter_bootstrap.js
          git diff --check

      - name: Remove one-time release gate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/v212-release-gate.yml
          git commit -m "ci(release): remove one-time V2.12 release gate"
          git push origin HEAD:v2.12-missing-punctuation-space-2026-08-15
