name: V2.12 final release validator

on:
  push:
    branches:
      - v2.12-unicode-combining-boundaries

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out exact V2.12 branch
        uses: actions/checkout@v7
        with:
          ref: v2.12-unicode-combining-boundaries
          fetch-depth: 0

      - name: Reject temporary V2.12 helpers
        shell: bash
        run: |
          leftovers="$(find .github/workflows -maxdepth 1 -type f -name 'v212-*' -print)"
          if [ -n "$leftovers" ]; then
            echo "Temporary V2.12 workflows remain:" >&2
            echo "$leftovers" >&2
            exit 1
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show tool versions
        run: |
          flutter --version
          dart --version

      - name: Resolve dependencies
        run: flutter pub get

      - name: Verify lockfile stability
        run: git diff --exit-code -- pubspec.lock

      - name: Verify canonical formatting
        run: dart format --output=none --set-exit-if-changed lib test tool

      - name: Analyze
        run: flutter analyze

      - name: Run focused V2.12 Unicode regressions
        run: flutter test test/missing_punctuation_space_unicode_test.dart --reporter expanded

      - name: Run complete test suite
        run: flutter test --reporter expanded

      - name: Validate en-US benchmark compatibility
        shell: bash
        run: |
          dart run tool/benchmark_large_document.dart \
            --repeats=250 \
            --warmup=1 \
            --iterations=3 \
            --spelling-limit=200 \
            --writing-limit=200 \
            --suggestions=5 \
            --language=en-US \
            --json > /tmp/v212-us.json
          python3 <<'PY'
          import json
          from pathlib import Path
          text = Path('/tmp/v212-us.json').read_text()
          if 'hello wrld' in text:
              raise SystemExit('benchmark JSON leaked synthetic corpus text')
          data = json.loads(text)
          assert data['formatVersion'] == 1
          assert data['language'] == 'en-US'
          assert data['measuredIterations'] == 3
          outcome = data['analysisOutcome']
          expected = [
              'missing-punctuation-space',
              'punctuation-spacing',
              'repeated-punctuation',
              'repeated-space',
              'repeated-word',
              'sentence-capitalization',
              'trailing-whitespace',
          ]
          assert outcome['writingAnalyzedRuleIds'] == expected
          assert sum(outcome['writingTotalIssuesByRule'].values()) == outcome['writingTotalIssues']
          assert outcome['spellingCapturedIssues'] <= data['scenario']['spellingIssueLimit']
          assert outcome['writingCapturedIssues'] <= data['scenario']['writingIssueLimit']
          PY

      - name: Validate en-GB human benchmark compatibility
        shell: bash
        run: |
          dart run tool/benchmark_large_document.dart \
            --repeats=50 \
            --warmup=1 \
            --iterations=2 \
            --spelling-limit=50 \
            --writing-limit=100 \
            --suggestions=2 \
            --language=en-GB > /tmp/v212-gb.txt
          grep -q '^Language: en-GB$' /tmp/v212-gb.txt
          grep -q '^  Writing analyzed rules: missing-punctuation-space, punctuation-spacing, repeated-punctuation, repeated-space, repeated-word, sentence-capitalization, trailing-whitespace$' /tmp/v212-gb.txt
          if grep -q 'hello wrld' /tmp/v212-gb.txt; then
            echo 'benchmark human report leaked synthetic corpus text' >&2
            exit 1
          fi

      - name: Build release web application
        run: flutter build web --release

      - name: Verify V2.12 release identity and documentation
        shell: bash
        run: |
          grep -q '^version: 2.12.0+17$' pubspec.yaml
          grep -q "applicationVersion: '2.12.0'" lib/features/editor/spell_checker_page.dart
          grep -q '^`2.12.0+17`$' README.md
          grep -q '^## \[2.12.0\] - 2026-08-14$' CHANGELOG.md
          grep -q '^## 2.12 — Unicode combining-mark writing boundaries$' docs/ROADMAP.md
          test -f docs/V2_12_UNICODE_COMBINING_BOUNDARIES.md
          grep -Fq '\p{L}\p{M}*' lib/writing/rules/missing_punctuation_space_rule.dart
          grep -q 'Unicode combining-mark boundary compatibility' docs/API.md
          grep -q 'V2.12 decomposed Unicode boundary hardening' docs/WRITING_RULES.md
          grep -q '2.12.0+17' docs/RELEASING.md
