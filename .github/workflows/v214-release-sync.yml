name: V2.14 release synchronization

on:
  push:
    branches:
      - v2.14-unmatched-square-bracket-2026-08-15

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out V2.14 branch
        uses: actions/checkout@v7
        with:
          ref: v2.14-unmatched-square-bracket-2026-08-15
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Apply guarded release synchronization
        run: python3 tool/v214_release_sync.py

      - name: Remove release synchronizer tool
        run: |
          rm tool/v214_release_sync.py
          git add tool/v214_release_sync.py
          git commit -m "chore(v214): remove release synchronization tool"

      - name: Remove release synchronization workflow
        run: |
          rm .github/workflows/v214-release-sync.yml
          git add .github/workflows/v214-release-sync.yml
          git commit -m "ci(v214): remove release synchronization workflow"

      - name: Remove superseded working-scope document
        run: |
          rm docs/V2_14_WORKING_SCOPE.md
          git add docs/V2_14_WORKING_SCOPE.md
          git commit -m "docs(v214): retire working scope after release synchronization"

      - name: Push synchronized release commits
        run: git push origin HEAD:v2.14-unmatched-square-bracket-2026-08-15
