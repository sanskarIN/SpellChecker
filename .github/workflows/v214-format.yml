name: V2.14 package-aware formatter

on:
  push:
    branches:
      - v2.14-unmatched-square-bracket-2026-08-15

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out V2.14 branch
        uses: actions/checkout@v7
        with:
          ref: v2.14-unmatched-square-bracket-2026-08-15
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Apply canonical Dart formatting
        run: dart format lib test tool

      - name: Commit real formatter output when needed
        run: |
          git add lib test tool
          if ! git diff --cached --quiet; then
            git commit -m "style(v214): apply Dart 3.13 package-aware formatting"
          fi

      - name: Verify tracked Dart tree is clean
        run: |
          dart format lib test tool
          git diff --exit-code -- lib test tool

      - name: Remove one-time formatter
        run: |
          rm .github/workflows/v214-format.yml
          git add .github/workflows/v214-format.yml
          git commit -m "ci(v214): remove package-aware formatter"

      - name: Push formatting and cleanup commits
        run: git push origin HEAD:v2.14-unmatched-square-bracket-2026-08-15
