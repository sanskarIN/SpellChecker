name: V2.16 complete-suite failure diagnostic

on:
  push:
    branches:
      - v2.16-final-stabilization-2026-08-15
    paths:
      - .github/workflows/v216-focused-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: v2.16-final-stabilization-2026-08-15
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Resolve dependencies
        run: flutter pub get
      - name: Run complete suite
        id: full
        continue-on-error: true
        run: |
          set -o pipefail
          flutter test --reporter expanded 2>&1 | tee /tmp/full.log
      - name: Annotate complete-suite failure
        if: always()
        run: |
          if [ "${{ steps.full.outcome }}" = "failure" ]; then
            python3 - <<'PY'
          from pathlib import Path
          text = Path('/tmp/full.log').read_text(errors='replace')
          tail = text[-7000:].replace('%','%25').replace('\r','%0D').replace('\n','%0A')
          print(f'::error title=V2.16 complete-suite regression::{tail}')
          PY
          fi
      - name: Preserve failing conclusion
        if: always()
        run: |
          test "${{ steps.full.outcome }}" = "success"
