name: V2.12 final formatter

on:
  push:
    branches:
      - v2.12-missing-punctuation-space-2026-08-15

permissions:
  contents: write

concurrency:
  group: v212-final-formatter
  cancel-in-progress: true

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact V2.12 branch
        uses: actions/checkout@v7
        with:
          ref: v2.12-missing-punctuation-space-2026-08-15
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Format all tracked Dart surfaces
        shell: bash
        run: |
          set -euo pipefail
          dart format lib test tool
          git diff --check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- lib test tool; then
            git add lib test tool
            git commit -m "style: canonically format final V2.12 Dart tree"
          fi

          git rm .github/workflows/v212-final-format.yml
          git commit -m "ci: remove final V2.12 formatter"
          git push origin HEAD:v2.12-missing-punctuation-space-2026-08-15
