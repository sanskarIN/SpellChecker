name: V2.10 final release validator

on:
  push:
    branches:
      - v2.10-deterministic-benchmarks

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out exact V2.10 branch
        uses: actions/checkout@v7
        with:
          ref: v2.10-deterministic-benchmarks
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show tool versions
        run: |
          flutter --version
          dart --version

      - name: Resolve dependencies
        run: flutter pub get

      - name: Verify lockfile is stable
        run: git diff --exit-code -- pubspec.lock

      - name: Verify canonical formatting
        run: dart format --output=none --set-exit-if-changed lib test tool

      - name: Analyze
        run: flutter analyze

      - name: Run complete test suite
        run: flutter test --reporter expanded

      - name: Run US benchmark validation
        shell: bash
        run: |
          dart run tool/benchmark_large_document.dart \
            --repeats=250 \
            --warmup=1 \
            --iterations=3 \
            --spelling-limit=200 \
            --writing-limit=200 \
            --suggestions=5 \
            --language=en-US \
            --json > /tmp/benchmark-us.json
          python3 <<'PY'
          import json
          from pathlib import Path

          text = Path('/tmp/benchmark-us.json').read_text()
          if 'hello wrld' in text:
              raise SystemExit('benchmark JSON leaked synthetic corpus text')
          data = json.loads(text)
          assert data['formatVersion'] == 1
          assert data['language'] == 'en-US'
          assert data['measuredIterations'] == 3
          outcome = data['analysisOutcome']
          expected = [
              'punctuation-spacing',
              'repeated-punctuation',
              'repeated-space',
              'repeated-word',
              'sentence-capitalization',
              'trailing-whitespace',
          ]
          assert outcome['writingAnalyzedRuleIds'] == expected
          assert sum(outcome['writingTotalIssuesByRule'].values()) == outcome['writingTotalIssues']
          assert outcome['spellingCapturedIssues'] <= data['scenario']['spellingIssueLimit']
          assert outcome['writingCapturedIssues'] <= data['scenario']['writingIssueLimit']
          PY

      - name: Run UK benchmark validation
        shell: bash
        run: |
          dart run tool/benchmark_large_document.dart \
            --repeats=50 \
            --warmup=1 \
            --iterations=2 \
            --spelling-limit=50 \
            --writing-limit=100 \
            --suggestions=2 \
            --language=en-GB > /tmp/benchmark-uk.txt
          grep -q '^Language: en-GB$' /tmp/benchmark-uk.txt
          grep -q '^  Writing analyzed rules: punctuation-spacing, repeated-punctuation, repeated-space, repeated-word, sentence-capitalization, trailing-whitespace$' /tmp/benchmark-uk.txt
          grep -q '^  Writing exact totals by rule:' /tmp/benchmark-uk.txt
          if grep -q 'hello wrld' /tmp/benchmark-uk.txt; then
            echo 'benchmark human report leaked synthetic corpus text' >&2
            exit 1
          fi

      - name: Build release web application
        run: flutter build web --release

      - name: Verify release identity and permanent workflow hygiene
        shell: bash
        run: |
          grep -q '^version: 2.10.0+15$' pubspec.yaml
          grep -q "applicationVersion: '2.10.0'" lib/features/editor/spell_checker_page.dart
          grep -q '^`2.10.0+15`$' README.md
          grep -q '^## \[2.10.0\] - 2026-08-14$' CHANGELOG.md
          grep -q '^## 2.10 — Deterministic large-document benchmarking$' docs/ROADMAP.md
          test -f docs/V2_10_BENCHMARK.md
          leftovers="$(find .github/workflows -maxdepth 1 -type f -name 'v210-*' ! -name 'v210-final-release.yml' -print)"
          if [ -n "$leftovers" ]; then
            echo "Unexpected V2.10 helper workflows remain:" >&2
            echo "$leftovers" >&2
            exit 1
          fi

      - name: Record complete V2.10 engineering ledger
        shell: bash
        run: |
          if ! grep -q '^## V2.10 — Deterministic Large-Document Benchmarking$' what_changed.md; then
            cat >> what_changed.md <<'EOF'

## V2.10 — Deterministic Large-Document Benchmarking

Release version: `2.10.0+15`

About version: `2.10.0`

V2.10 implements the roadmap's repeatable large-document performance-observation milestone as developer-run tooling rather than application telemetry. The release composes the existing bounded spelling and writing-analysis APIs over generated synthetic text, keeps production analysis models timing-free, and makes benchmark workload/output contracts deterministic enough for controlled cross-commit comparisons.

### Deterministic synthetic scenario

`tool/benchmark/analysis_benchmark_scenario.dart` introduces `AnalysisBenchmarkScenario`.

- The scenario owns a source-controlled standard synthetic chunk and repeat count.
- Repetitions are separated by one newline so generated character count is deterministic.
- Scenario name must be non-blank.
- Repeat count must be positive.
- Spelling and writing capture limits must be positive.
- Suggestion limit must be non-negative, allowing a deliberate zero-suggestion scan workload.
- A custom chunk, when used by tests/developers, must not be empty.
- `characterCount` matches the generated corpus length without materializing report content.
- `toJsonMetadata()` exposes scenario shape only and deliberately excludes the chunk/corpus text.

The default chunk contains known words, one deterministic spelling misspelling, repeated interior whitespace, a repeated word, punctuation-spacing/repetition patterns, sentence-capitalization opportunities, and trailing whitespace/newline boundaries so both bounded analyzers receive stable non-trivial work.

### Stable spelling workload

`tool/benchmark/analysis_benchmark_runner.dart` supplies a fixed source-controlled synthetic spelling dictionary and frequency table instead of using the complete evolving bundled dictionary as benchmark eligibility data.

This prevents a normal dictionary expansion from silently changing whether the benchmark's intended misspelling is accepted. The selected `SpellLanguagePack` still owns tokenization, normalization, suffix handling, edit-distance policy, language identity, and other language-aware behavior.

Every warmup/measured sample creates a fresh `SpellCheckerEngine` and `WritingAnalyzer`. This prevents prior suggestion-cache/session state from contaminating later timing samples.

### Immutable benchmark samples

`tool/benchmark/analysis_benchmark_result.dart` introduces `AnalysisBenchmarkSample`.

Each measured sample records:

- zero-based iteration index;
- spelling elapsed duration;
- writing elapsed duration;
- spelling scanned token count;
- spelling captured issue count;
- spelling truncation state;
- writing captured finding count;
- writing exact total finding count;
- writing truncation state;
- sorted analyzed writing-rule IDs;
- sorted exact per-rule writing totals.

Runtime validation rejects impossible samples instead of relying on debug-only assertions:

- negative indexes/durations/counts;
- spelling captured count greater than scanned token count;
- writing exact total smaller than captured count;
- writing truncation that disagrees with whether exact totals contain uncaptured findings;
- blank or duplicate analyzed rule IDs;
- per-rule totals for non-analyzed rules;
- negative per-rule totals;
- per-rule totals that do not sum to the exact writing total.

Rule-ID lists and per-rule maps are sorted and defensively immutable snapshots.

### Cross-model scenario invariants

`AnalysisBenchmarkSummary` validates each measured sample against the scenario that generated it.

- Spelling captured issues cannot exceed the scenario spelling limit.
- A truncated spelling sample must have filled the spelling capture limit.
- Writing captured findings cannot exceed the scenario writing limit.
- A truncated writing sample must have filled the writing capture limit.
- Sample indexes must be contiguous and zero-based.
- At least one measured sample is required.
- Language ID must be non-blank.
- Warmup count must be non-negative.

Measured samples must also agree on every deterministic outcome field: spelling scanned/captured/truncated values, writing captured/exact-total/truncated values, sorted analyzed rule IDs, and exact per-rule totals. Elapsed durations may vary; workload/outcome metadata may not.

### Timing aggregation

`AnalysisBenchmarkSummary` exposes minimum, median, and maximum spelling/writing durations.

- Odd-size medians select the middle sorted microsecond value.
- Even-size medians use the integer midpoint average of the two middle values.
- Aggregation is descriptive only and has no correctness threshold.
- Timing fields remain outside `SpellCheckReport` and `WritingAnalysisResult`, preserving deterministic production result models.

### Versioned JSON report

Benchmark JSON uses `AnalysisBenchmarkSummary.formatVersion == 1`.

The report contains:

- language ID;
- scenario shape metadata;
- warmup/measured iteration counts;
- spelling/writing min/median/max microseconds;
- deterministic spelling outcome metadata;
- deterministic writing captured/exact/truncated metadata;
- sorted analyzed writing-rule IDs;
- sorted exact per-rule totals;
- individual measured timing/outcome samples.

The report never serializes generated corpus text. Incompatible future JSON shape changes require a format-version advance and documentation/consumer review.

### Human-readable report

`tool/benchmark/analysis_benchmark_reporter.dart` renders the same benchmark shape/outcome metadata for terminals.

It includes language/scenario shape, spelling outcome, writing captured/exact/truncated values, sorted analyzed rule IDs, exact per-rule totals, and min/median/max microseconds. It ends with an explicit reminder that timings are machine-dependent and corpus text is synthetic/not included.

### Strict command configuration

`tool/benchmark/analysis_benchmark_options.dart` parses the repository CLI contract.

Supported options are:

- `--repeats=N`
- `--warmup=N`
- `--iterations=N`
- `--spelling-limit=N`
- `--writing-limit=N`
- `--suggestions=N`
- `--language=ID`
- `--json`
- `--help`

Unknown options, malformed `--name=value` arguments, duplicate options, missing values, and non-integer numeric values are rejected. Constructor validation then enforces positive/non-negative contracts. Current benchmark languages are the built-in `en-US` and `en-GB` packs.

### Command exit semantics

`tool/benchmark/analysis_benchmark_command.dart` separates configuration failure from execution failure.

- Help returns exit code 0 without executing a benchmark.
- Malformed/unsupported configuration returns usage error 64 and prints usage guidance.
- Deterministic execution/result-invariant failure returns software error 70 and does not misleadingly print option usage.
- Successful human/JSON runs return 0.

The command accepts an injectable executor/output writers so exit/error behavior is regression-testable without shell-process indirection.

`tool/benchmark_large_document.dart` is the thin executable wrapper that connects command output/errors to stdout/stderr and assigns the process exit code.

### Focused regression coverage

Six dedicated benchmark test files cover the tooling in layers:

- `test/analysis_benchmark_scenario_test.dart` — deterministic corpus construction, exact character count, metadata privacy, invalid scenario bounds.
- `test/analysis_benchmark_result_test.dart` — sample/result invariants, defensive immutability, odd/even median aggregation, cross-scenario capture validation, analyzed-rule/per-rule metadata validation, deterministic multi-sample outcome enforcement, JSON corpus-text exclusion.
- `test/analysis_benchmark_runner_test.dart` — bounded spelling/writing behavior, fresh repeated samples, both built-in language packs, six-rule workload metadata, per-rule sum consistency, invalid iteration counts.
- `test/analysis_benchmark_options_test.dart` — defaults, all supported options, scenario mapping, help, malformed/unknown/duplicate/non-integer/invalid values.
- `test/analysis_benchmark_reporter_test.dart` — human output, sorted rule workload metadata, aggregate timings, corpus-text exclusion.
- `test/analysis_benchmark_command_test.dart` — help, unsupported language usage error, injected deterministic execution failure/exit 70, and an end-to-end small JSON benchmark.

The existing widget suite also verifies About version `2.10.0`.

### Permanent CI and release changes

`.github/workflows/ci.yml` now:

- formats `lib test tool`;
- runs `flutter analyze`;
- runs the complete Flutter test suite;
- runs a tiny synthetic JSON benchmark smoke command with no timing threshold.

`.github/workflows/release.yml` repeats those checks before `flutter build web --release` and artifact upload.

The benchmark smoke step verifies execution/report compatibility only. Machine-dependent elapsed values are not pass/fail gates.

### Version and release identity

- `pubspec.yaml` advances to `2.10.0+15`.
- The About dialog reports `2.10.0`.
- The About widget regression expectation advances to V2.10.
- README/changelog/roadmap/release documentation is synchronized to V2.10.

No dependency version was intentionally changed by V2.10.

### Public runtime compatibility

Benchmark classes live under `tool/` and are intentionally not exported by the three public package barrels.

V2.10 adds no public runtime spelling/writing API, writing-rule ID, language ID, persisted preference key, Portable-settings format, personal-dictionary transfer format, correction behavior, editor workflow, storage adapter, or application network API.

`shared_preferences` remains the only non-SDK runtime package dependency used for application-local preferences.

### Privacy boundary

The benchmark generates its own source-controlled synthetic corpus. It does not automatically read editor documents, clipboard contents, personal vocabulary, ignored session words, preferences, correction history, raw writing findings, or arbitrary document files.

Human/JSON reports serialize shape/count/rule/timing metadata only and exclude corpus text. The benchmark does not automatically persist or upload reports. Shell redirection/external CI artifact handling is an explicit developer/environment action outside the application runtime.

V2.10 adds no application analytics, telemetry, advertising, account system, cloud grammar/spelling service, background document upload, or runtime network request.

### Security/resource boundary

CLI values are validated data, not evaluated code. The tooling does not dynamically load rule/ranker plugins, execute imported document content, contact remote services, or promise resource isolation for arbitrary third-party rules/documents.

Timing values are descriptive machine-local observations, not CPU/wall-clock/security guarantees. Normal correctness CI deliberately avoids machine-specific timing thresholds.

### Documentation and repository metadata

The V2.10 implementation synchronizes:

- `README.md`
- `CHANGELOG.md`
- `docs/ROADMAP.md`
- `docs/V2_10_BENCHMARK.md`
- `docs/PERFORMANCE.md`
- `docs/TESTING.md`
- `docs/DEVELOPMENT.md`
- `docs/PRIVACY.md`
- `docs/RELEASING.md`
- `docs/ARCHITECTURE.md`
- `docs/API.md`
- `docs/LANGUAGE_PACKS.md`
- `docs/WRITING_RULES.md`
- `docs/ACCESSIBILITY.md`
- `docs/USER_GUIDE.md`
- `docs/TROUBLESHOOTING.md`
- `SECURITY.md`
- `SUPPORT.md`
- `CONTRIBUTING.md`
- `.github/ISSUE_TEMPLATE/bug_report.yml`
- `.github/ISSUE_TEMPLATE/feature_request.yml`
- `.github/pull_request_template.md`

Issue/PR templates now request synthetic benchmark reproduction context and explicitly distinguish deterministic workload correctness from machine-dependent timing.

### Complete tracked-file audit boundary

V2.10 starts from merged V2.9 hardening commit `1c33a95142cb951b5a8d3e69aedd5e81bfac6434`. That base had already undergone the repository-wide V2.9 code/config/test/document audit and exact final CI/release validation.

Before this ledger/release-validator commit, `git compare` from that V2.9 base to functional V2.10 candidate `ccb7a0e250f7fe859c15e383aea78c72792026fd` reported 73 granular development commits, zero commits behind main, and exactly 40 permanent changed paths. Every changed V2.10 path was reviewed through source/test/document/config inspection and/or guarded exact transformations. Every tracked path absent from that compare set is byte-identical to the fully audited V2.9 base and was therefore intentionally not churned solely to mention V2.10.

The 40-path functional diff consisted of:

- 2 issue templates;
- 1 pull-request template;
- 2 permanent workflows;
- 4 root release/governance documents (`CHANGELOG.md`, `CONTRIBUTING.md`, `README.md`, `SECURITY.md`) plus `SUPPORT.md`;
- 14 existing documentation files plus the new `docs/V2_10_BENCHMARK.md`;
- About-version implementation metadata;
- package-version metadata;
- 6 benchmark test files plus the existing About widget test;
- 6 benchmark implementation/support files under `tool/benchmark/` plus the CLI entrypoint.

`what_changed.md` is the additional permanent release-ledger path created by this final recording step.

### Validation defects caught during V2.10 development

The audit did not treat an early green predecessor release as proof that new tooling was correct.

- The first CI formatting pass identified canonical Dart 3.13 layout differences in benchmark option/result/runner tests and the result model; those were committed as formatter-only changes.
- A later formatter pass identified the final reporter/result test layout differences after rule-workload metadata was added; those were fixed separately.
- The first analyzer pass found an unnecessary language import and an incorrect `SpellCheckReport.isTruncated` reference. The runner now uses the actual `SpellCheckReport.truncated` contract and the redundant import is removed.
- A benchmark-result test initially cleared its source list before reading `source.first` for an immutability assertion. The test itself was corrected before relying on CI.
- Manual semantic review then tightened cross-model result invariants, separated command usage errors from deterministic execution errors, and added analyzed writing-rule/per-rule totals so benchmark workload changes cannot hide behind aggregate timing comparisons.

### Permanent functional CI evidence

Ordinary CI run `31768678031` (CI #340) validated helper-free functional candidate `ccb7a0e250f7fe859c15e383aea78c72792026fd` on Flutter 3.47.0 / Dart 3.13.0 and passed:

- dependency resolution;
- canonical `lib test tool` formatting;
- `flutter analyze`;
- the complete Flutter test suite;
- the threshold-free benchmark CLI smoke command.

### Final V2.10 release-validator evidence

One-time V2.10 release-validator run: __V210_RUN_ID__

That exact validator completed, before committing this ledger entry:

```text
flutter pub get
git diff --exit-code -- pubspec.lock
dart format --output=none --set-exit-if-changed lib test tool
flutter analyze
flutter test --reporter expanded
US benchmark: 250 repetitions, 1 warmup, 3 measured iterations, JSON validation
UK benchmark: 50 repetitions, 1 warmup, 2 measured iterations, human-report validation
flutter build web --release
```

The validator additionally asserted V2.10 package/About/README/changelog/roadmap identity, JSON format version 1, six sorted analyzed writing-rule IDs, exact per-rule-total sum consistency, capture limits, corpus-text exclusion in both report formats, and absence of any other `v210-*` temporary workflow.

The release candidate therefore has no known formatter failure, analyzer diagnostic, failing automated test, benchmark smoke/validation failure, lockfile drift, or release-web build failure at this gate. Timing values are deliberately not treated as correctness thresholds.

A final ordinary CI run is required after deleting this one-time validator so the exact permanent-tree head is independently checked before merge. No V2.10 helper workflow may remain in the merged tree.
EOF
            python3 <<'PY'
            import os
            from pathlib import Path
            path = Path('what_changed.md')
            text = path.read_text()
            text = text.replace('__V210_RUN_ID__', os.environ['GITHUB_RUN_ID'], 1)
            path.write_text(text)
            PY
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- what_changed.md; then
            git add what_changed.md
            git commit -m "docs: record complete V2.10 engineering changes"
            git push origin HEAD:v2.10-deterministic-benchmarks
          fi
