name: V2.10 final release validator

on:
  push:
    branches:
      - v2.10-deterministic-benchmarks

permissions:
  contents: read

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out exact V2.10 branch
        uses: actions/checkout@v7
        with:
          ref: v2.10-deterministic-benchmarks
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show tool versions
        run: |
          flutter --version
          dart --version

      - name: Resolve dependencies
        run: flutter pub get

      - name: Verify lockfile is stable
        run: git diff --exit-code -- pubspec.lock

      - name: Verify canonical formatting
        run: dart format --output=none --set-exit-if-changed lib test tool

      - name: Analyze
        run: flutter analyze

      - name: Run complete test suite
        run: flutter test --reporter expanded

      - name: Run US benchmark validation
        shell: bash
        run: |
          dart run tool/benchmark_large_document.dart \
            --repeats=250 \
            --warmup=1 \
            --iterations=3 \
            --spelling-limit=200 \
            --writing-limit=200 \
            --suggestions=5 \
            --language=en-US \
            --json > /tmp/benchmark-us.json
          python3 <<'PY'
          import json
          from pathlib import Path

          text = Path('/tmp/benchmark-us.json').read_text()
          if 'hello wrld' in text:
              raise SystemExit('benchmark JSON leaked synthetic corpus text')
          data = json.loads(text)
          assert data['formatVersion'] == 1
          assert data['language'] == 'en-US'
          assert data['measuredIterations'] == 3
          outcome = data['analysisOutcome']
          expected = [
              'punctuation-spacing',
              'repeated-punctuation',
              'repeated-space',
              'repeated-word',
              'sentence-capitalization',
              'trailing-whitespace',
          ]
          assert outcome['writingAnalyzedRuleIds'] == expected
          assert sum(outcome['writingTotalIssuesByRule'].values()) == outcome['writingTotalIssues']
          assert outcome['spellingCapturedIssues'] <= data['scenario']['spellingIssueLimit']
          assert outcome['writingCapturedIssues'] <= data['scenario']['writingIssueLimit']
          PY

      - name: Run UK benchmark validation
        shell: bash
        run: |
          dart run tool/benchmark_large_document.dart \
            --repeats=50 \
            --warmup=1 \
            --iterations=2 \
            --spelling-limit=50 \
            --writing-limit=100 \
            --suggestions=2 \
            --language=en-GB > /tmp/benchmark-uk.txt
          grep -q '^Language: en-GB$' /tmp/benchmark-uk.txt
          grep -q '^  Writing analyzed rules: punctuation-spacing, repeated-punctuation, repeated-space, repeated-word, sentence-capitalization, trailing-whitespace$' /tmp/benchmark-uk.txt
          grep -q '^  Writing exact totals by rule:' /tmp/benchmark-uk.txt
          if grep -q 'hello wrld' /tmp/benchmark-uk.txt; then
            echo 'benchmark human report leaked synthetic corpus text' >&2
            exit 1
          fi

      - name: Build release web application
        run: flutter build web --release

      - name: Verify release identity and helper hygiene
        shell: bash
        run: |
          grep -q '^version: 2.10.0+15$' pubspec.yaml
          grep -q "applicationVersion: '2.10.0'" lib/features/editor/spell_checker_page.dart
          grep -q '^`2.10.0+15`$' README.md
          grep -q '^## \[2.10.0\] - 2026-08-14$' CHANGELOG.md
          grep -q '^## 2.10 — Deterministic large-document benchmarking$' docs/ROADMAP.md
          test -f docs/V2_10_BENCHMARK.md
          leftovers="$(find .github/workflows -maxdepth 1 -type f -name 'v210-*' ! -name 'v210-final-release.yml' -print)"
          if [ -n "$leftovers" ]; then
            echo "Unexpected V2.10 helper workflows remain:" >&2
            echo "$leftovers" >&2
            exit 1
          fi
