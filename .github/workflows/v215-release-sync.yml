name: V2.15 guarded release synchronization

on:
  push:
    branches: [v2.15-unmatched-curly-brace-2026-08-15]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out V2.15 branch
        uses: actions/checkout@v7
        with:
          ref: v2.15-unmatched-curly-brace-2026-08-15
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Normalize pull-request template top-level heading
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/pull_request_template.md')
          text = path.read_text()
          if text.startswith('# '):
              raise SystemExit('pull request template already has a top-level heading; review sync assumptions')
          path.write_text('# Pull Request Checklist\n\n' + text)
          PY

      - name: Run guarded V2.15 release synchronizer
        run: python3 tool/v215_release_sync.py

      - name: Commit About source
        run: git add lib/features/editor/spell_checker_page.dart && git commit -m "feat(about): report V2.15 curly brace release"

      - name: Commit About regression
        run: git add test/widget_test.dart && git commit -m "test(about): expect V2.15 release identity"

      - name: Commit pull request guidance
        run: git add .github/pull_request_template.md && git commit -m "docs(pr): add V2.15 structural rule review checks"

      - name: Commit changelog
        run: git add CHANGELOG.md && git commit -m "docs(changelog): add V2.15 release entry"

      - name: Commit contributing guide
        run: git add CONTRIBUTING.md && git commit -m "docs(contributing): define V2.15 rule contribution baseline"

      - name: Commit README
        run: git add README.md && git commit -m "docs(readme): publish V2.15 current release"

      - name: Commit security guide
        run: git add SECURITY.md && git commit -m "docs(security): record V2.15 local analysis boundary"

      - name: Commit support guide
        run: git add SUPPORT.md && git commit -m "docs(support): explain advisory curly brace findings"

      - name: Commit accessibility guide
        run: git add docs/ACCESSIBILITY.md && git commit -m "docs(accessibility): cover tenth Writing insights rule"

      - name: Commit API guide
        run: git add docs/API.md && git commit -m "docs(api): document UnmatchedCurlyBraceRule"

      - name: Commit architecture guide
        run: git add docs/ARCHITECTURE.md && git commit -m "docs(architecture): record ten-rule pipeline integration"

      - name: Commit development guide
        run: git add docs/DEVELOPMENT.md && git commit -m "docs(development): update V2.15 validation baseline"

      - name: Commit language-pack guide
        run: git add docs/LANGUAGE_PACKS.md && git commit -m "docs(languages): document curly brace language eligibility"

      - name: Commit performance guide
        run: git add docs/PERFORMANCE.md && git commit -m "docs(performance): record ten-rule benchmark identity"

      - name: Commit privacy guide
        run: git add docs/PRIVACY.md && git commit -m "docs(privacy): record V2.15 diagnostic boundary"

      - name: Commit releasing guide
        run: git add docs/RELEASING.md && git commit -m "docs(releasing): define V2.15 acceptance gates"

      - name: Commit roadmap
        run: git add docs/ROADMAP.md && git commit -m "docs(roadmap): mark V2.15 structural milestone implemented"

      - name: Commit testing guide
        run: git add docs/TESTING.md && git commit -m "docs(testing): add V2.15 regression matrix"

      - name: Commit troubleshooting guide
        run: git add docs/TROUBLESHOOTING.md && git commit -m "docs(troubleshooting): explain unmatched curly braces"

      - name: Commit user guide
        run: git add docs/USER_GUIDE.md && git commit -m "docs(user): document V2.15 curly brace workflow"

      - name: Commit writing-rule catalogue
        run: git add docs/WRITING_RULES.md && git commit -m "docs(writing): publish ten-rule V2.15 catalogue"

      - name: Commit engineering ledger
        run: git add what_changed.md && git commit -m "docs(ledger): record complete V2.15 engineering changes"

      - name: Commit web index metadata
        run: git add web/index.html && git commit -m "docs(web): advertise V2.15 curly brace diagnostics"

      - name: Commit web manifest metadata
        run: git add web/manifest.json && git commit -m "docs(web): update V2.15 manifest description"

      - name: Remove temporary V2.15 working scope
        run: |
          git rm docs/V2_15_WORKING_SCOPE.md
          git commit -m "docs(v215): retire temporary working scope"

      - name: Remove release synchronizer
        run: |
          git rm tool/v215_release_sync.py
          git commit -m "tool(v215): remove guarded release synchronizer"

      - name: Remove one-time synchronization workflow
        run: |
          git rm .github/workflows/v215-release-sync.yml
          git commit -m "ci(v215): remove guarded release synchronization"

      - name: Verify no unexpected release-sync residue
        run: |
          test ! -e tool/v215_release_sync.py
          test ! -e .github/workflows/v215-release-sync.yml
          test ! -e docs/V2_15_WORKING_SCOPE.md
          git status --short

      - name: Push synchronized helper-free branch
        run: git push origin HEAD:v2.15-unmatched-curly-brace-2026-08-15
