name: Ensure V1.3 integration

on:
  push:
    branches:
      - v1.3-language-architecture
    paths:
      - .github/workflows/v13-ensure-integration.yml

permissions:
  contents: write

jobs:
  ensure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out latest V1.3 branch
        uses: actions/checkout@v4
        with:
          ref: v1.3-language-architecture
          fetch-depth: 0

      - name: Ensure V1.3 application integration
        run: python3 tools/v13_ensure_integration.py

      - name: Remove one-time integration helpers
        run: |
          rm -f tools/v13_apply.py
          rm -f tools/v13_ensure_integration.py
          rm -f .github/workflows/v13-apply.yml
          rm -f .github/workflows/v13-ensure-integration.yml

      - name: Commit latest integration state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No integration changes to commit."
            exit 0
          fi
          git commit -m "feat: finalize v1.3 language selection integration"
          git pull --rebase origin v1.3-language-architecture
          git push origin HEAD:v1.3-language-architecture
