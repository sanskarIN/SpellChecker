name: V2.11 release documentation sync

on:
  push:
    branches:
      - v2.11-missing-punctuation-space

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out V2.11 branch
        uses: actions/checkout@v7
        with:
          ref: v2.11-missing-punctuation-space
          fetch-depth: 0

      - name: Apply guarded V2.11 release updates
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if new in text:
                  return
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exact replacement once, found {count}')
              p.write_text(text.replace(old, new, 1))

          def insert_before(path, marker, heading, section):
              p = Path(path)
              text = p.read_text()
              if heading in text:
                  return
              count = text.count(marker)
              if count != 1:
                  raise SystemExit(f'{path}: insertion marker count is {count}')
              p.write_text(text.replace(marker, section + marker, 1))

          def append_section(path, heading, section):
              p = Path(path)
              text = p.read_text()
              if heading in text:
                  return
              if not text.endswith('\n'):
                  text += '\n'
              p.write_text(text + '\n' + section)

          replace_once(
              'lib/features/editor/spell_checker_page.dart',
              "applicationVersion: '2.10.0',",
              "applicationVersion: '2.11.0',",
          )
          replace_once(
              'test/widget_test.dart',
              "testWidgets('About dialog reports the current V2.10 release',",
              "testWidgets('About dialog reports the current V2.11 release',",
          )
          replace_once(
              'test/widget_test.dart',
              "expect(find.textContaining('2.10.0'), findsOneWidget);",
              "expect(find.textContaining('2.11.0'), findsOneWidget);",
          )

          replace_once('README.md', '`2.10.0+15`', '`2.11.0+16`')
          replace_once(
              'README.md',
              'Version 2.10 is the **Deterministic Large-Document Benchmarking** release. It adds a developer-run synthetic benchmark harness for bounded spelling and writing analysis, immutable timing/outcome summaries, stable versioned JSON and human-readable reports, strict CLI validation, and permanent CI/release smoke coverage. The benchmark never reads editor documents, adds no telemetry or persistence, and does not turn machine-dependent timing values into correctness thresholds.',
              'Version 2.11 is the **Missing Punctuation Space** release. It adds a conservative deterministic English mechanics rule for missing spaces after comma, semicolon, question-mark, and exclamation-mark word boundaries. The rule uses punctuation-only source ownership, composes safely with the existing before-punctuation spacing rule, preserves explicit stored rule sets, advances current registry defaults to seven rules, and makes the changed benchmark writing workload visible through V2.10 rule-ID/per-rule-total metadata.',
          )
          replace_once(
              'README.md',
              '- Built-in repeated-word, sentence-capitalization, repeated-space, punctuation-spacing, trailing-whitespace, and repeated-punctuation rules.',
              '- Built-in repeated-word, sentence-capitalization, repeated-space, punctuation-spacing, missing-punctuation-space, trailing-whitespace, and repeated-punctuation rules.',
          )
          insert_before(
              'README.md',
              '## Deterministic large-document benchmark — V2.10\n',
              '## Missing punctuation space — V2.11',
              '''## Missing punctuation space — V2.11\n\nWriting insights now includes **Missing punctuation space** (`missing-punctuation-space`) for English (US) and English (UK). It reports a deterministic automatic fix when a comma, semicolon, question mark, or exclamation mark is directly surrounded by Unicode letters, for example `Hello,world` → `Hello, world`.\n\nPeriods and colons are intentionally outside this rule to avoid broad false positives in domains/abbreviations, URI-like schemes, and time-like text. Numeric/non-letter neighbors and repeated punctuation are also excluded. The issue owns only the punctuation character and replaces it with the same punctuation plus one space, preserving the existing stale-source validation model.\n\nFor `Hello ,world`, the existing `punctuation-spacing` rule owns the space before the comma while V2.11 owns the comma itself; the adjacent non-overlapping fixes can therefore be applied safely in one batch. Unset/reset writing-rule preferences receive the current seven-rule default set, while explicit stored rule lists—including a historical six-rule V2.10 list or explicit disable-all—remain exact user choices.\n\nThe V2.10 benchmark remains developer tooling, but its default writing workload now visibly contains seven analyzed rule IDs. See [V2.11 rule contract](docs/V2_11_MISSING_PUNCTUATION_SPACE.md).\n\n''',
          )

          insert_before(
              'CHANGELOG.md',
              '## [2.10.0] - 2026-08-14\n',
              '## [2.11.0] - 2026-08-14',
              '''## [2.11.0] - 2026-08-14\n\n### Added\n\n- Public `MissingPunctuationSpaceRule` with stable ID `missing-punctuation-space`.\n- Conservative automatic fixes for letter-adjacent comma, semicolon, question-mark, and exclamation-mark boundaries.\n- Unicode-letter source-boundary handling with punctuation-only stale-safe replacement ownership.\n- Focused rule, analyzer, bounded-diagnostics, batch-composition, persistence, and widget regression coverage.\n- Dedicated `docs/V2_11_MISSING_PUNCTUATION_SPACE.md` contract.\n\n### Changed\n\n- Built-in writing registry/defaults advance from six to seven deterministic rules.\n- Package version advances to `2.11.0+16`; About version advances to `2.11.0`.\n- V2.10 benchmark regression expectations advance to the seven-rule default writing workload so registry evolution remains explicit in comparisons.\n- Release/user/API/privacy/security/testing/support documentation and issue/PR guidance advance to V2.11.\n\n### Correctness, compatibility, privacy, and security\n\n- Periods and colons are intentionally excluded from V2.11 missing-after-punctuation detection to avoid common domain/abbreviation/URI/time false positives.\n- Numeric/non-letter neighbors and repeated punctuation are excluded; `RepeatedPunctuationRule` remains the specialized owner of punctuation runs.\n- For before-and-after punctuation cleanup, source ranges are adjacent rather than overlapping, so existing `WritingCorrection.applyAll` safety rules remain sufficient.\n- Missing rule preference keys use the new seven-rule registry defaults. Explicit stored rule ID lists and explicit disable-all remain exact and do not silently gain the new rule.\n- V2.11 adds no runtime dependency, preference-key version, network service, telemetry, account behavior, document persistence, or dynamic rule loading.\n\n''',
          )

          insert_before(
              'docs/ROADMAP.md',
              '## Future 2.x direction\n',
              '## 2.11 — Missing punctuation space mechanics',
              '''## 2.11 — Missing punctuation space mechanics\n\nStatus: implemented.\n\n- [x] Stable public `missing-punctuation-space` rule ID and Mechanics category.\n- [x] English US/UK support through the existing language-family rule contract.\n- [x] Deterministic comma/semicolon/question/exclamation missing-space findings.\n- [x] Conservative period/colon exclusions for domain/abbreviation/URI/time safety.\n- [x] Unicode-letter boundary support and UTF-16-compatible source offsets.\n- [x] Repeated-punctuation ownership remains isolated to the specialized rule.\n- [x] Punctuation-only source ownership with stale-safe automatic replacement.\n- [x] Adjacent non-overlapping batch composition with before-punctuation spacing.\n- [x] Seven-rule default registry with exact explicit-preference compatibility.\n- [x] Bounded-analysis exact total/per-rule diagnostics.\n- [x] V2.10 benchmark seven-rule workload visibility.\n- [x] Rule/analyzer/batch/persistence/widget regression coverage and release documentation.\n\n''',
          )
          replace_once(
              'docs/ROADMAP.md',
              '- Richer deterministic writing-rule catalogue with explicit source-range ownership and stable IDs.\n',
              '',
          )
          replace_once(
              'docs/ROADMAP.md',
              '- Repeatable performance benchmarking across representative large-document corpora.\n',
              '',
          )

          replace_once(
              'docs/API.md',
              'SpellChecker 2.10 exposes reusable spelling, language, correction, suggestion-ranking, local writing-review, writing-analysis diagnostic-summary, and portable-settings APIs through three public barrels.',
              'SpellChecker 2.11 exposes reusable spelling, language, correction, suggestion-ranking, local writing-review, writing-analysis diagnostic-summary, and portable-settings APIs through three public barrels.',
          )
          append_section(
              'docs/API.md',
              '# V2.11 `MissingPunctuationSpaceRule`',
              '''# V2.11 `MissingPunctuationSpaceRule`\n\n`package:spellchecker/writing.dart` exports `MissingPunctuationSpaceRule`. Its stable ID is `missing-punctuation-space`, category is Mechanics, severity is info, and it supports the current English language family.\n\nThe rule reports punctuation-only source ranges for comma, semicolon, question mark, or exclamation mark directly surrounded by Unicode letters. Its deterministic replacement is the same punctuation plus one horizontal space. Periods/colons, numeric/non-letter neighbors, and repeated punctuation are deliberately excluded.\n\nThe built-in registry now contains seven rules and the new ID participates in `WritingRuleRegistry.defaultEnabledRuleIds`. Existing `WritingRule`, `WritingIssue`, `WritingAnalysisResult`, `WritingCorrection`, diagnostic-summary, language-pack, storage, and benchmark public/runtime constructor contracts remain unchanged. See [V2.11 rule contract](V2_11_MISSING_PUNCTUATION_SPACE.md).\n''',
          )

          append_section(
              'docs/WRITING_RULES.md',
              '## V2.11 missing punctuation space ownership',
              '''## V2.11 missing punctuation space ownership\n\nV2.11 adds `missing-punctuation-space` to the built-in default registry. It is a Mechanics rule for English (US/UK) that owns only a comma, semicolon, question mark, or exclamation mark directly surrounded by Unicode letters and replaces that punctuation with itself plus one space.\n\nThe conservative exclusions are part of the stable correctness contract: periods/colons, numeric/non-letter neighbors, and repeated punctuation are not owned by this rule. Repeated runs remain under `repeated-punctuation`; whitespace before punctuation remains under `punctuation-spacing`. Adjacent before/after punctuation fixes therefore compose without overlap.\n\nPreference semantics do not change: missing override -> current seven-rule defaults; explicit stored ID list -> exact list; stored empty list -> disable-all. See [V2.11 rule contract](V2_11_MISSING_PUNCTUATION_SPACE.md).\n''',
          )

          append_section(
              'docs/ARCHITECTURE.md',
              '## V2.11 punctuation-boundary rule ownership',
              '''## V2.11 punctuation-boundary rule ownership\n\nThe built-in writing registry now contains seven source-controlled deterministic rules. V2.11 adds a narrow ownership boundary rather than a general punctuation parser: `punctuation-spacing` owns horizontal whitespace before punctuation, `missing-punctuation-space` owns one eligible punctuation character when followed immediately by another letter, and `repeated-punctuation` owns repeated punctuation runs.\n\nThese distinct source ranges let the unchanged `WritingCorrection` stale/overlap engine compose adjacent safe fixes without widget-specific mutation logic. The new rule is public through the existing writing barrel; no storage, editor, network, plugin-loading, or language-pack architecture layer is added.\n''',
          )

          append_section(
              'docs/PERFORMANCE.md',
              '## V2.11 seven-rule writing workload',
              '''## V2.11 seven-rule writing workload\n\nV2.11 adds one linear deterministic writing-rule scan over the supplied text. As with all existing rules, bounded `maxIssues` limits retained findings rather than guaranteeing CPU time. Exact overall/per-rule totals still require the analyzer to observe every enabled supported finding.\n\nThe V2.10 benchmark records analyzed rule IDs and exact per-rule totals specifically so this registry change is visible: the default V2.11 writing benchmark workload contains seven analyzed rule IDs rather than six. Cross-version timing comparisons must therefore account for the changed workload instead of attributing all elapsed-time difference to implementation speed. Normal CI remains threshold-free.\n''',
          )

          append_section(
              'docs/TESTING.md',
              '## V2.11 missing punctuation space regression contract',
              '''## V2.11 missing punctuation space regression contract\n\nV2.11 regression coverage verifies stable rule metadata, US/UK support, comma/semicolon/question/exclamation findings, consecutive eligible boundaries, Unicode letters, already-spaced text, period/colon exclusions, numeric/non-letter exclusions, repeated-punctuation ownership, exact punctuation-only source ranges, stale-safe correction, seven-rule registry/defaults, explicit single-rule analysis, bounded exact diagnostics, adjacent batch composition, preference compatibility, Writing-insights default/explicit-override behavior, and the seven-rule V2.10 benchmark workload.\n\nPreference tests must distinguish an unset key from explicit empty and from a historical explicit six-rule set. Widget tests must prove both default enablement and explicit-override non-enable behavior.\n''',
          )

          append_section(
              'docs/DEVELOPMENT.md',
              '## V2.11 rule-development ownership guidance',
              '''## V2.11 rule-development ownership guidance\n\nWhen extending punctuation mechanics, define source-range ownership before adding regex coverage. New fixes must not create zero-length stale-unverifiable mutations or overlap an existing specialized rule without an explicit deterministic conflict policy. V2.11 intentionally leaves periods/colons and repeated punctuation outside `missing-punctuation-space` rather than broadening detection until low-false-positive ownership is demonstrated.\n\nRun formatting over `lib test tool`, analyzer, the complete tests, and benchmark smoke after registry changes. When built-in defaults change, add preference/widget regressions for unset versus explicit stored sets and advance benchmark expected rule metadata so the workload change is reviewable.\n''',
          )

          append_section(
              'docs/PRIVACY.md',
              '## V2.11 missing punctuation space privacy boundary',
              '''## V2.11 missing punctuation space privacy boundary\n\nThe new rule analyzes only the in-memory text already supplied to `WritingAnalyzer` and creates ordinary in-memory `WritingIssue` values. It does not persist finding text, source excerpts, replacements, or document history and adds no telemetry/network behavior.\n\nV2.11 introduces no new preference key. The existing per-language rule-ID list can contain `missing-punctuation-space` after a user changes rule choices. An unset key uses current seven-rule defaults; explicit stored lists/explicit empty remain exact. V2.11 adds no runtime dependency, cloud analysis, analytics, account requirement, or background upload.\n''',
          )

          append_section(
              'SECURITY.md',
              '## V2.11 punctuation-space correction boundary',
              '''## V2.11 punctuation-space correction boundary\n\n`MissingPunctuationSpaceRule` is source-controlled compiled Dart code and cannot execute document content. The automatic fix owns the existing punctuation character, allowing unchanged `WritingCorrection` exact-source validation before mutation.\n\nPeriods/colons and repeated punctuation are deliberately outside the rule's ownership, reducing ambiguous correction scope. Before-punctuation whitespace and after-punctuation insertion use adjacent non-overlapping source ranges, so batch correction retains existing deterministic ordering/stale/overlap protections. No dynamic rule loading, permission, remote service, telemetry, or new persistence/security boundary is added.\n''',
          )

          append_section(
              'docs/LANGUAGE_PACKS.md',
              '## V2.11 writing-rule language support',
              '''## V2.11 writing-rule language support\n\n`MissingPunctuationSpaceRule` declares English-family support (`en`) and therefore runs for the current `en-US` and `en-GB` built-in packs through the existing `WritingRule.supports` contract. It changes no dictionary, token pattern, word normalizer, suffix list, language ID, or suggestion metadata. Future language packs do not automatically imply linguistic suitability beyond the declared rule support contract.\n''',
          )

          append_section(
              'docs/ACCESSIBILITY.md',
              '## V2.11 Writing insights accessibility',
              '''## V2.11 Writing insights accessibility\n\nV2.11 adds no new standalone app control or keyboard shortcut. The new rule appears through the existing labeled `SwitchListTile` rule-management UI and ordinary writing finding/fix controls, so rule name, message, source range, automatic fix, filters, batch behavior, and keyboard-open workflow inherit the existing Writing-insights semantics. The About version is the only unrelated app-visible metadata change.\n''',
          )

          append_section(
              'docs/USER_GUIDE.md',
              '## Missing punctuation space — V2.11',
              '''## Missing punctuation space — V2.11\n\nWriting insights includes **Missing punctuation space** by default for users following current registry defaults. Examples include `Hello,world` → `Hello, world`, `Try;again` → `Try; again`, `Really?Yes` → `Really? Yes`, and `Great!Next` → `Great! Next`.\n\nThe rule intentionally does not flag periods/colons such as `example.com`, `mailto:user@example.com`, or `12:30`; numeric/non-letter boundaries and repeated punctuation are also outside its scope. Users with an explicit previously saved rule list keep exactly that list. Use **Reset rules to defaults** to return to the current seven-rule defaults.\n''',
          )

          append_section(
              'docs/TROUBLESHOOTING.md',
              '## Missing punctuation space is not reported',
              '''## Missing punctuation space is not reported\n\nFirst confirm **Missing punctuation space** is enabled in Writing insights. A user with an explicit pre-V2.11 rule override does not automatically gain the new ID; reset rules to defaults if current defaults are desired.\n\nThe rule intentionally ignores periods/colons, numbers/non-letter neighbors, already-spaced punctuation, and repeated punctuation. `example.com`, `mailto:user@example.com`, `12:30`, `1,000`, and `Really??Yes` are therefore not V2.11 missing-space findings by design. Re-run analysis after correcting repeated punctuation if a single-punctuation missing-space boundary becomes exposed.\n''',
          )

          append_section(
              'SUPPORT.md',
              '## V2.11 missing punctuation space support',
              '''## V2.11 missing punctuation space support\n\nFor V2.11 reports include the stable rule ID `missing-punctuation-space`, selected language, whether the rule preference was unset/default or explicitly stored, and a minimal synthetic boundary. Distinguish a false negative in an eligible letter+punctuation+letter sequence from intentionally excluded periods/colons, numeric/non-letter neighbors, or repeated punctuation. For batch issues include adjacent `punctuation-spacing` findings and applied/skipped counts using synthetic text only.\n''',
          )

          append_section(
              'CONTRIBUTING.md',
              '## V2.11 punctuation-rule contributions',
              '''## V2.11 punctuation-rule contributions\n\nChanges to `missing-punctuation-space` must preserve stable ID/source ownership or document a compatibility migration. Expanding punctuation scope requires focused false-positive tests, source-offset/correction tests, repeated-rule ownership review, bounded-diagnostics coverage, preference/default compatibility review, and benchmark workload documentation when the built-in registry changes. Do not broaden periods/colons or repeated punctuation solely to increase finding count without a deterministic low-false-positive ownership design.\n''',
          )

          replace_once(
              'docs/RELEASING.md',
              'Current V2.10 release candidate:\n\n```text\n2.10.0+15\n```',
              'Current V2.11 release candidate:\n\n```text\n2.11.0+16\n```',
          )
          replace_once(
              'docs/RELEASING.md',
              'git tag -a v2.10.0 -m "SpellChecker v2.10.0"\ngit push origin v2.10.0',
              'git tag -a v2.11.0 -m "SpellChecker v2.11.0"\ngit push origin v2.11.0',
          )
          replace_once(
              'docs/RELEASING.md',
              'dart format --output=none --set-exit-if-changed lib test\nflutter analyze\nflutter test --reporter expanded',
              'dart format --output=none --set-exit-if-changed lib test tool\nflutter analyze\nflutter test --reporter expanded\ndart run tool/benchmark_large_document.dart --repeats=4 --warmup=0 --iterations=1 --spelling-limit=2 --writing-limit=5 --suggestions=0 --language=en-US --json',
          )
          append_section(
              'docs/RELEASING.md',
              '## V2.11 missing punctuation space release checks',
              '''## V2.11 missing punctuation space release checks\n\nBefore tagging V2.11 verify `2.11.0+16` / About `2.11.0`; seven built-in/default rule IDs; conservative punctuation exclusions; Unicode/source-range behavior; repeated-punctuation ownership; adjacent batch composition; bounded exact totals; unset/default versus explicit-six/explicit-empty preference behavior; Writing-insights widget behavior; seven-rule benchmark metadata; complete format/analyze/test/benchmark smoke; lockfile stability; and `flutter build web --release`.\n\nConfirm no temporary `v211-*` helper workflow remains in the release tree and update `what_changed.md` with exact final CI/release evidence before merge.\n''',
          )

          replace_once(
              '.github/ISSUE_TEMPLATE/bug_report.yml',
              'placeholder: v2.10.0 or commit SHA',
              'placeholder: v2.11.0 or commit SHA',
          )
          append_section(
              '.github/ISSUE_TEMPLATE/bug_report.yml',
              '# V2.11 writing-rule note',
              '''# V2.11 writing-rule note\n# For missing-punctuation-space bugs include the stable rule ID, language, preference state, and a minimal synthetic letter+punctuation+letter example. Periods/colons, numeric/non-letter neighbors, and repeated punctuation are intentionally excluded.\n''',
          )
          append_section(
              '.github/ISSUE_TEMPLATE/feature_request.yml',
              '# V2.11 punctuation-rule design note',
              '''# V2.11 punctuation-rule design note\n# Requests to broaden missing-punctuation-space must define low-false-positive punctuation scope, source-range ownership, interaction with repeated/before-punctuation rules, preference/default compatibility, and benchmark workload impact.\n''',
          )
          append_section(
              '.github/pull_request_template.md',
              '## V2.11 missing punctuation space checklist',
              '''## V2.11 missing punctuation space checklist\n\n- [ ] Stable `missing-punctuation-space` ID/category/language support is preserved.\n- [ ] Punctuation scope/exclusions have focused false-positive tests.\n- [ ] Unicode/source offsets and punctuation-only stale-safe replacement are covered.\n- [ ] `punctuation-spacing` adjacency and `repeated-punctuation` ownership remain deterministic.\n- [ ] Seven-rule defaults and explicit stored preference compatibility are covered.\n- [ ] Bounded exact totals/per-rule diagnostics remain correct.\n- [ ] Writing-insights widget behavior and undo/batch safety remain covered.\n- [ ] V2.10 benchmark expected rule workload and documentation are synchronized.\n- [ ] Version/changelog/roadmap/API/privacy/security/release docs and `what_changed.md` are current.\n- [ ] No temporary `v211-*` workflow remains in the permanent tree.\n''',
          )

          append_section(
              'docs/V2_10_BENCHMARK.md',
              '## Writing workload evolution after V2.10',
              '''## Writing workload evolution after V2.10\n\nV2.10 shipped with six built-in analyzed writing-rule IDs. V2.11 adds `missing-punctuation-space`, so the default benchmark writing workload now contains seven analyzed rule IDs. This is an intentional workload change, not a benchmark-format change: format version 1 already records sorted `writingAnalyzedRuleIds` and exact per-rule totals so cross-version comparisons can detect it. Compare elapsed values only after accounting for the active rule set.\n''',
          )
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          commit_one() {
            path="$1"
            message="$2"
            if ! git diff --quiet -- "$path"; then
              git add "$path"
              git commit -m "$message"
            fi
          }

          commit_one lib/features/editor/spell_checker_page.dart "chore: update About metadata for V2.11"
          commit_one test/widget_test.dart "test: expect V2.11 About metadata"
          commit_one README.md "docs: publish V2.11 README"
          commit_one CHANGELOG.md "docs: add V2.11 changelog"
          commit_one docs/ROADMAP.md "docs: mark V2.11 rule milestone implemented"
          commit_one docs/API.md "docs: document V2.11 public rule API"
          commit_one docs/WRITING_RULES.md "docs: document V2.11 rule ownership"
          commit_one docs/ARCHITECTURE.md "docs: document V2.11 punctuation ownership architecture"
          commit_one docs/PERFORMANCE.md "docs: document V2.11 seven-rule workload"
          commit_one docs/TESTING.md "docs: define V2.11 regression contract"
          commit_one docs/DEVELOPMENT.md "docs: add V2.11 rule-development guidance"
          commit_one docs/PRIVACY.md "docs: document V2.11 privacy boundary"
