          commit_one docs/TROUBLESHOOTING.md "docs: add V2.11 troubleshooting"
          commit_one SUPPORT.md "docs: add V2.11 support guidance"
          commit_one CONTRIBUTING.md "docs: add V2.11 contribution rules"
          commit_one docs/RELEASING.md "docs: advance release procedure to V2.11"
          commit_one .github/ISSUE_TEMPLATE/bug_report.yml "docs: advance bug reports to V2.11"
