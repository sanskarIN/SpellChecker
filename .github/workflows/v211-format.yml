name: V2.11 formatter repair

on:
  push:
    branches:
      - v2.11-missing-punctuation-space

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out V2.11 branch
        uses: actions/checkout@v7
        with:
          ref: v2.11-missing-punctuation-space
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply exact formatter rewrites
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          format_one() {
            path="$1"
            message="$2"
            dart format "$path"
            if ! git diff --quiet -- "$path"; then
              git add "$path"
              git commit -m "$message"
            fi
          }

          format_one test/missing_punctuation_space_integration_test.dart "style: format punctuation space integration tests"
          format_one test/missing_punctuation_space_rule_test.dart "style: format punctuation space rule tests"

          git push origin HEAD:v2.11-missing-punctuation-space
