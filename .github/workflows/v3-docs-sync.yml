name: Finalize V3 cross-platform metadata

on:
  push:
    branches:
      - v3/cross-platform-foundation
    paths:
      - .github/workflows/v3-docs-sync.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out V3 branch
        uses: actions/checkout@v7
        with:
          ref: v3/cross-platform-foundation
          fetch-depth: 0

      - name: Apply V3 package, UI, and documentation metadata
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          OLD_PACKAGE = '2.16.0+21'
          NEW_PACKAGE = '3.0.0+22'
          OLD_APP = '2.16.0'
          NEW_APP = '3.0.0'

          def replace_required(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'Expected text not found in {path}: {old[:100]!r}')
              p.write_text(text.replace(old, new))

          def replace_if_present(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old in text:
                  p.write_text(text.replace(old, new))

          def replace_section(path, start_heading, end_heading, replacement):
              p = Path(path)
              text = p.read_text()
              start = text.index(start_heading)
              end = text.index(end_heading, start)
              p.write_text(text[:start] + replacement.rstrip() + '\n\n' + text[end:])

          # Package and runtime identity.
          replace_required('pubspec.yaml', f'version: {OLD_PACKAGE}', f'version: {NEW_PACKAGE}')
          replace_required(
              'lib/features/editor/spell_checker_page.dart',
              "applicationVersion: '2.16.0'",
              "applicationVersion: '3.0.0'",
          )
          replace_required(
              'lib/features/editor/spell_checker_page.dart',
              'A privacy-first open-source writing utility finalized in V2.16 with',
              'A privacy-first open-source cross-platform writing utility in V3.0 with official Android, iOS, Linux, macOS, Web, and Windows runners, plus',
          )
          replace_required(
              'test/documentation_repository_test.dart',
              "const currentVersion = '2.16.0+21';",
              "const currentVersion = '3.0.0+22';",
          )

          # Update current About/version assertions without touching historical docs.
          for path in Path('test').glob('*.dart'):
              text = path.read_text()
              updated = text.replace("'2.16.0'", "'3.0.0'")
              updated = updated.replace('"2.16.0"', '"3.0.0"')
              if updated != text:
                  path.write_text(updated)

          # Current/evergreen package references.
          current_docs = [
              'README.md',
              'docs/README.md',
              'docs/GETTING_STARTED.md',
              'docs/EXECUTABLE_BUILDS.md',
              'docs/RELEASING.md',
              'docs/ROADMAP.md',
              'docs/RELEASE_HISTORY.md',
          ]
          for path in current_docs:
              replace_if_present(path, OLD_PACKAGE, NEW_PACKAGE)

          replace_if_present(
              'README.md',
              'Build/package release artifacts and future native executables',
              'Build/package cross-platform release artifacts',
          )
          replace_required(
              'README.md',
              'The current package version is `3.0.0+22`. V2.16 is the final-stabilization release line in package metadata. A post-V2.16 repository audit on August 16, 2026 fixed additional sentence-statistics and sentence-capitalization edge cases without changing the package version.',
              'The current package version is `3.0.0+22`. V3.0 establishes the cross-platform foundation with committed Android, iOS, Linux, macOS, Web, and Windows runners plus multi-OS release-mode CI. V2.16 remains the completed stabilization line immediately before this platform expansion.',
          )

          # Make executable/release documentation fully cross-platform rather than partly web-only.
          replace_if_present(
              'docs/EXECUTABLE_BUILDS.md',
              'target-specific signing, packaging, and distribution work that must never be confused with the current web-only release contract.',
              'target-specific signing, packaging, and distribution work that must never be confused with the cross-platform CI build contract.',
          )
          replace_section(
              'docs/EXECUTABLE_BUILDS.md',
              '## 5. Cross-platform release build coverage',
              '## 6. Native runner regeneration and migration policy',
              '''## 5. Cross-platform release build coverage

All six Flutter target runners are committed. Normal builds do not require runner generation.

| Target | Host used by CI | Release-mode command | CI output |
| --- | --- | --- | --- |
| Web | Ubuntu | `flutter build web --release` | complete `build/web` directory |
| Android | Ubuntu | `flutter build apk --release` | release APK validation artifact |
| Linux | Ubuntu | `flutter build linux --release` | complete desktop bundle |
| Windows | Windows | `flutter build windows --release` | complete Release runtime directory |
| macOS | macOS | `flutter build macos --release` | `.app` bundle |
| iOS | macOS | `flutter build ios --release --no-codesign` | no-codesign `.app` validation bundle |

`.github/workflows/cross-platform.yml` runs these builds for normal V3 validation after shared format/analyze/test/benchmark gates succeed. `.github/workflows/release.yml` mirrors the same six-target build coverage for release tags or manual release-candidate dispatch.

Build success proves that the committed source and runner compile together. It does not replace production signing, notarization, store review, or installer/package-channel policy.

### Local target commands

Run only commands supported by the current machine/toolchain:

```bash
flutter build web --release
flutter build apk --release
flutter build linux --release
flutter build macos --release
flutter build windows --release
flutter build ios --release --no-codesign
```

The operating-system restrictions described in the target sections below still apply. In particular, Apple targets require macOS/Xcode and Windows builds require Windows/Visual Studio desktop tooling.

### Web deployment boundary

The complete `build/web/` directory is deployable static output. The release workflow uploads it as an artifact but does not currently deploy a hosted website. Optional Wasm mode (`flutter build web --release --wasm`) is not the official automated build mode and requires separate compatibility review.

### Artifact retention boundary

GitHub Actions artifacts are temporary workflow storage. They are not automatically permanent GitHub Releases, app-store packages, notarized applications, or hosted websites.''',
          )

          # Release guide fixes and V3 tag examples.
          replace_if_present(
              'docs/RELEASING.md',
              'The workflow uploads target-specific artifacts named from `v3/cross-platform-foundation`.',
              'The workflow uploads target-specific artifacts named from the triggering ref or release tag.',
          )
          replace_if_present(
              'docs/RELEASING.md',
              'git tag v2.16.0\ngit push origin v2.16.0',
              'git tag v3.0.0\ngit push origin v3.0.0',
          )
          replace_if_present(
              'docs/RELEASING.md',
              'Example:\n\n```text\n2.16.0+21\n```',
              'Example:\n\n```text\n3.0.0+22\n```',
          )

          # Roadmap opening: V2.16 is historical; V3 is current.
          roadmap = Path('docs/ROADMAP.md')
          roadmap_text = roadmap.read_text()
          old_intro = (
              '# Roadmap\n\nSpellChecker `3.0.0+22` represents the completed V2.16 stabilization line. '
              'This roadmap distinguishes **shipped current behavior** from **optional future directions**. '
              'It is not a promise that every future idea will be implemented, nor a schedule.'
          )
          if old_intro in roadmap_text:
              roadmap_text = roadmap_text.replace(
                  old_intro,
                  '# Roadmap\n\nSpellChecker `3.0.0+22` is the current V3 cross-platform foundation. '
                  'V2.16 remains the completed stabilization line that preceded native platform expansion. '
                  'This roadmap distinguishes **shipped current behavior** from **optional future directions**. '
                  'It is not a promise that every future idea will be implemented, nor a schedule.',
              )
              roadmap.write_text(roadmap_text)

          # Release history: preserve V2 history and add V3 above it.
          history = Path('docs/RELEASE_HISTORY.md')
          history_text = history.read_text()
          start = history_text.index('## Current package release')
          end = history_text.index('## V2.16', start)
          current_block = '''## Current package release

Current package version: `3.0.0+22`.

V3.0 is the cross-platform foundation release line. It retains the V2.16 spelling/writing behavior while adding committed Flutter runners and automated release-mode build validation for Android, iOS, Linux, macOS, Web, and Windows.

## V3.0

- [V3.0 cross-platform foundation](V3_0_CROSS_PLATFORM_FOUNDATION.md) — platform runner generation, stable application identity, multi-OS CI/release builds, signing boundaries, documentation migration, and validation requirements.

V3.0 changes the platform/release surface rather than the deterministic spelling/writing algorithms or local privacy model.

'''
          history.write_text(history_text[:start] + current_block + history_text[end:])

          # New durable V3 release/validation record.
          v3 = Path('docs/V3_0_CROSS_PLATFORM_FOUNDATION.md')
          v3.write_text('''# V3.0 Cross-Platform Foundation

## Release identity

- Package: `spellchecker`
- Version: `3.0.0+22`
- User-facing version: `3.0.0`
- Stable reverse-domain native identity: `in.sanskar.spellchecker` where applicable
- User-facing application name: `SpellChecker`

## Purpose

V3.0 converts SpellChecker from a repository with only a committed web runner into a repository-supported Flutter application across Android, iOS, Linux, macOS, Web, and Windows while preserving the privacy-first deterministic spelling/writing architecture established through V2.16.

## Platform foundation

Flutter stable generated the native runner families from the existing application source. The project-owned web shell was preserved. The committed `.metadata` file tracks all six platform families so later Flutter migrations have a template baseline.

The V3 branch contains:

- `android/`
- `ios/`
- `linux/`
- `macos/`
- `web/`
- `windows/`

Platform presentation metadata uses `SpellChecker`; stable binary/package identifiers remain intentionally machine-friendly and should not be changed casually after release.

## Cross-platform CI contract

`.github/workflows/cross-platform.yml` runs shared quality gates once, then release-mode target builds on appropriate GitHub-hosted systems:

```text
Web      ubuntu-latest   flutter build web --release
Android  ubuntu-latest   flutter build apk --release
Linux    ubuntu-latest   flutter build linux --release
Windows  windows-latest  flutter build windows --release
macOS    macos-latest    flutter build macos --release
iOS      macos-latest    flutter build ios --release --no-codesign
```

The shared quality gate remains canonical formatting, `flutter analyze`, the complete Flutter test suite, and deterministic benchmark smoke.

## Release workflow contract

`.github/workflows/release.yml` mirrors six-target build coverage for `v*` tags and manual dispatch. Build outputs are uploaded as GitHub Actions artifacts. The workflow deliberately does not commit or synthesize private signing material.

## Signing and distribution boundary

Repository-supported and CI-buildable do not automatically mean store-ready. Production distribution still requires channel-specific work such as Android release signing, Apple provisioning, macOS notarization, optional Windows signing/installer packaging, and a chosen Linux package/distribution format.

No private keystore, certificate private key, provisioning credential, store secret, or notarization secret belongs in Git history.

## Privacy and runtime behavior

V3.0 does not add cloud spelling/grammar, generative rewriting, telemetry, accounts, document upload, or automatic document persistence. Existing local preference behavior continues through `shared_preferences` implementations for each target.

Platform-specific storage backends, clipboard policy, keyboard interception, and accessibility stacks differ by operating system; these differences are documented in `PLATFORM_SUPPORT.md` and must be part of manual distribution validation.

## Regression protection

Repository tests now require representative committed runner files for all six targets and require `.metadata` to list each platform. The executable inventory test treats Flutter-generated platform roots as managed runner trees while continuing to protect project-owned files and cross-platform workflow controls.

## Validation criteria

A V3.0 candidate is acceptable only when:

1. canonical Dart formatting is clean;
2. `flutter analyze` is clean;
3. the complete Flutter test suite passes;
4. deterministic benchmark smoke passes;
5. Web release build succeeds;
6. Android release APK build succeeds;
7. Linux release bundle build succeeds;
8. Windows release bundle build succeeds;
9. macOS release app build succeeds;
10. iOS release no-codesign build succeeds;
11. README/platform/release/build documentation matches those claims;
12. no production signing secret is committed.

## Follow-up phases

V3.0 establishes buildable platform coverage. Later phases can add permanent GitHub Release creation, public web deployment, store/installer packaging, signing/notarization workflows using repository/environment secrets, platform-specific branding assets, and broader manual device/accessibility matrices.
''')

          # Documentation hub gets an explicit V3 historical record link.
          docs_index = Path('docs/README.md')
          index_text = docs_index.read_text()
          anchor = '- [Release history](RELEASE_HISTORY.md)'
          if anchor in index_text and 'V3_0_CROSS_PLATFORM_FOUNDATION.md' not in index_text:
              index_text = index_text.replace(
                  anchor,
                  '- [V3.0 cross-platform foundation](V3_0_CROSS_PLATFORM_FOUNDATION.md)\n' + anchor,
              )
              docs_index.write_text(index_text)

          # Executable inventory must account for the new tracked V3 record.
          builds = Path('docs/EXECUTABLE_BUILDS.md')
          builds_text = builds.read_text()
          end_marker = '<!-- tracked-file-inventory:end -->'
          inventory_line = '- `docs/V3_0_CROSS_PLATFORM_FOUNDATION.md`\n'
          if inventory_line.strip() not in builds_text:
              builds_text = builds_text.replace(end_marker, inventory_line + '\n' + end_marker)
              builds.write_text(builds_text)

          # Changelog entry immediately before the V2.16 record.
          changelog = Path('CHANGELOG.md')
          change_text = changelog.read_text()
          v3_entry = '''## [3.0.0] - 2026-08-17

### Added
- Committed official Flutter runners for Android, iOS, Linux, macOS, Windows, and Web under stable native identity `in.sanskar.spellchecker` where applicable.
- Added multi-OS cross-platform CI that runs shared source-quality gates and release-mode builds for all six targets.
- Expanded the release workflow to build and upload Android, iOS no-codesign, Linux, macOS, Web, and Windows artifacts.
- Added positive repository regression checks requiring every supported platform runner and Flutter `.metadata` registration.
- Added V3 platform support, executable-build, release, getting-started, roadmap, and historical validation documentation.

### Changed
- Advanced package identity to `3.0.0+22` and About identity to `3.0.0`.
- Branded Android, iOS, Linux, macOS, and Windows presentation metadata as `SpellChecker` while retaining stable machine identifiers/binary names.
- Reframed platform support from web-only runner support to repository-supported and CI-artifact coverage across all Flutter desktop/mobile/web targets.

### Compatibility, privacy, and distribution boundary
- Deterministic spelling/writing algorithms, ten-rule catalogue, language packs, transfer formats, and local privacy model remain compatible with V2.16.
- Runtime dependencies remain Flutter and `shared_preferences`; V3 adds no telemetry, cloud writing, accounts, document upload, or background network analysis.
- Production Android/Apple/macOS/Windows signing, notarization, store credentials, and channel-specific installers/packages remain external release-engineering work; private signing material is never committed.

'''
          marker = '## [2.16.0] - 2026-08-15'
          if '## [3.0.0] - 2026-08-17' not in change_text:
              if marker not in change_text:
                  raise SystemExit('Could not locate V2.16 changelog marker')
              change_text = change_text.replace(marker, v3_entry + marker)
              changelog.write_text(change_text)

          # Show stale current-state references for audit without touching historical V2 files.
          print('Remaining current-state 2.16 package references:')
          for path in [Path('README.md'), *Path('docs').glob('*.md')]:
              if path.name.startswith('V2_') or path.name == 'POST_V216_AUDIT_2026_08_16.md':
                  continue
              for number, line in enumerate(path.read_text().splitlines(), 1):
                  if OLD_PACKAGE in line:
                      print(f'{path}:{number}:{line}')
          PY

      - name: Commit package and runtime identity
        shell: bash
        run: |
          git config user.name "Sanskar"
          git config user.email "sanskarin@outlook.in"
          git add pubspec.yaml lib/features/editor/spell_checker_page.dart test
          if ! git diff --cached --quiet; then
            git commit -m "chore: advance SpellChecker to 3.0.0"
          fi

      - name: Commit V3 release history
        shell: bash
        run: |
          git add CHANGELOG.md docs/V3_0_CROSS_PLATFORM_FOUNDATION.md docs/RELEASE_HISTORY.md
          if ! git diff --cached --quiet; then
            git commit -m "docs: record V3 cross-platform foundation"
          fi

      - name: Commit evergreen V3 documentation
        shell: bash
        run: |
          git add README.md docs
          if ! git diff --cached --quiet; then
            git commit -m "docs: finalize V3 cross-platform release guidance"
          fi

      - name: Push finalized V3 commits
        run: git push origin HEAD:v3/cross-platform-foundation
