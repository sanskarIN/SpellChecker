name: Documentation and metadata audit

on:
  push:
    branches: [main]
    paths:
      - README.md
      - CHANGELOG.md
      - pubspec.yaml
      - 'docs/**'
      - 'lib/core/spell_language_pack.dart'
      - 'lib/features/editor/spell_checker_page.dart'
      - 'lib/writing/**'
      - 'test/documentation_repository_test.dart'
      - '.github/workflows/v3-docs-sync.yml'
  pull_request:
    branches: [main]
    paths:
      - README.md
      - CHANGELOG.md
      - pubspec.yaml
      - 'docs/**'
      - 'lib/core/spell_language_pack.dart'
      - 'lib/features/editor/spell_checker_page.dart'
      - 'lib/writing/**'
      - 'test/documentation_repository_test.dart'
      - '.github/workflows/v3-docs-sync.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Verify documentation and repository metadata
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check audit formatting
        run: dart format --output=none --set-exit-if-changed test/documentation_repository_test.dart

      - name: Run documentation repository audit
        run: flutter test test/documentation_repository_test.dart --reporter expanded
