name: Finalize and merge V1.3

on:
  push:
    branches:
      - v1.3-language-architecture
    paths:
      - .github/workflows/v13-finalize-merge.yml

permissions:
  contents: write
  pull-requests: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out latest V1.3 branch
        uses: actions/checkout@v4
        with:
          ref: v1.3-language-architecture
          fetch-depth: 0

      - name: Rebase onto latest branch tip
        run: |
          git fetch origin v1.3-language-architecture main
          git rebase origin/v1.3-language-architecture

      - name: Apply any pending guarded integration
        run: |
          if [ -f tools/v13_ensure_integration.py ]; then
            python3 tools/v13_ensure_integration.py
          elif [ -f tools/v13_apply.py ]; then
            python3 tools/v13_apply.py
          fi
          if [ -f tools/v13_variant_guard.py ]; then
            python3 tools/v13_variant_guard.py
          fi
          if [ -f tools/v13_docs_apply.py ]; then
            python3 tools/v13_docs_apply.py
          fi

      - name: Remove all one-time V1.3 helpers
        run: |
          rm -f tools/v13_apply.py
          rm -f tools/v13_ensure_integration.py
          rm -f tools/v13_docs_apply.py
          rm -f tools/v13_variant_guard.py
          rm -f V1.3_VALIDATED.md
          rm -f .github/workflows/v13-apply.yml
          rm -f .github/workflows/v13-ensure-integration.yml
          rm -f .github/workflows/v13-docs-apply.yml
          rm -f .github/workflows/v13-variant-guard.yml
          rm -f .github/workflows/v13-final-validate.yml
          rm -f .github/workflows/v13-finalize-merge.yml

      - name: Verify complete V1.3 integration
        run: |
          grep -F 'version: 1.3.0+4' pubspec.yaml
          grep -F "ValueKey<String>('language-selector')" lib/features/editor/spell_checker_page.dart
          grep -F 'encodeForLanguage' lib/features/editor/dictionary_manager_dialog.dart
          grep -F "export 'core/spell_language_pack.dart';" lib/spell_checker.dart
          grep -F 'words.removeAll(EnglishGbDictionary.words)' lib/core/spell_language_pack.dart
          grep -F 'spellchecker.personal_words.v2.' lib/storage/dictionary_preferences.dart
          grep -F '_legacyPersonalWordsKey, normalized' lib/storage/dictionary_preferences.dart
          grep -F '`1.3.0+4`' README.md
          grep -F '## [1.3.0]' CHANGELOG.md
          grep -F '## 1.3 — Language architecture' docs/ROADMAP.md
          grep -F 'Status: implemented.' docs/ROADMAP.md
          grep -F '# Language Packs' docs/LANGUAGE_PACKS.md
          test -f test/language_pack_test.dart
          test -f test/language_dictionary_codec_test.dart
          test -f test/language_preferences_test.dart
          test -f test/language_widget_test.dart

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show tool versions
        run: |
          flutter --version
          dart --version

      - name: Install dependencies
        run: flutter pub get

      - name: Format Dart sources and tests
        run: dart format lib test

      - name: Verify formatting is stable
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Test complete suite
        run: flutter test --reporter expanded

      - name: Build release web app
        run: flutter build web --release

      - name: Commit exact validated tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "feat: finalize complete v1.3 language architecture"
          fi
          git pull --rebase origin v1.3-language-architecture
          git push origin HEAD:v1.3-language-architecture

      - name: Find or create completion pull request
        id: pr
        run: |
          git fetch origin main
          PR_NUMBER=$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --head v1.3-language-architecture \
            --base main \
            --state open \
            --json number \
            --jq '.[0].number // empty')

          if [ -z "$PR_NUMBER" ]; then
            if git diff --quiet origin/main HEAD; then
              echo "number=" >> "$GITHUB_OUTPUT"
              echo "No completion PR is needed; main already has this validated tree."
              exit 0
            fi
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head v1.3-language-architecture \
              --title "Complete V1.3 language architecture" \
              --body "Completes the fully validated V1.3 language architecture after any earlier PR merge. The final branch tree passed formatting, flutter analyze, the complete Flutter test suite, and a release web build in the self-cleaning V1.3 finalization workflow."
            PR_NUMBER=$(gh pr list \
              --repo "$GITHUB_REPOSITORY" \
              --head v1.3-language-architecture \
              --base main \
              --state open \
              --json number \
              --jq '.[0].number')
          fi

          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Update validated PR description
        if: steps.pr.outputs.number != ''
        run: |
          PR_NUMBER='${{ steps.pr.outputs.number }}'
          gh pr edit "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --body "## SpellChecker V1.3 — complete language architecture

          ### Included
          - SpellLanguagePack abstraction and built-in registry
          - English (US) and English (UK) packs
          - Unicode-aware tokenization and punctuation normalization
          - Variant-specific dictionaries and frequency metadata
          - Language-tagged SpellIssue and detailed SpellSuggestion metadata
          - Explicit persisted editor language selection
          - Per-language personal dictionary/ignored-session isolation
          - Version-2 language-tagged dictionary import/export with V1 compatibility
          - V1 legacy personal-word migration into en-US
          - Complete engine, codec, persistence, selector, isolation, Unicode, and regression tests
          - Complete README/changelog/API/architecture/user/development/testing/accessibility/troubleshooting/release/privacy/security/support/contribution/language-pack documentation
          - No runtime cloud service, telemetry, account system, or automatic language detection

          ### Final validation
          The exact branch tree was formatted and then successfully passed flutter pub get, flutter analyze, flutter test --reporter expanded, and flutter build web --release in the V1.3 self-cleaning finalization workflow before this merge step."

      - name: Merge exact validated V1.3 head
        if: steps.pr.outputs.number != ''
        run: |
          PR_NUMBER='${{ steps.pr.outputs.number }}'
          HEAD_SHA=$(git rev-parse HEAD)
          gh api \
            --method PUT \
            -H 'Accept: application/vnd.github+json' \
            "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/merge" \
            -f merge_method=merge \
            -f sha="$HEAD_SHA" \
            -f commit_title="Merge complete V1.3 language architecture (#$PR_NUMBER)" \
            -f commit_message="Complete the V1.3 language architecture with explicit US/UK packs, Unicode-aware tokenization, per-language persistence, language-tagged suggestions/issues, migration, tests, and synchronized documentation. The exact head passed formatting, analyzer, full tests, and a release web build before merge."
