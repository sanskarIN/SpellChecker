name: V2.11 formatter helper

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out V2.11 branch
        uses: actions/checkout@v7
        with:
          ref: v2.11-accessibility-review-2026-08-14
          fetch-depth: 0
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Apply canonical Dart formatting
        run: dart format lib/features/editor/writing_insights_dialog.dart
      - name: Commit formatter output
        shell: bash
        run: |
          if git diff --quiet -- lib/features/editor/writing_insights_dialog.dart; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/editor/writing_insights_dialog.dart
          git commit -m "style: format V2.11 focus scope"
          git push origin HEAD:v2.11-accessibility-review-2026-08-14
