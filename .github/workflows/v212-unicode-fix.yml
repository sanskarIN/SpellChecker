name: V2.12 Unicode boundary repair

on:
  push:
    branches:
      - v2.12-unicode-combining-boundaries

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out V2.12 branch
        uses: actions/checkout@v7
        with:
          ref: v2.12-unicode-combining-boundaries
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Extend the preceding Unicode cluster boundary
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('lib/writing/rules/missing_punctuation_space_rule.dart')
          text = path.read_text()
          old = r"    r'(\p{L})([ \t]*)([,;!?])(\p{L})',"
          new = r"    r'(\p{L}\p{M}*)([ \t]*)([,;!?])(\p{L})',"
          if new not in text:
              if text.count(old) != 1:
                  raise SystemExit(f'expected matcher exactly once, found {text.count(old)}')
              path.write_text(text.replace(old, new, 1))
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- lib/writing/rules/missing_punctuation_space_rule.dart; then
            git add lib/writing/rules/missing_punctuation_space_rule.dart
            git commit -m "fix(writing): support combining marks before punctuation"
          fi

      - name: Apply canonical formatting to V2.12 tests
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          dart format test/missing_punctuation_space_unicode_test.dart
          if ! git diff --quiet -- test/missing_punctuation_space_unicode_test.dart; then
            git add test/missing_punctuation_space_unicode_test.dart
            git commit -m "style: format V2.12 Unicode boundary tests"
          fi

      - name: Remove helper and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/v212-unicode-fix.yml
          git commit -m "ci: remove one-time V2.12 Unicode repair helper"
          git push origin HEAD:v2.12-unicode-combining-boundaries
