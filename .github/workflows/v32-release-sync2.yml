name: V3.2 one-time release sync retry

on:
  push:
    branches:
      - v3.2/language-expansion-unicode-hardening

permissions:
  contents: write

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, '[v32-sync]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Reuse deterministic V3.2 transformation
        shell: python
        run: |
          from pathlib import Path

          workflow = Path('.github/workflows/v32-release-sync.yml').read_text()
          marker = '      - name: Synchronize V3.2 current-state metadata\n'
          start = workflow.index(marker)
          run_start = workflow.index('        run: |\n', start) + len('        run: |\n')
          end = workflow.index('      - name: Canonical format\n', run_start)
          lines = workflow[run_start:end].splitlines()
          program = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines)
          exec(compile(program, '<v32-sync>', 'exec'))

          # The permanent audit workflow is updated separately through the GitHub
          # connector because Actions tokens cannot write workflow files here.
          Path('.github/workflows/v3-docs-sync.yml').write_text(
              __import__('subprocess').check_output(
                  ['git', 'show', 'HEAD:.github/workflows/v3-docs-sync.yml'],
                  text=True,
              )
          )

          guide = Path('docs/EXECUTABLE_BUILDS.md')
          text = guide.read_text().replace(
              '- `.github/workflows/v32-release-sync2.yml`\n',
              '',
          )
          guide.write_text(text)
      - name: Canonical format
        run: dart format lib test tool
      - name: Commit synchronized release state
        shell: bash
        run: |
          git config user.name "Sanskar"
          git config user.email "sanskarin@outlook.in"
          git add README.md CHANGELOG.md docs lib test
          if git diff --cached --quiet; then
            echo "No synchronization changes."
            exit 0
          fi
          git commit -m "docs: synchronize V3.2 release contract [v32-sync]"
          git push origin HEAD:v3.2/language-expansion-unicode-hardening
