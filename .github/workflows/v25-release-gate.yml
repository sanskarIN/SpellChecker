name: V2.5 Release Gate

on:
  pull_request:
    branches: [v2.5-gate-base]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out V2.5 feature branch
        uses: actions/checkout@v7
        with:
          ref: v2.5-bounded-analysis
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply permanent V2.5 release integration
        run: python tools/v25_release_apply.py

      - name: Remove one-time helper
        run: rm -f tools/v25_release_apply.py

      - name: Format source and tests
        run: dart format lib test

      - name: Resolve dependencies
        run: flutter pub get

      - name: Verify lockfile stability
        run: git diff --exit-code -- pubspec.lock

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Test bounded analysis core
        run: flutter test test/spell_check_report_test.dart --reporter expanded

      - name: Test bounded analysis widget workflow
        run: flutter test test/bounded_analysis_widget_test.dart --reporter expanded

      - name: Test complete suite
        run: flutter test --reporter expanded

      - name: Build release web app
        run: flutter build web --release

      - name: Audit permanent V2.5 tree
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -q '^version: 2.5.0+10$' pubspec.yaml
          grep -q "applicationVersion: '2.5.0'" lib/features/editor/spell_checker_page.dart
          grep -q 'class SpellCheckReport' lib/core/spell_check_report.dart
          grep -q 'SpellCheckReport analyze' lib/core/spell_checker_engine.dart
          grep -q 'maxIssues: _maxVisibleSpellingIssues' lib/features/editor/spell_checker_page.dart
          grep -q '_maxVisibleSpellingIssues = 200' lib/features/editor/spell_checker_page.dart
          grep -q '200+' test/bounded_analysis_widget_test.dart
          grep -q "spell_check_report.dart" lib/spell_checker.dart
          grep -q '`2.5.0+10`' README.md
          grep -q '## \[2.5.0\] - 2026-08-09' CHANGELOG.md
          grep -q '## 2.5 — Bounded analysis and large-document safety' docs/ROADMAP.md
          grep -q '# V2.5 bounded spelling-analysis APIs' docs/API.md
          grep -q '# V2.5 bounded analysis boundary' docs/ARCHITECTURE.md
          grep -q '^# Performance and large-document behavior$' docs/PERFORMANCE.md
          grep -q '# Large documents and limited spelling results — V2.5' docs/USER_GUIDE.md
          grep -q '## V2.5 bounded-analysis coverage' docs/TESTING.md
          grep -q '## V2.5 limited-result accessibility' docs/ACCESSIBILITY.md
          grep -q '## Results show 200+ — V2.5' docs/TROUBLESHOOTING.md
          grep -q '## V2.5 bounded-analysis privacy behavior' docs/PRIVACY.md
          grep -q '## V2.5 bounded-analysis safety boundary' SECURITY.md
          grep -q '# V2.5 large-document reports' SUPPORT.md
          grep -q 'Current V2.5 release:' docs/RELEASING.md
          grep -q 'git tag -a v2.5.0' docs/RELEASING.md
          grep -q 'bounded large-document spelling results' web/index.html
          grep -q 'bounded large-document spelling results' web/manifest.json
          grep -q '## V2.5 bounded-analysis / performance' .github/pull_request_template.md
          test ! -e tools/v25_release_apply.py
          if find .github/workflows -maxdepth 1 -type f -name 'v25-*' | grep -q .; then
            echo 'Unexpected V2.5 temporary workflow in candidate tree.' >&2
            exit 1
          fi
          python -m json.tool web/manifest.json >/dev/null
          python - <<'PY'
          from pathlib import Path
          lines = Path('pubspec.yaml').read_text().splitlines()
          start = lines.index('dependencies:') + 1
          end = lines.index('dev_dependencies:')
          direct = []
          for line in lines[start:end]:
              if line.startswith('  ') and not line.startswith('    ') and ':' in line:
                  direct.append(line.strip().split(':', 1)[0])
          if direct != ['flutter', 'shared_preferences']:
              raise SystemExit(f'Unexpected runtime dependencies: {direct}')
          PY

      - name: Commit exact validated V2.5 tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'V2.5 feature branch already matches the validated tree.'
          else
            git commit -m 'Finalize V2.5 bounded analysis release'
            git push origin HEAD:v2.5-bounded-analysis
          fi
