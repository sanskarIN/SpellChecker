name: V2.12 observable formatting repair

on:
  push:
    branches:
      - v2.12-missing-punctuation-space-2026-08-15

permissions:
  contents: write

concurrency:
  group: v212-observable-formatting-repair
  cancel-in-progress: true

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out current branch head
        uses: actions/checkout@v7
        with:
          ref: v2.12-missing-punctuation-space-2026-08-15
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Repair and record exact formatting drift
        shell: bash
        run: |
          set -euo pipefail
          dart format lib test tool
          git diff --check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if ! git diff --quiet -- lib test tool; then
            echo "Formatter changed these tracked Dart files:"
            git diff --name-only -- lib test tool
            git add lib test tool
            git commit -m "style: repair exact V2.12 formatting drift"
          else
            echo "No Dart formatting drift was found."
          fi

          git rm .github/workflows/v212-format-diagnostic.yml
          git commit -m "ci: remove observable V2.12 formatting repair"
          git push origin HEAD:v2.12-missing-punctuation-space-2026-08-15
