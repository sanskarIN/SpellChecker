name: V2.15 one-time release gate

on:
  push:
    branches: [v2.15-unmatched-curly-brace-2026-08-15]

permissions:
  contents: write

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact V2.15 candidate
        uses: actions/checkout@v7
        with:
          ref: v2.15-unmatched-curly-brace-2026-08-15
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: |
          flutter pub get

      - name: Verify canonical formatting
        run: |
          dart format --output=none --set-exit-if-changed lib test tool

      - name: Analyze release candidate
        run: |
          flutter analyze

      - name: Run complete release tests
        run: |
          flutter test --reporter expanded

      - name: Run deterministic benchmark smoke
        run: |
          dart run tool/benchmark_large_document.dart \
            --repeats=4 \
            --warmup=0 \
            --iterations=1 \
            --spelling-limit=2 \
            --writing-limit=5 \
            --suggestions=0 \
            --language=en-US \
            --json

      - name: Build release web application
        run: |
          flutter build web --release

      - name: Verify V2.15 release identity and repository hygiene
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          def text(path: str) -> str:
              return Path(path).read_text()

          pubspec = text('pubspec.yaml')
          assert 'version: 2.15.0+20' in pubspec

          about = text('lib/features/editor/spell_checker_page.dart')
          assert "applicationVersion: '2.15.0'" in about
          assert 'unmatched-curly-brace' in about

          public_api = text('lib/writing.dart')
          assert "export 'writing/rules/unmatched_curly_brace_rule.dart';" in public_api

          analyzer = text('lib/writing/writing_analyzer.dart')
          assert "import 'rules/unmatched_curly_brace_rule.dart';" in analyzer
          assert 'UnmatchedCurlyBraceRule(),' in analyzer
          match = re.search(
              r'static const List<WritingRule> builtIns = <WritingRule>\[(.*?)\n  \];',
              analyzer,
              re.S,
          )
          assert match, 'could not locate built-in writing-rule registry'
          constructors = re.findall(r'^\s+[A-Za-z0-9_]+Rule\(\),\s*$', match.group(1), re.M)
          assert len(constructors) == 10, constructors

          curly_rule = text('lib/writing/rules/unmatched_curly_brace_rule.dart')
          assert "String get id => 'unmatched-curly-brace';" in curly_rule

          required_tests = [
              'test/unmatched_curly_brace_rule_test.dart',
              'test/v215_unmatched_curly_brace_integration_test.dart',
              'test/v215_bounded_curly_brace_analysis_test.dart',
              'test/v215_writing_diagnostic_summary_test.dart',
              'test/v215_curly_brace_stress_test.dart',
              'test/v215_review_query_curly_brace_test.dart',
              'test/v215_benchmark_curly_brace_test.dart',
              'test/v215_settings_transfer_rule_compatibility_test.dart',
              'test/v215_rule_preference_compatibility_widget_test.dart',
              'test/v215_unmatched_curly_brace_widget_test.dart',
          ]
          for path in required_tests:
              assert Path(path).is_file(), path

          prefs = text('test/v215_rule_preference_compatibility_widget_test.dart')
          assert 'v214RuleIds' in prefs
          assert 'Unmatched curly brace' in prefs
          settings = text('test/v215_settings_transfer_rule_compatibility_test.dart')
          assert "isNot(contains('unmatched-curly-brace'))" in settings
          assert "contains('unmatched-curly-brace')" in settings

          ledger = text('what_changed.md')
          assert '## V2.15 — Unmatched Curly Brace Diagnostics' in ledger
          assert '2.15.0+20' in ledger
          assert 'unmatched-curly-brace' in ledger

          changelog = text('CHANGELOG.md')
          assert '## [2.15.0] - 2026-08-15' in changelog
          readme = text('README.md')
          assert '`2.15.0+20`' in readme
          assert 'Unmatched Curly Brace Diagnostics' in readme

          assert Path('docs/V2_15_UNMATCHED_CURLY_BRACE.md').is_file()
          assert Path('docs/V2_15_FINAL_VALIDATION.md').is_file()

          manifest = json.loads(text('web/manifest.json'))
          assert 'unmatched-curly-brace' in manifest.get('description', '')

          lines = pubspec.splitlines()
          start = lines.index('dependencies:') + 1
          end = lines.index('dev_dependencies:')
          direct = []
          for line in lines[start:end]:
              if line and not line.startswith(' ') and line.endswith(':'):
                  raise AssertionError(f'unexpected YAML structure: {line}')
              if line.startswith('  ') and not line.startswith('    ') and ':' in line:
                  direct.append(line.strip().split(':', 1)[0])
          assert direct == ['flutter', 'shared_preferences'], direct

          assert Path('build/web/index.html').is_file()
          assert Path('build/web/main.dart.js').is_file()
          assert not Path('docs/V2_15_WORKING_SCOPE.md').exists()

          forbidden = [
              'tool/v215_release_sync.py',
              'tool/v215_functional_hardening.py',
              'tool/v215_widget_finder_fix.py',
              '.github/workflows/v215-release-sync.yml',
              '.github/workflows/v215-final-format.yml',
              '.github/workflows/v215-functional-format.yml',
              '.github/workflows/v215-functional-hardening.yml',
              '.github/workflows/v215-widget-finder-fix.yml',
              '.github/workflows/v215-test-diagnostic.yml',
              '.github/workflows/v215-second-diagnostic.yml',
          ]
          for path in forbidden:
              assert not Path(path).exists(), path
          PY

      - name: Remove one-time release gate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/v215-release-gate.yml
          git commit -m "ci(v215): remove one-time release gate"
          git push origin HEAD:v2.15-unmatched-curly-brace-2026-08-15
