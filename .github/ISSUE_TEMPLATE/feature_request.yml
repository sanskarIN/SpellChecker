name: Feature request
description: Propose an improvement to SpellChecker
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Describe the writing problem first, then the proposed behavior. Do not include private documents, sensitive personal vocabulary, or real user text.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem would this feature solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed behavior
      description: Describe what SpellChecker should do, including keyboard/accessibility behavior when relevant.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Spell-checking engine
        - Dictionary or language packs
        - Language selection / Unicode rules
        - Writing rules / writing insights
        - Suggestions or ranking
        - Text correction / replace all
        - Editor highlighting
        - Keyboard navigation / shortcuts
        - Undo / document workflow
        - Persistence / import-export
        - Accessibility / semantics
        - Documentation
        - Build / release
        - Other
    validations:
      required: true
  - type: checkboxes
    id: considerations
    attributes:
      label: Design considerations
      options:
        - label: This proposal can preserve local-first spelling behavior without transmitting editor text to a remote service.
          required: false
        - label: I described any new persisted data, network access, permissions, analytics, synchronization, or account requirement.
          required: false
        - label: I considered keyboard-only and screen-reader access for new editor controls.
          required: false
