name: Bug report
description: Report reproducible incorrect behavior in SpellChecker
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Do not include private documents, credentials, sensitive dictionary exports, writing-finding excerpts, correction-history content, or security exploit details here. Use synthetic sample text and vocabulary.
  - type: input
    id: version
    attributes:
      label: SpellChecker version or commit
      placeholder: v2.9.0 or commit SHA
    validations:
      required: true
  - type: input
    id: flutter
    attributes:
      label: Flutter version
      description: Required for local/development builds. If you are only using a hosted web build, write "hosted web build".
      placeholder: Output of flutter --version
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform or browser
      placeholder: Chrome on Windows 11
    validations:
      required: true
  - type: input
    id: language
    attributes:
      label: Selected language
      description: Include the pack ID/display name when relevant.
      placeholder: en-US / English (US)
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Spell checking or suggestions
        - Language selection / language packs
        - Writing insights / local writing rules
        - Writing analysis diagnostics / exact finding counts
        - Writing rule preference persistence
        - Writing individual safe fix
        - Writing apply-all batch fix / overlap handling
        - Writing review search / category filters
        - Writing automatic-fixes-only filter
        - Writing apply-visible batch fix
        - Writing reset rules to defaults
        - Writing shortcut (Ctrl/Command+Shift+Enter)
        - Unicode tokenization / normalization
        - Inline issue highlighting
        - Spelling issue navigation / F7 shortcuts
        - Single spelling replacement
        - Spelling replace all
        - Correction undo / batch undo grouping
        - Personal dictionary persistence
        - Import/export
        - Ignore-once/session behavior
        - Suggestion-count preference
        - Statistics
        - Layout/accessibility/semantics
        - Local storage warning
        - Build/CI/development tooling
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the incorrect behavior using non-sensitive synthetic text.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open SpellChecker
        2. Select en-US / en-GB ...
        3. Enter synthetic text ...
        4. Check spelling / open Writing insights / apply one or all fixes / Undo ...
        5. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: writing_context
    attributes:
      label: Writing-rule / batch context
      description: If relevant, include rule name/ID, enabled rule IDs (not private text), whether the problem is individual or Apply all safe fixes, applied/skipped counts, overlaps, and whether one Undo restored the pre-batch synthetic text.
  - type: textarea
    id: diagnostics_context
    attributes:
      label: Writing diagnostics context
      description: For V2.8/V2.9 count, limited-result, or diagnostic-summary problems, include maxIssues when applicable, captured count, exact overall total, exact per-rule totals, complete/truncated state, active review filters, and whether the text/language/rule settings changed after analysis. Use synthetic data only.
      placeholder: |
        maxIssues: 200
        captured: 200
        total: 437
        uncaptured: 237
        truncated: true
        per-rule totals: repeated-space=300, repeated-word=137
  - type: textarea
    id: editor_context
    attributes:
      label: Editor and keyboard context
      description: If relevant, include the exact shortcut/control, issue count/position, whether the visible equivalent works, whether text changed after checking/analysis, and whether the problem occurred before or after Undo. Use synthetic text only.
  - type: textarea
    id: persistence
    attributes:
      label: Persistence/import context
      description: If relevant, say whether this involves Save word, writing-rule switches, explicit disable-all, language switching, restart/reload, private/incognito mode, import format, export, suggestion-count restoration, or the local storage warning. Do not paste sensitive vocabulary or full local preference dumps.
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Add logs or screenshots only when they contain no private information.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: I used synthetic data and removed private or sensitive information from the report.
          required: true
        - label: I did not include a sensitive personal dictionary export, private writing finding, or private correction/document content.
          required: true

# V2.3 diagnostic note
# For portable-settings/review-preset bugs, include only minimized synthetic JSON/text. Never include private editor documents, personal dictionaries, credentials, or sensitive clipboard data.

# V2.8/V2.9 diagnostic note
# Analyzer-produced exact per-rule totals should sum to the exact overall total. Limited-result filters/fixes use retained findings only. V2.9 diagnostic summaries contain counts/rule metadata only. Prefer synthetic metadata/count examples over private documents.
