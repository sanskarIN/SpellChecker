name: Bug report
description: Report reproducible incorrect behavior in SpellChecker
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Do not include private documents, credentials, sensitive dictionary exports, correction-history content, or security exploit details here. Use synthetic sample text and vocabulary.
  - type: input
    id: version
    attributes:
      label: SpellChecker version or commit
      placeholder: v1.2.0 or commit SHA
    validations:
      required: true
  - type: input
    id: flutter
    attributes:
      label: Flutter version
      description: Required for local/development builds. If you are only using a hosted web build, write "hosted web build".
      placeholder: Output of flutter --version
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform or browser
      placeholder: Chrome on Windows 11
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Spell checking or suggestions
        - Inline issue highlighting
        - Issue navigation or keyboard shortcuts
        - Single replacement
        - Replace all
        - Correction undo
        - Personal dictionary persistence
        - Import/export
        - Ignore-once/session behavior
        - Suggestion-count preference
        - Statistics
        - Layout/accessibility/semantics
        - Local storage warning
        - Build/CI/development tooling
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the incorrect behavior using non-sensitive synthetic text.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open SpellChecker
        2. Enter synthetic text ...
        3. Check spelling / press F7 / choose Replace all / Undo ...
        4. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: editor_context
    attributes:
      label: Editor and keyboard context
      description: If relevant, include the exact shortcut/control, issue count/position, whether the visible equivalent control works, whether text changed after checking, and whether the problem occurred before or after Undo. Use synthetic text only.
  - type: textarea
    id: persistence
    attributes:
      label: Persistence/import context
      description: If relevant, say whether this involves Save word, Ignore once, restart/reload, private/incognito mode, import format, export, suggestion-count restoration, or the local storage warning. Do not paste sensitive vocabulary.
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Add logs or screenshots only when they contain no private information.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: I used synthetic data and removed private or sensitive information from the report.
          required: true
        - label: I did not include a sensitive personal dictionary export or private correction/document content.
          required: true
