name: Bug report
description: Report reproducible incorrect behavior in SpellChecker
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Do not include private documents, credentials, or security exploit details here.
  - type: input
    id: version
    attributes:
      label: SpellChecker version or commit
      placeholder: v1.0.0 or commit SHA
    validations:
      required: true
  - type: input
    id: flutter
    attributes:
      label: Flutter version
      placeholder: Output of flutter --version
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform or browser
      placeholder: Chrome on Windows 11
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the incorrect behavior using non-sensitive sample text.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open SpellChecker
        2. Enter ...
        3. Choose Check spelling
        4. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Add logs or screenshots only when they contain no private information.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: I removed private or sensitive information from the report.
          required: true
